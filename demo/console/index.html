<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ground:#0b1220; --panel:#121c2e; --panel2:#0f1829; --line:#22314c; --line2:#2c3d5c;
  --ink:#e8eef7; --muted:#8fa0b8; --faint:#61728c;
  --machine:#74c7d6;      /* 機械がやること */
  --human:#e8a33d;        /* 人がやること */
  --ok:#4ade80; --warn:#fbbf24; --ng:#f87171;
  --head:"Zen Kaku Gothic New","Yu Gothic UI","Yu Gothic",sans-serif;
  --sans:"Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
  --num:"Outfit","Yu Gothic UI",sans-serif;
  --mono:"Consolas","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.7;display:grid;grid-template-columns:246px 1fr;
  height:100vh;overflow:hidden;
}
/* ── 左の柱 ───────────────────────── */
.rail{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 0}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid var(--line)}
.brand .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1c3f7c,#74c7d6);
  display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:13px;color:#04101f}
.brand b{font-family:var(--head);font-size:14px;letter-spacing:.02em;display:block;line-height:1.35}
.brand span{font-size:10px;color:var(--faint);letter-spacing:.16em;font-family:var(--num)}
.nav{padding:14px 12px;display:grid;gap:2px}
.nav button{
  all:unset;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
  cursor:pointer;color:var(--muted);font-size:13px;transition:background .15s,color .15s;
}
.nav button:hover{background:#16223a;color:var(--ink)}
.nav button[aria-current="true"]{background:#182742;color:var(--ink);font-weight:700}
.nav .no{font-family:var(--num);font-size:11px;color:var(--faint);width:14px}
.nav button[aria-current="true"] .no{color:var(--machine)}
.rail-foot{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.legend{display:grid;gap:7px;margin-bottom:12px}
.legend div{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.m{background:var(--machine)} .dot.h{background:var(--human)}

/* ── 本体 ───────────────────────── */
.main{overflow-y:auto;padding:0 0 60px}
.top{
  position:sticky;top:0;z-index:5;background:rgba(11,18,32,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;gap:26px;flex-wrap:wrap
}
.top h1{font-family:var(--head);font-size:17px;margin:0;font-weight:900}
.top .sub{font-size:11.5px;color:var(--faint);margin-top:1px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.16);
  animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top .right{margin-left:auto;display:flex;gap:26px;align-items:center}
.kv{text-align:right}
.kv b{font-family:var(--num);font-size:19px;font-weight:700;display:block;line-height:1.15}
.kv small{font-size:10px;color:var(--faint);letter-spacing:.06em}
.kv.m b{color:var(--machine)} .kv.h b{color:var(--human)}
.wrap{padding:26px 32px;max-width:1180px}
.page{display:none} .page.on{display:block}

h2.sec{font-family:var(--head);font-size:20px;margin:0 0 4px;font-weight:900}
p.lead{color:var(--muted);margin:0 0 22px;font-size:13px;max-width:62em}
h3.sub{font-family:var(--head);font-size:14px;margin:26px 0 10px;display:flex;align-items:center;gap:9px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 17px}
.card .lb{font-size:10.5px;color:var(--faint);letter-spacing:.12em;font-family:var(--num);text-transform:uppercase}
.card .vl{font-family:var(--num);font-size:29px;font-weight:700;line-height:1.15;margin-top:5px}
.card .un{font-size:12px;color:var(--muted);margin-left:3px;font-family:var(--sans)}
.card .nt{font-size:11px;color:var(--faint);margin-top:3px}
.card.m .vl{color:var(--machine)} .card.h .vl{color:var(--human)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px}
.panel + .panel{margin-top:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split3{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;padding:2.5px 9px;border-radius:20px;
  border:1px solid var(--line2);color:var(--muted);font-family:var(--num);letter-spacing:.08em}
.tag.m{color:var(--machine);border-color:rgba(116,199,214,.45);background:rgba(116,199,214,.09)}
.tag.h{color:var(--human);border-color:rgba(232,163,61,.45);background:rgba(232,163,61,.10)}

/* 端末の出力 */
.term{background:#060d18;border:1px solid var(--line);border-radius:11px;overflow:hidden;font-family:var(--mono)}
.term .bar{background:#0c1626;border-bottom:1px solid var(--line);padding:7px 12px;display:flex;gap:6px;align-items:center}
.term .bar i{width:9px;height:9px;border-radius:50%;background:#2b3b56;display:block}
.term .bar span{margin-left:8px;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.term pre{margin:0;padding:13px 15px;font-size:11.5px;line-height:1.85;color:#9fb4cf;white-space:pre-wrap;
  max-height:330px;overflow:auto}
.term .g{color:#5ee08a} .term .r{color:#ff8b8b} .term .y{color:#ffcc66} .term .c{color:#7fd3e3}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:10.5px;color:var(--faint);letter-spacing:.1em;font-family:var(--num);text-transform:uppercase;font-weight:600}
td.n{font-family:var(--num);text-align:right}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:5px;font-family:var(--num);font-weight:600}
.pill.ok{background:rgba(74,222,128,.14);color:var(--ok)}
.pill.ng{background:rgba(248,113,113,.15);color:var(--ng)}
.pill.wt{background:rgba(232,163,61,.15);color:var(--human)}

/* 工程の帯 */
.flow{display:flex;gap:0;align-items:stretch;margin:6px 0 4px}
.step{flex:1;background:var(--panel);border:1px solid var(--line);padding:11px 12px;position:relative}
.step:first-child{border-radius:11px 0 0 11px} .step:last-child{border-radius:0 11px 11px 0}
.step + .step{border-left:none}
.step .w{font-size:10px;letter-spacing:.1em;font-family:var(--num);display:flex;align-items:center;gap:6px}
.step .t{font-size:12px;font-weight:700;margin-top:5px;font-family:var(--head)}
.step.m .w{color:var(--machine)} .step.h .w{color:var(--human)}
.step.h{background:linear-gradient(180deg,rgba(232,163,61,.10),rgba(232,163,61,.03))}
.step.now{outline:1.5px solid var(--machine);outline-offset:-1.5px;z-index:1}
.step.now.h{outline-color:var(--human)}

/* 人の確認キュー */
.q{display:grid;gap:9px}
.qi{display:flex;gap:13px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-left:2.5px solid var(--human);border-radius:9px;padding:12px 15px}
.qi .ic{font-family:var(--num);font-size:11px;color:var(--human);padding-top:2px;min-width:15px}
.qi b{font-family:var(--head);font-size:13px;display:block}
.qi p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.7}
.qi .st{margin-left:auto;text-align:right;min-width:96px}

.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;font-size:12px}
.checks div{display:flex;gap:8px;align-items:baseline;color:var(--muted);padding:3px 0}
.checks .cm{color:var(--machine);font-family:var(--num);font-size:10px}
.checks .ch{color:var(--human);font-family:var(--num);font-size:10px}

.bars{display:grid;gap:9px;margin-top:4px}
.bar{display:grid;grid-template-columns:88px 1fr 40px;align-items:center;gap:11px;font-size:12px}
.bar .tr{height:7px;background:#182742;border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,#1c3f7c,var(--machine));border-radius:4px}
.bar .vv{font-family:var(--num);text-align:right;color:var(--muted);font-size:11.5px}
.note{font-size:11px;color:var(--faint);margin-top:12px;line-height:1.75}
.kbd{font-family:var(--mono);font-size:11px;background:#0a1424;border:1px solid var(--line);
  border-radius:5px;padding:1.5px 6px;color:var(--machine)}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById("D").textContent);
const T = D.totals, R = D.rules;
const HUMAN_ITEMS = R.plan + R.ai_feel + R.agents;

const term = (lines) => {
  const paint = (l) => {
    let s = l.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    s = s.replace(/^(PASS)/, '<span class="g">$1</span>')
         .replace(/^(FAIL|NG)/, '<span class="r">$1</span>')
         .replace(/(\[禁止\])/g, '<span class="r">$1</span>')
         .replace(/(判定: 着手可)/, '<span class="g">$1</span>')
         .replace(/(判定: 着手禁止（既存記事を書き足す）)/, '<span class="r">$1</span>')
         .replace(/(■[^\n]*)/, '<span class="c">$1</span>');
    return s;
  };
  return lines.map(paint).join("\n");
};
const box = (title, lines) => `<div class="term"><div class="bar"><i></i><i></i><i></i>
  <span>${title}</span></div><pre>${term(lines)}</pre></div>`;

const flow = (nowIdx) => {
  const st = [["機械","題材を決める","m"],["機械","食い合いを審査","m"],["人","書かない判断","h"],
              ["機械","構成と執筆","m"],["機械","19項目を検査","m"],["人","81項目を採点","h"],
              ["機械","公開と通知","m"]];
  return `<div class="flow">` + st.map(([w,t,c],i) =>
    `<div class="step ${c}${i===nowIdx?" now":""}"><div class="w"><i class="dot ${c}"></i>${w}</div>
     <div class="t">${t}</div></div>`).join("") + `</div>`;
};

// 描画
const nav = document.getElementById("nav"), pages = document.getElementById("pages");
nav.innerHTML = PAGES.map((p,i)=>
  `<button data-i="${i}" aria-current="${i===0}"><span class="no">${String(i+1).padStart(2,"0")}</span>${p.nav}</button>`).join("");
pages.innerHTML = PAGES.map((p,i)=>`<section class="page${i===0?" on":""}" id="pg-${p.id}">${p.html()}</section>`).join("");
document.getElementById("kA").textContent = R.machine + "項目";
document.getElementById("kB").textContent = HUMAN_ITEMS + "項目";

function go(i){
  document.querySelectorAll(".page").forEach((s,j)=>s.classList.toggle("on", i===j));
  nav.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-current", String(i===j)));
  document.getElementById("ttl").textContent = PAGES[i].ttl;
  document.getElementById("stl").textContent = PAGES[i].stl;
  document.querySelector(".main").scrollTop = 0;
}
nav.addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
window.__go = go;
</script>
</body>
</html>
