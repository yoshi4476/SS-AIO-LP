name: Deploy to Cloudflare Pages

# site/ が更新されるたび（=記事の自動公開のたび）にCloudflare Pagesへデプロイ
on:
  push:
    branches: [master]
    paths: ["site/**", "functions/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare Pagesへデプロイ（初回はプロジェクトを自動作成）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 公開前の門: sitemapの404/noindex・git の衝突マーカーがあれば公開しない（seo_audit --gate）
          python3 scripts/seo_audit.py --gate || { echo "::error::サイト監査の門で止めました（上の ::error:: を直す）"; exit 1; }
          npx --yes wrangler@4.121.0 pages project create ss-aio-lp --production-branch=master 2>/dev/null || echo "プロジェクトは作成済み"
          ok=""
          for i in 1 2 3; do
            npx --yes wrangler@4.121.0 pages deploy site --project-name=ss-aio-lp --branch=master --commit-dirty=true && { ok=1; break; }
            echo "Cloudflare APIが応答せず（$i/3）。40秒後に再試行"
            sleep 40
          done
          [ -n "$ok" ] || { echo "::error::3回ともデプロイ失敗"; exit 1; }
          echo "デプロイ完了。公開URLは上のログ（https://ss-aio-lp.pages.dev または deployment URL）を確認"
