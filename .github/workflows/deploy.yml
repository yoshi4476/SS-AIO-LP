name: Deploy to Cloudflare Pages

# site/ が更新されるたび（=記事の自動公開のたび）にCloudflare Pagesへデプロイ
on:
  push:
    branches: [master]
    paths: ["site/**", "functions/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare Pagesへデプロイ（初回はプロジェクトを自動作成）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create ss-aio-lp --production-branch=master 2>/dev/null || echo "プロジェクトは作成済み"
          npx --yes wrangler@4 pages deploy site --project-name=ss-aio-lp --branch=master --commit-dirty=true
          echo "デプロイ完了。公開URLは上のログ（https://ss-aio-lp.pages.dev または deployment URL）を確認"
