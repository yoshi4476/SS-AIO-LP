name: Deploy to Cloudflare Pages

# site/ が更新されるたび（=記事の自動公開のたび）にCloudflare Pagesへデプロイ
on:
  push:
    branches: [master]
    # 原稿・雛形・ビルドの材料が変わったときも公開し直す（公開の前に作り直すため）
    paths: ["site/**", "functions/**", "articles/**", "templates/**", "scripts/**",
            "data/research/**", "data/season_calendar.json", "data/industries.json"]
  workflow_dispatch:
    inputs:
      force:
        description: "本番と同じ中身でも送る（指紋の比較を飛ばす）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 非公開のデータ（お客様の情報・料金・レポート）を private/ に取得し、お客様の守秘の語をログで伏せる
      # （public のリポジトリでは CI のログも誰でも読める。2026-10-10 運用者の指示・門 gates_history_h76）
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}

      # 日本語フォント（fonts-noto-cjk）の控え。apt-get update と入れるのに約15秒かかり、作り直しの前の待ちの大半だった
      # （2026-10-10 の配信）。控えはランナーの OS の版で切る（版が変われば apt で入れ直して控え直す）
      - name: ランナーの版
        id: img
        run: echo "os=${ImageOS:-unknown}-${ImageVersion%%.*}" >> "$GITHUB_OUTPUT"
      - name: 日本語フォントの控えを戻す
        id: fonts
        uses: actions/cache/restore@v4
        with:
          path: ~/.fonts-ci
          key: ja-fonts-v1-${{ steps.img.outputs.os }}

      # 互いに関係ない準備を先に裏で始める（終わりは使う工程が印のファイルで待つ）。2026-10-03〜09 の147回で、
      # 順に入れて作り直しまで平均37秒・wrangler の取得が送り出しの工程の頭で平均14秒かかっていた。
      # 調査ページの「貼れる図」は日本語フォントで描く。無いと図だけ外れて公開される（2026-10-05 に全ページで欠けていた）。
      # 図は Pillow がフォントのパス（/usr/share/fonts/opentype/noto/）で読むので、控えを同じ場所へ写せば apt と同じになる。
      # wrangler は送り出しの工程で同じ版を使うので、ここでは取っておくだけ（取れなくても送り出しの工程が取り直す）
      - name: 時間のかかる準備を先に始める（日本語フォント・wrangler）
        run: |
          if [ -f ~/.fonts-ci/done ] && [ -d ~/.fonts-ci/noto ]; then
            # 写せなければ apt で入れる（控えが壊れていても図は外れない）
            ( ( { sudo mkdir -p /usr/share/fonts/opentype && sudo cp -r ~/.fonts-ci/noto /usr/share/fonts/opentype/ \
                  && [ -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc ]; } \
                || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; } ) > /tmp/apt.log 2>&1
              echo $? > /tmp/apt.rc ) < /dev/null > /dev/null 2>&1 &
          else
            ( (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk) > /tmp/apt.log 2>&1; rc=$?
              if [ "$rc" = 0 ] && [ -d /usr/share/fonts/opentype/noto ]; then
                rm -rf ~/.fonts-ci && mkdir -p ~/.fonts-ci && cp -r /usr/share/fonts/opentype/noto ~/.fonts-ci/ && touch ~/.fonts-ci/done
              fi
              echo $rc > /tmp/apt.rc ) < /dev/null > /dev/null 2>&1 &
          fi
          ( npx --yes wrangler@4.121.0 --version > /tmp/wrangler-prefetch.log 2>&1; echo $? > /tmp/wrangler.rc ) < /dev/null > /dev/null 2>&1 &

      # Python と依存（requirements.txt）を週ごとの控えから戻す。戻せた回は下の pip install が確かめるだけになる
      - uses: ./.github/actions/py-env

      # 公開の直前に原稿から作り直す。コミットされた生成ページが古い・衝突の解き方を誤った、
      # という状態でも、公開されるのは原稿と雛形から作ったものになる（2026-10-03 に衝突の解消が1日3回要った）。
      # 日付で切り替わる特集（season_feature）も、公開した日の暦で出る。
      # 作り直しに失敗したら、コミット済みのページをそのまま公開する（公開を止めない）
      - name: 原稿から作り直す
        id: build
        run: |
          # どれも失敗しても止めないのは前と同じ
          python -m pip install --quiet -r requirements.txt || true
          # 日本語フォントを入れ終えてから作り直す（最初の工程で裏で始めたもの。最長5分待つ）
          for i in $(seq 1 300); do [ -f /tmp/apt.rc ] && break; sleep 1; done
          [ "$(cat /tmp/apt.rc 2>/dev/null)" = "0" ] || echo "::warning::日本語フォントを入れられませんでした（図だけ外れることがあります）"
          [ -f ~/.fonts-ci/done ] && echo "fonts=ready" >> "$GITHUB_OUTPUT"
          echo "準備の待ち: 工程の頭から ${SECONDS}秒（日本語フォント $(ls /usr/share/fonts/opentype/noto 2>/dev/null | wc -l)本・控え ${{ steps.fonts.outputs.cache-hit == 'true' && 'あり' || 'なし' }}）"
          python scripts/build.py > /tmp/build.log 2>&1 && echo "作り直しました" \
            || { tail -20 /tmp/build.log; git checkout -- site; echo "::warning::作り直しに失敗したため、コミット済みのページを公開します"; }
          tail -3 /tmp/build.log
          echo "作り直し: 工程の頭から ${SECONDS}秒"

      # apt で入れた回だけ、日本語フォントを控える（次の回から apt を待たない）
      - name: 日本語フォントを控える
        if: steps.fonts.outputs.cache-hit != 'true' && steps.build.outputs.fonts == 'ready'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.fonts-ci
          key: ja-fonts-v1-${{ steps.img.outputs.os }}

      - name: Cloudflare Pagesへデプロイ（初回はプロジェクトを自動作成）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          # 公開前の門: sitemapの404/noindex・git の衝突マーカーがあれば公開しない（seo_audit --gate）
          python3 scripts/seo_audit.py --gate || { echo "::error::サイト監査の門で止めました（上の ::error:: を直す）"; exit 1; }
          # 本番と同じ中身なら送らない（作り直しと門は上で通している）。2026-10-03〜09 の147回のうち68回は
          # 新しいファイルが0本だった。指紋が違う・読めない・本番に指紋が無いときは送る（scripts/deploy_marker.py）。
          # 鍵の設定も一緒に省く: Pages の鍵は新しい送り出しから効くので、送らない回に入れても変わらない
          if [ "${{ inputs.force }}" != "true" ]; then
            same=$(python3 scripts/deploy_marker.py --same https://ss-aio-lp.pages.dev --salt wrangler@4.121.0) || same="SAME=no"
            echo "$same"
            if echo "$same" | grep -q '^SAME=yes'; then
              echo "::notice::本番と同じ中身のため、Cloudflare への送り出しを省きました（作り直しと公開前の門は通しています）"
              echo "本番と同じ中身のため送り出しを省きました" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # 最初の工程で裏で取り始めた wrangler を取り終えるまで待つ（同じ取り置きを同時に書き換えない。最長2分）
          for i in $(seq 1 120); do [ -f /tmp/wrangler.rc ] && break; sleep 1; done
          python3 scripts/deploy_marker.py --write --salt wrangler@4.121.0
          npx --yes wrangler@4.121.0 pages project create ss-aio-lp --production-branch=master 2>/dev/null || echo "プロジェクトは作成済み"
          # AI紹介チェック（functions/api/ai-check.js）が使う鍵。Gemini の検索つき回答は有料（無料枠では使えない）なので、
          # 回数の上限（月の検索5,000回・同じ回線1日2回）と、ロボットよけ（Turnstile）の鍵を一緒に入れる
          for k in GEMINI_API_KEY TURNSTILE_SITEKEY TURNSTILE_SECRET; do
            val="${!k}"
            [ -z "$val" ] && continue
            printf '%s' "$val" | npx --yes wrangler@4.121.0 pages secret put "$k" --project-name=ss-aio-lp > /dev/null 2>&1 \
              && echo "$k を Cloudflare に設定しました" \
              || echo "::warning::$k を Cloudflare に設定できませんでした（AI紹介チェックが動かないか、ロボットよけが効きません）"
          done
          ok=""
          for i in 1 2 3; do
            npx --yes wrangler@4.121.0 pages deploy site --project-name=ss-aio-lp --branch=master --commit-dirty=true && { ok=1; break; }
            echo "Cloudflare APIが応答せず（$i/3）。40秒後に再試行"
            sleep 40
          done
          [ -n "$ok" ] || { echo "::error::3回ともデプロイ失敗"; exit 1; }
          echo "デプロイ完了。公開URLは上のログ（https://ss-aio-lp.pages.dev または deployment URL）を確認"

      # この回に書いた・直したお客様の社の記事・画像・台本・記録を非公開のリポジトリへ残す（公開側の git には入れない。
      # 公開側に commit が無い回も残す。門 gates_history_h77）
      - uses: ./.github/actions/private-data
        if: always()
        with: {mode: save}

