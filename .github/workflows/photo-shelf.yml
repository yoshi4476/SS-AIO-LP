name: Photo Shelf

# 記事サムネイルの「写真の棚」に、足りない業種・作業の写真を足す（週1回）。
# 作るのは ChatGPT のサブスク（Codex CLI の画像生成）で、課金APIは使わない。
# ログイン情報は Secrets の CODEX_AUTH_JSON（手元の ~/.codex/auth.json）。
on:
  schedule:
    - cron: "17 2 * * 1"   # 月曜 11:17 JST
  workflow_dispatch:

# Codex（同じログイン情報）を使う工程は1つずつ回す。同時に動くと、片方がログイン情報を更新して
# もう片方の手元の情報が無効になる（業種調査・業種調査の聞き足しと同じ group）
concurrency:
  group: industry-research
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 非公開のデータ（お客様の情報・料金・レポート）を private/ に取得し、お客様の守秘の語をログで伏せる
      # （public のリポジトリでは CI のログも誰でも読める。2026-10-10 運用者の指示・門 gates_history_h76）
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 依存インストール
        run: |
          pip install -q pillow pyyaml
          npm i -g @openai/codex >/dev/null 2>&1

      - name: Codex にログインする
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then echo "::warning::CODEX_AUTH_JSON 未登録"; exit 1; fi
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          sha256sum ~/.codex/auth.json | cut -c1-64 > /tmp/auth.before
          codex login status

      - name: 棚の点検と、足りない写真を作る
        run: |
          python scripts/photo_shelf.py --check | tail -3
          timeout 45m python scripts/photo_shelf.py --generate --limit 20 || true
          python -c "import sys;sys.path.insert(0,'scripts');import photo_shelf as p;p.ensure_jpg()"

      - name: 更新されたログイン情報を Secrets に戻す
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_TOKEN }}
        run: |
          [ -f ~/.codex/auth.json ] && [ -f /tmp/auth.before ] || exit 0
          [ "$(sha256sum ~/.codex/auth.json | cut -c1-64)" = "$(cat /tmp/auth.before)" ] && exit 0
          if [ -z "$GH_TOKEN" ]; then echo "::warning::GH_SECRET_TOKEN が無く、更新されたログイン情報を戻せません"; exit 0; fi
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < ~/.codex/auth.json && echo "ログイン情報を更新しました"

      - name: 片付け
        if: always()
        run: rm -f ~/.codex/auth.json /tmp/auth.before

      - name: コミット
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          git add site/images/shelf
          if git diff --cached --quiet; then echo "足す写真なし"; exit 0; fi
          git commit -m "写真の棚: 足りない写真を追加 $(date '+%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          # GITHUB_TOKEN の push では deploy.yml が動かないので、公開を明示的に起動する
          GH_TOKEN="${{ github.token }}" gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" || echo "::warning::公開を起動できませんでした"

      # この回に書いた・直したお客様の社の記事・画像・台本・記録を非公開のリポジトリへ残す（公開側の git には入れない。
      # 公開側に commit が無い回も残す。門 gates_history_h77）
      - uses: ./.github/actions/private-data
        if: always()
        with: {mode: save}

