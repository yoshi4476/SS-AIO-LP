name: Multi-Site Article Pipeline

# 全サイトの記事生成を1本のワークフローにまとめたもの。
# どのサイトを書くかは sites/*.json の並び順で決める（JST = UTC+9）。
# 各サイト1日2本。1回の実行が10〜17分かかるため2時間ずつ空け、
# 同時実行によるpush競合とActionsの待ち行列を避けている。
#
# 枠は20ある（1社2本 × 10社）。サイトが少ないときは余った枠が何もせず終わるので、
# 1サイトなら1日2本、2サイトなら4本になる。**10社が上限**で、
# 11社目からは枠が無く記事が書かれない。超えたら実行のたびにエラーで知らせる。
# その規模になったら、別リポジトリに分けて運用すること。
on:
  schedule:
    # 1社2本／日。枠はサイト数ぶんだけ使い、余った枠は何もしない。
    # 先頭6枠は3社運用時の公開時刻そのままにしてある（増やしても既存3社はずれない）。
    # 20枠＝10社が上限。11社目からは別リポジトリに分けること（下でアラートを出す）
    - cron: "0 23 * * *"  # JST 08:00 — 枠0（既存）
    - cron: "0 1 * * *"   # JST 10:00 — 枠1（既存）
    - cron: "0 3 * * *"   # JST 12:00 — 枠2（既存）
    - cron: "0 6 * * *"   # JST 15:00 — 枠3（既存）
    - cron: "0 8 * * *"   # JST 17:00 — 枠4（既存）
    - cron: "0 10 * * *"  # JST 19:00 — 枠5（既存）
    - cron: "0 0 * * *"   # JST 09:00 — 枠6（10社まで対応するための追加枠）
    - cron: "0 2 * * *"   # JST 11:00 — 枠7（10社まで対応するための追加枠）
    - cron: "0 4 * * *"   # JST 13:00 — 枠8（10社まで対応するための追加枠）
    - cron: "0 5 * * *"   # JST 14:00 — 枠9（10社まで対応するための追加枠）
    - cron: "0 7 * * *"   # JST 16:00 — 枠10（10社まで対応するための追加枠）
    - cron: "0 9 * * *"   # JST 18:00 — 枠11（10社まで対応するための追加枠）
    - cron: "0 11 * * *"  # JST 20:00 — 枠12（10社まで対応するための追加枠）
    - cron: "0 12 * * *"  # JST 21:00 — 枠13（10社まで対応するための追加枠）
    - cron: "0 13 * * *"  # JST 22:00 — 枠14（10社まで対応するための追加枠）
    - cron: "0 14 * * *"  # JST 23:00 — 枠15（10社まで対応するための追加枠）
    - cron: "0 15 * * *"  # JST 00:00 — 枠16（10社まで対応するための追加枠）
    - cron: "0 16 * * *"  # JST 01:00 — 枠17（10社まで対応するための追加枠）
    - cron: "0 17 * * *"  # JST 02:00 — 枠18（10社まで対応するための追加枠）
    - cron: "0 18 * * *"  # JST 03:00 — 枠19（10社まで対応するための追加枠）
    # 枠20〜39（20社まで）。cron の並び順がそのまま枠番号になる（case 文は無い）。
    # 実行は concurrency で直列なので、枠を足しても同時実行は増えない
    - cron: "30 23 * * *"  # JST 08:30 — 枠20
    - cron: "30 0 * * *"   # JST 09:30 — 枠21
    - cron: "30 1 * * *"   # JST 10:30 — 枠22
    - cron: "30 2 * * *"   # JST 11:30 — 枠23
    - cron: "30 3 * * *"   # JST 12:30 — 枠24
    - cron: "30 4 * * *"   # JST 13:30 — 枠25
    - cron: "30 5 * * *"   # JST 14:30 — 枠26
    - cron: "30 6 * * *"   # JST 15:30 — 枠27
    - cron: "30 7 * * *"   # JST 16:30 — 枠28
    - cron: "30 8 * * *"   # JST 17:30 — 枠29
    - cron: "30 9 * * *"   # JST 18:30 — 枠30
    - cron: "30 10 * * *"  # JST 19:30 — 枠31
    - cron: "30 11 * * *"  # JST 20:30 — 枠32
    - cron: "30 12 * * *"  # JST 21:30 — 枠33
    - cron: "30 13 * * *"  # JST 22:30 — 枠34
    - cron: "30 14 * * *"  # JST 23:30 — 枠35
    - cron: "30 15 * * *"  # JST 00:30 — 枠36
    - cron: "30 16 * * *"  # JST 01:30 — 枠37
    - cron: "30 17 * * *"  # JST 02:30 — 枠38
    - cron: "30 18 * * *"  # JST 03:30 — 枠39
  workflow_dispatch:
    inputs:
      site:
        description: "対象サイト（空なら sites/ の並び順で判定）"
        type: string
        default: ""

permissions:
  contents: write

# concurrency はワークフロー単位ではなく、記事を書く job（write）にだけ付ける。
# ワークフロー単位だと空き枠の run までグループに並び、GitHub の仕様（待てるのは1件）で
# 待機中の実枠や週次を後から来た空き枠が取り消していた（月曜の12:00の枠が12:30の空き枠に消された）。
# 枠の判定（select）はグループの外で終え、空き枠はグループに並ばずに終わる

env:
  TZ: Asia/Tokyo

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.site.outputs.skip }}
      id: ${{ steps.site.outputs.id }}
      own: ${{ steps.site.outputs.own }}
      first: ${{ steps.site.outputs.first }}
      over: ${{ steps.site.outputs.over }}
    steps:
      - uses: actions/checkout@v4

      - name: 対象サイトの判定
        id: site
        run: |
          # sites/*.json の並び順で決める。サイトIDを直接書くと、
          # 別の会社へ移したときに存在しないサイトを指したまま毎日空振りする。
          # 並び順は sites/<id>.json の priority（小さいほど先）。同じなら名前順。
          # 名前順だけで並べていたため、「abc-」で始まるクライアントを1社足すだけで
          # いちばん伸ばしたいサイトが後ろの枠へ押し出される状態だった。
          # 枠0（JST 08:00）は最も早く公開できる枠なので、優先度は明示して持つ
          mapfile -t SITES < <(python scripts/site_order.py)
          N=${#SITES[@]}
          # 時刻ごとの枠を0から数える。枠の番号をサイト数で割った余りを使う。
          # 以前は枠に 0/1/2 を直接書いていたため、4社目以降は一度も選ばれず
          # 記事が1本も書かれなかった（サイトを増やしても静かに無視される）。
          # 余りにすると、枠が足りなくても全社に行き渡る（本数は減る）。
          # 3社なら 0,1,2,0,1,2 で今までと同じ割り当てになる。
          # 本数を戻したいときは cron を増やし、下の case に枠番号を足す
          # 枠の番号は、このファイルの cron の並び順から機械で決める。以前は case 文に
          # 20行を手で書いていたため、cron を足しても case を足し忘れると枠0に潰れた。
          # cron を1行足せば枠が1つ増える（上限＝cron の本数÷2 社）
          read -r slot SLOTS < <(python - "${{ github.event.schedule }}" <<'PY'
          import re, sys
          crons = re.findall(r'^\s*- cron:\s*"([^"]+)"', open(".github/workflows/pipeline-multi.yml", encoding="utf-8").read(), re.M)
          s = sys.argv[1].strip()
          print(crons.index(s) if s in crons else 0, len(crons))
          PY
          )
          s="${{ inputs.site }}"
          if [ -z "$s" ]; then
            if [ "$N" -eq 0 ]; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "sites/*.json がありません。何もしません"
              exit 0
            fi
            # 枠は20（1社2本×10社）。これを超えた分は枠が無く、記事が
            # 書かれないまま静かに放置される。1日1回の実行でも必ず目に入るようにする
            CAP=$(( SLOTS / 2 ))
            if [ "$N" -gt "$CAP" ]; then
              echo "::error::サイトが${N}件あります。枠は${SLOTS}（1社2本で${CAP}社まで）。cron を2本足すと1社増やせます"
              # この job と記事を書く job はランナーが別。findings.txt は write 側で書く
              echo "over=要対応: サイトが${N}件で枠の上限${CAP}社を超えました。pipeline-multi.yml に cron を2本足すか、別リポジトリに分けてください（今の枠では本数が減ります）" >> "$GITHUB_OUTPUT"
            fi
            # 1サイトあたり1日2本まで（CLAUDE.md の上限）。サイト数が少ないと
            # 余りだけでは同じサイトに何度も回り、1社のとき1日6本になってしまう
            if [ "$slot" -ge $(( N * 2 )) ]; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "枠$slot は余りです（サイト数 $N × 2本 = $(( N * 2 )) 枠で足りています）"
              exit 0
            fi
            i=$(( slot % N ))
            echo "枠$slot ÷ サイト数$N → $i 番目（${SITES[$i]}）"
            s="${SITES[$i]}"
          fi
          # 自前でビルドするサイトかどうか。デプロイと配信の分岐に使う
          own=$(python -c "import json;print(json.load(open('sites/$s.json',encoding='utf-8')).get('type')=='self-static')")
          first="${SITES[0]}"
          echo "id=$s" >> "$GITHUB_OUTPUT"
          echo "own=$own" >> "$GITHUB_OUTPUT"
          echo "first=$first" >> "$GITHUB_OUTPUT"
          echo "対象サイト: $s（自前ビルド: $own / 全$N サイト）"

  write:
    needs: select
    if: needs.select.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # 並ぶのは実際に記事を書く枠だけ。週次・救済（pipeline.yml）とも同じグループで直列にする
    concurrency:
      group: article-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # 以降の工程は steps.site.outputs.* で読む（select の判定をそのまま受け取る）
      - name: 対象サイト（select の判定を受け取る）
        id: site
        run: |
          {
            echo "id=${{ needs.select.outputs.id }}"
            echo "own=${{ needs.select.outputs.own }}"
            echo "first=${{ needs.select.outputs.first }}"
          } >> "$GITHUB_OUTPUT"
          # 配信先のビルドを探す起点。push の後の時刻にすると、先に始まったビルドを見失う
          echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          over="${{ needs.select.outputs.over }}"
          if [ -n "$over" ]; then
            mkdir -p automation/logs
            echo "$over" >> automation/logs/findings.txt
          fi
          echo "対象サイト: ${{ needs.select.outputs.id }}"

      - uses: actions/setup-python@v5
        if: steps.site.outputs.skip != 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        if: steps.site.outputs.skip != 'yes'
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          npm install -g @anthropic-ai/claude-code
          # ネイティブバイナリが落ちてこないことがある（postinstallが走らない／
          # optional依存が省かれる）。実行時まで気づけず、記事生成ごと落ちる。
          # ここで動作を確かめ、駄目ならインストーラを直接叩き直す。
          if ! claude --version >/dev/null 2>&1; then
            echo "claude が動かないため postinstall をやり直します"
            node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs" || true
          fi
          claude --version

      - name: Git識別情報の設定
        if: steps.site.outputs.skip != 'yes'
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"

      # 記事を1本書いてから最後のpushで落ちるのが一番もったいない。
      # トークンが失効していれば、着手前にここで止める。
      - name: 配信トークンの事前確認
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.own != 'True'
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          out=$(python scripts/token_check.py) || true
          echo "$out"
          if echo "$out" | grep -q "TOKEN_OK=yes"; then
            exit 0
          fi
          # 原因を決めつけない。GitHub側の5xxで「再発行してください」と出すと、
          # 無効でないトークンを作り直すことになり、原因が残ったままになる。
          if echo "$out" | grep -q "トークンの問題ではありません"; then
            echo "::error::GitHub側の問題で確認できませんでした。トークンの再発行では直りません。githubstatus.com を確認し、時間をおいて再実行してください"
          elif echo "$out" | grep -q "権限不足"; then
            echo "::error::SITE_PUSH_TOKEN の権限が足りません。github.com/settings/personal-access-tokens で該当トークンを開き、Repository permissions の Contents を Read and write にして Update token。その後 python scripts/set_secrets.py --apply で .env と Secrets を更新してください"
          else
            echo "::error::SITE_PUSH_TOKEN が使えません。再発行して Secrets と .env の両方を更新してください"
          fi
          exit 1

      - name: 執筆ブリーフの表示（KW残数と担当領域をログに残す）
        if: steps.site.outputs.skip != 'yes'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: python scripts/site_brief.py "${{ steps.site.outputs.id }}"

      - name: 全サイト横断のカニバリ・領域チェック
        if: steps.site.outputs.skip != 'yes'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: python scripts/cannibal_check.py --cross || true

      # 手順書に「必ず実行すること」と書いても、それは関門ではない。
      # 実行を忘れれば素通りする。実際、タイトル類似だけのゲートを通り抜けて
      # 狙う範囲が8記事と重なり、51語・表示484回でクリック0の記事ができた。
      # ここで止めれば、書き始める前に判定が終わる。
      - name: 食い合いゲート（執筆前）
        if: steps.site.outputs.skip != 'yes'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          out=$(python scripts/kw_gate.py --before --site "${{ steps.site.outputs.id }}") || true
          rm -f indexing-service-account.json
          echo "$out"
          if echo "$out" | grep -q "KW_GATE=block"; then
            echo "::error::次のKWが既存ページと食い合います。台帳を直すまで記事を書きません"
            exit 1
          fi

      # 一次情報を先に集めておく。執筆側に任せると取りこぼすため、
      # 次に書くKWで文字起こしを取得し、本文を読める状態にしておく
      - name: 一次情報の収集（YouTube文字起こし）
        if: steps.site.outputs.skip != 'yes'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          pip install --quiet yt-dlp
          python scripts/research_next.py "${{ steps.site.outputs.id }}" || true

      - name: 記事生成（Phase 1〜7）
        if: steps.site.outputs.skip != 'yes'
        env:
          SITE_ID: ${{ steps.site.outputs.id }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 社数が増えてサブスクの枠に当たったら、API の従量課金に切り替える（鍵を登録するだけ。
          # 記事1本 ¥50〜150 の目安。未登録なら空で、claude はサブスクの鍵を使う）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          # 公開直後のSNS投稿（publish_flow → post_social）。未登録の媒体は黙って飛ばす
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          # 社ごとのアカウント（social_connect.py が登録。クライアントの記事はその社にだけ投稿する）
          SOCIAL_TOKENS_JSON: ${{ secrets.SOCIAL_TOKENS_JSON }}
        run: |
          # 未登録の鍵は空文字で渡る。空のまま置くと claude が API の鍵として扱って落ちるので外す
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          # 1回で書けなくても、その日の記事は落とさない。書けたかどうかを
          # 記事ファイルの数で判定し、増えるまで繰り返す。回数を切るのは、
          # 壊れたまま無限に回して実行時間を食い潰さないため。
          # 記事はいちばん強いモデルで書く。ただし版が古いと 400 で落ちるため、
          # 版を見て切り替える（実測: 2.1.218 は claude-opus-5-5 を
          # 「version 2.1.280 or newer is required」で拒否した）
          V=$(claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          MODEL_ARG="--model claude-opus-5"
          if [ "$(printf '%s\n2.1.280\n' "$V" | sort -V | head -1)" = "2.1.280" ]; then
            MODEL_ARG="--model claude-opus-5-5"
          fi
          echo "記事生成のモデル: $MODEL_ARG（claude $V）"
          before=$(ls articles/*.md 2>/dev/null | wc -l)
          for try in 1 2 3; do
            claude -p "$(cat automation/multi_site_prompt.txt)" \
              $MODEL_ARG --dangerously-skip-permissions --max-turns 160 || true
            after=$(ls articles/*.md 2>/dev/null | wc -l)
            if [ "$after" -gt "$before" ]; then
              echo "記事が増えました（$before → $after）。$try 回目で完了"
              break
            fi
            echo "::warning::記事が増えていません。書き直します（$try/3）"
            if [ "$try" = "3" ]; then
              echo "::error::3回試しても記事が増えませんでした"
              python scripts/hub_client.py error_log write \
                "${{ steps.site.outputs.id }}: 3回試しても記事を書けませんでした" || true
            fi
          done
          rm -f indexing-service-account.json

      # 書き手が執筆前ゲートと違うKWを選ぶことがある。
      # 実際に書かれた記事の keyword を見て、公開前にもう一度止める。
      - name: 食い合いゲート（執筆後）
        if: steps.site.outputs.skip != 'yes'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          out=$(python scripts/kw_gate.py --after --site "${{ steps.site.outputs.id }}") || true
          rm -f indexing-service-account.json
          echo "$out"
          # 隔離は警告どまり。食い合う記事だけが articles/_conflicted/ へ移り、
          # 問題のない記事はそのまま公開される（全体を巻き添えにしない）
          if echo "$out" | grep -q "KW_GATE=quarantined"; then
            echo "::warning::食い合う記事を隔離しました。残りの記事は公開されます"
          elif echo "$out" | grep -q "KW_GATE=block"; then
            echo "::error::食い合いゲートの判定に失敗しました。ログを確認してください"
            exit 1
          fi

      - name: リード導線を新しい記事に入れる
        if: steps.site.outputs.skip != 'yes'
        run: python scripts/tool_links.py --write || true

      # 新記事は被リンク0で始まる。週次を待つと最大6日そのままで、インデックスと
      # 評価の立ち上がりが遅れる。公開と同時に、話題の近い既存記事から先にリンクを張る
      - name: 公開直後に既存記事から新記事へリンクを張る
        if: steps.site.outputs.skip != 'yes'
        run: |
          for f in $(git ls-files --others --exclude-standard articles/*.md); do
            slug=$(basename "$f" .md)
            python scripts/link_boost.py "${{ steps.site.outputs.id }}" --rescue --write --only="$slug" 2>&1 | tail -4 || true
          done

      # 多言語を指示した社だけ、書いた記事の要約をその場で訳す（週次を待たずに公開と同時に多言語化）。
      # 指示が無い社では i18n.py が何もせずに終わる
      - name: 多言語の要約（指示のある社だけ・新しい記事のみ）
        if: steps.site.outputs.skip != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          new=$(git ls-files --others --exclude-standard articles/*.md | xargs -r -n1 basename | sed 's/\.md$//' | paste -sd, -)
          [ -n "$new" ] && python scripts/i18n.py --site "${{ steps.site.outputs.id }}" --write --publish --slugs "$new" --budget-min 6 2>&1 | tail -4 || true

      # 書いた直後に、機械で直せる崩れを直す。
      # これらは週次にしか入っておらず、記事は1日6本公開されるため、
      # 最大6日間そのまま公開されていた（実測で直近7日の記事に1本残っていた）。
      # 公開前に直すので、読者が崩れたページを見ることがなくなる。
      # どれも地の文を変えず、検算に外れたら書き込まない作りになっている
      - name: 公開前に、機械で直せる崩れを直す
        if: steps.site.outputs.skip != 'yes'
        run: |
          python scripts/fix_block_breaks.py --write || true
          python scripts/split_paragraphs.py --all --write || true
          python scripts/split_sentences.py --write || true
          python scripts/anchor_audit.py --fix --write || true
          python scripts/shorten_anchors.py --write || true

      - name: 監修待ちを知らせる
        if: steps.site.outputs.skip != 'yes'
        run: |
          # 記録の無い記事は公開されない（HELD）。放置すると書いた記事が溜まるだけになるため、毎回知らせる
          mkdir -p automation/logs
          python scripts/editorial_review.py --pending | tee /tmp/review.txt | tail -3 || true
          grep '^要対応' /tmp/review.txt | sed 's/$/（GitHub の Actions →「監修の記録」から slug を入れて実行）/' >> automation/logs/findings.txt || true

      - name: 自リポジトリの記事をコミット
        if: steps.site.outputs.skip != 'yes'
        run: |
          python scripts/build.py
          python scripts/local_kpi.py || true
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            git commit -m "publish(${{ steps.site.outputs.id }}): $(date '+%Y-%m-%d %H:%M JST')"
            pushed=0
            for i in 1 2 3; do
              git push && { pushed=1; break; }
              echo "push拒否 → リモートと統合して再試行 ($i/3)"
              if ! git pull --rebase -X ours origin "${GITHUB_REF_NAME}"; then
                git diff --name-only --diff-filter=U | while IFS= read -r f; do
                  if git cat-file -e "origin/${GITHUB_REF_NAME}:$f" 2>/dev/null; then
                    git checkout --ours -- "$f" 2>/dev/null && git add -- "$f" || git rm -f --ignore-unmatch -- "$f"
                  else
                    git rm -f --ignore-unmatch -- "$f"
                  fi
                done
                GIT_EDITOR=true git rebase --continue || git rebase --skip || git rebase --abort
              fi
            done
            # 3回目の統合のあとは push していない。成功で終わるとコミットがランナーごと消えるので、
            # 最後にもう1回だけ押し、それでも届かなければ工程を落とす（自動修復が拾う）
            if [ "$pushed" != 1 ]; then
              git push || { echo "::error::push に失敗しました。記事のコミットがリポジトリに反映されていません"; exit 1; }
            fi
          fi

      # 自前でビルドするサイトはここでデプロイまで行う
      # （他サイトは publish.py が対象リポジトリへpushし、各サイトのビルドが動く）
      - name: Cloudflare Pagesへデプロイ（自前ビルドのサイトのみ）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.own == 'True'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 配信先のプロジェクト名。直書きだと別のサイトへ配りにいく
          proj=$(python -c "import json,pathlib;p=pathlib.Path('site.config.json');print(json.loads(p.read_text(encoding='utf-8')).get('cf_project','') if p.is_file() else '')")
          [ -z "$proj" ] && proj="${{ steps.site.outputs.id }}"
          # Cloudflare APIは稀に522（一時的な接続タイムアウト）を返す。瞬断でrunを落とさないため再試行する
          for i in 1 2 3; do
            npx --yes wrangler@4.121.0 pages deploy site --project-name="$proj" --branch="${GITHUB_REF_NAME}" --commit-dirty=true && exit 0
            echo "Cloudflare APIが応答せず（$i/3）。40秒後に再試行"
            sleep 40
          done
          echo "::error::3回ともデプロイ失敗。記事はコミット済みなので次回のデプロイで反映される"
          exit 1

      # 検索エンジンへの通知はデプロイの後に送る。以前は publish_flow の中（コミット・
      # デプロイより前）で送っており、まだ配信されていないURLを知らせて404を踏ませていた。
      # デプロイが落ちた回は、この工程も走らない（出ていないURLを知らせない）
      - name: 新しいURLを検索エンジンへ通知（自前ビルドのサイトのみ）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.own == 'True'
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/notify_indexnow.py || true
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > indexing-service-account.json
            python scripts/notify_indexing.py --site "${{ steps.site.outputs.id }}" || true
            rm -f indexing-service-account.json
          else
            echo "GCP_SERVICE_ACCOUNT_JSON 未設定 — Indexing API はスキップ"
          fi

      # ワークフローが成功しても、デプロイだけ落ちていることがある。
      # 実際、wrangler の依存パッケージの公開遅れでデプロイが3回とも失敗し、
      # 記事はコミット済みなのに本番が数日古いままだった。
      # そのために作った道具が、これまで手動でしか動いていなかった。
      - name: 本番に届いたかの確認
        if: steps.site.outputs.skip != 'yes'
        continue-on-error: true      # 反映の遅れで run を落とさない。気づければよい
        run: |
          sleep 45                   # Cloudflare の配信が行き渡るのを待つ
          mkdir -p automation/logs
          # 印を拾い、注釈と通知の両方へ回す。`|| true` だけだと古いまま気づけない
          out=$(python scripts/deploy_check.py) || true
          echo "$out"
          if echo "$out" | grep -q "DEPLOY_OK=no"; then
            echo "::warning::本番が手元より古い状態です。次のデプロイまで反映されません"
            echo "要対応: 本番が手元より古い（次のデプロイまで反映されません）" >> automation/logs/findings.txt
          fi
          # 待つのは最長4.5分まで（以前は最長18分。1回の実行の半分がこの待ちだった）。
          # 見えなければ「確認中」で残し、翌日の publish_gap と日次の deploy_check が判定する
          out=$(python scripts/verify_publish.py --site "${{ steps.site.outputs.id }}" --since "$RUN_START" --build-timeout 180 --live-timeout 90) || true
          echo "$out"
          # **「見えない」と「公開されていない」は違う。**
          # 配信が10分で終わらない日があり、それを「要対応」で出すと狼少年になる。
          # 公開されたかどうかは、翌日の publish_gap（手元と本番の一覧を突き合わせる）
          # が判定する。ここでは「確認中」として残すだけにする。
          if echo "$out" | grep -q "VERIFY_OK=no"; then
            echo "::warning::公開直後の確認では本番に出ていません（配信待ちの可能性）"
            echo "確認中: 公開直後に本番で確認できず（翌日の照合で判定します）" >> automation/logs/findings.txt
          fi

      # 品質ゲートはすべて原稿とビルド出力を見ている。公開後の実物を見る工程が
      # 無かったため、社内向けTODOコメント・生成時の作業タグ </content>・
      # 失敗すると訪問者を追い出すフォームが、そのまま本番に届いていた。
      - name: 公開ページの検査
        if: steps.site.outputs.skip != 'yes'
        continue-on-error: true      # 検知が目的。反映待ちで run を落とさない
        run: |
          out=$(python scripts/live_check.py --site "${{ steps.site.outputs.id }}") || true
          echo "$out"
          if echo "$out" | grep -q "LIVE_CHECK=ng"; then
            echo "::warning::公開ページに問題が見つかりました。ログを確認してください"
            mkdir -p automation/logs
            { echo "要対応: 公開ページの問題";
              echo "$out" | grep "NG " | head -5; } >> automation/logs/findings.txt
          fi

      # KPIは1日1回でよいので、朝いちばんの枠のときに全サイト分をまとめて集計する
      # 手元にあるのに本番に無い記事を、公開サイトのsitemapと突き合わせて拾う。
      # gitの差分では「配信済み」に見えてしまい、抜けに気づけない。
      - name: 未配信の記事がないかの確認
        continue-on-error: true
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}          # 配信できた記事の公開の後の手順（台帳への記録）に使う
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          # 公開確認の起点。finish が呼ばれた時刻を起点にすると、既に始まった配信先のビルドを見失い1本8分待つ
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          out=$(python scripts/publish_gap.py --publish) || true
          echo "$out"
          n=$(echo "$out" | grep -oE 'PUBLISH_GAP=[0-9]+' | cut -d= -f2)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::warning::未配信が ${n} 本ありました。この実行で配信しています"
          fi
          # ここで配信できた記事は、公開の後の手順（台帳・SNS・既存記事からのリンク）を通っていない
          # ことがある（承認の回に配信できず翌日に回った記事など）。finish は台帳が公開済みなら何もしない
          echo "$out" | grep -oE '\] ○ [a-z0-9-]+$' | awk '{print $3}' | while read -r slug; do
            site=$(python -c "import sys; sys.path.insert(0,'scripts'); import sites, publish; m=publish.read_meta(__import__('pathlib').Path('articles')/(sys.argv[1]+'.md')); print(sites.find_category_owner((m or {}).get('category','')) or '')" "$slug")
            [ -n "$site" ] || continue
            python scripts/publish_flow.py --finish "$site" "$slug" "--since=$since" < /dev/null \
              || echo "::warning::$slug の公開の後の手順に失敗"
          done
          # finish が既存記事に足したリンクを残す。コミット工程はこの前に終わっているため、
          # ここで入れないとランナーと一緒に消え、翌日の publish_gap が元の版で配信し直す
          git add articles data/published.json data/body_hash.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "公開の後の手順: 既存記事から新記事へのリンク"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # 黙って消えると、翌日に元の版で配信し直されてリンクが消える
            if [ "$pushed" != 1 ]; then
              echo "::warning::既存記事へのリンクを push できませんでした"
              echo "要対応: 公開の後の手順で足したリンクを push できませんでした（次の配信で消えます）" >> automation/logs/findings.txt
            fi
          fi

      - name: KPI集計 → 管制塔ダッシュボード
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.id == steps.site.outputs.first && github.event.schedule == '0 23 * * *'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
            pip install --quiet google-analytics-data google-api-python-client google-auth
            python scripts/daily_kpi.py --send || true
            rm -f indexing-service-account.json
          fi

      - name: 運用通知
        if: steps.site.outputs.skip != 'yes' && always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="✅"; else icon="🚨"; fi
          # うまくいった回は送らない（--routine）。知らせることがある回だけ届く
          found=""
          if [ -f automation/logs/findings.txt ]; then found=$(cat automation/logs/findings.txt); fi
          python scripts/notify_slack.py --routine "$icon 記事パイプライン [${{ steps.site.outputs.id }}]: ${{ job.status }}
          $found
          $(git log -1 --pretty=%s)
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
