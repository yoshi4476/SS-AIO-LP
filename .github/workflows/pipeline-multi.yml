name: Multi-Site Article Pipeline
# 定時の起動役（Cloudflare Worker・automation/scheduler）が起動した回は「記事の枠 12 2026-10-08T20:07+09:00」、
# 予備の GitHub の定時の回は「記事の枠（予備の定時） 7 11 * * *」と出す（scripts/sched_guard.py がこの名前で突き合わせる）
run-name: ${{ inputs.scheduled_for && format('記事の枠 {0} {1}', inputs.slot, inputs.scheduled_for) || github.event.schedule && format('記事の枠（予備の定時） {0}', github.event.schedule) || github.workflow }}

# 全サイトの記事生成を1本のワークフローにまとめたもの。
# どのサイトを書くかは sites/*.json の並び順で決める（JST = UTC+9）。
# 各サイト1日2本。1回の実行が10〜17分かかるため2時間ずつ空け、
# 同時実行によるpush競合とActionsの待ち行列を避けている。
#
# 枠は20ある（1社2本 × 10社）。サイトが少ないときは余った枠が何もせず終わるので、
# 1サイトなら1日2本、2サイトなら4本になる。**10社が上限**で、
# 11社目からは枠が無く記事が書かれない。超えたら実行のたびにエラーで知らせる。
# その規模になったら、別リポジトリに分けて運用すること。
on:
  schedule:
    # 1社2本／日。枠はサイト数ぶんだけ使い、余った枠は何もしない。
    # 先頭6枠は3社運用時の公開時刻そのままにしてある（増やしても既存3社はずれない）。
    # 20枠＝10社が上限。11社目からは別リポジトリに分けること（下でアラートを出す）
    # 0分ちょうどは GitHub の実行が集中し1〜3時間遅れる（2026-10-03 実測）。7分・37分にずらす
    - cron: "7 23 * * *"  # JST 08:07 — 枠0（既存）
    - cron: "7 1 * * *"   # JST 10:07 — 枠1（既存）
    - cron: "7 3 * * *"   # JST 12:07 — 枠2（既存）
    - cron: "7 6 * * *"   # JST 15:07 — 枠3（既存）
    - cron: "7 8 * * *"   # JST 17:07 — 枠4（既存）
    - cron: "7 10 * * *"  # JST 19:07 — 枠5（既存）
    - cron: "7 0 * * *"   # JST 09:07 — 枠6（10社まで対応するための追加枠）
    - cron: "7 2 * * *"   # JST 11:07 — 枠7（10社まで対応するための追加枠）
    - cron: "7 4 * * *"   # JST 13:07 — 枠8（10社まで対応するための追加枠）
    - cron: "7 5 * * *"   # JST 14:07 — 枠9（10社まで対応するための追加枠）
    - cron: "7 7 * * *"   # JST 16:07 — 枠10（10社まで対応するための追加枠）
    - cron: "7 9 * * *"   # JST 18:07 — 枠11（10社まで対応するための追加枠）
    - cron: "7 11 * * *"  # JST 20:07 — 枠12（10社まで対応するための追加枠）
    - cron: "7 12 * * *"  # JST 21:07 — 枠13（10社まで対応するための追加枠）
    - cron: "7 13 * * *"  # JST 22:07 — 枠14（10社まで対応するための追加枠）
    - cron: "7 14 * * *"  # JST 23:07 — 枠15（10社まで対応するための追加枠）
    - cron: "7 15 * * *"  # JST 00:07 — 枠16（10社まで対応するための追加枠）
    - cron: "7 16 * * *"  # JST 01:07 — 枠17（10社まで対応するための追加枠）
    - cron: "7 17 * * *"  # JST 02:07 — 枠18（10社まで対応するための追加枠）
    - cron: "7 18 * * *"  # JST 03:07 — 枠19（10社まで対応するための追加枠）
    # 枠20〜39（20社まで）。cron の並び順がそのまま枠番号になる（case 文は無い）。
    # 実行は concurrency で直列なので、枠を足しても同時実行は増えない
    - cron: "37 23 * * *"  # JST 08:37 — 枠20
    - cron: "37 0 * * *"   # JST 09:37 — 枠21
    - cron: "37 1 * * *"   # JST 10:37 — 枠22
    - cron: "37 2 * * *"   # JST 11:37 — 枠23
    - cron: "37 3 * * *"   # JST 12:37 — 枠24
    - cron: "37 4 * * *"   # JST 13:37 — 枠25
    - cron: "37 5 * * *"   # JST 14:37 — 枠26
    - cron: "37 6 * * *"   # JST 15:37 — 枠27
    - cron: "37 7 * * *"   # JST 16:37 — 枠28
    - cron: "37 8 * * *"   # JST 17:37 — 枠29
    - cron: "37 9 * * *"   # JST 18:37 — 枠30
    - cron: "37 10 * * *"  # JST 19:37 — 枠31
    - cron: "37 11 * * *"  # JST 20:37 — 枠32
    - cron: "37 12 * * *"  # JST 21:37 — 枠33
    - cron: "37 13 * * *"  # JST 22:37 — 枠34
    - cron: "37 14 * * *"  # JST 23:37 — 枠35
    - cron: "37 15 * * *"  # JST 00:37 — 枠36
    - cron: "37 16 * * *"  # JST 01:37 — 枠37
    - cron: "37 17 * * *"  # JST 02:37 — 枠38
    - cron: "37 18 * * *"  # JST 03:37 — 枠39
  workflow_dispatch:
    inputs:
      site:
        description: "対象サイト（空なら sites/ の並び順で判定）"
        type: string
        default: ""
      # 以下3つは定時の起動役（Cloudflare Worker）が入れる。手で動かすときは空のまま
      slot:
        description: "枠の番号（空なら定時の cron の位置。手で動かした回は枠0）"
        type: string
        default: ""
      scheduled_for:
        description: "予定の時刻（起動役が入れる）"
        type: string
        default: ""
      token_expiry:
        description: "起動役の鍵の期限（起動役が入れる）"
        type: string
        default: ""

permissions:
  contents: write
  actions: read      # 同じ予定を先に受け持った回があるかを見る（sched_guard）

# concurrency はワークフロー単位ではなく、記事を書く job（write）にだけ付ける。
# ワークフロー単位だと空き枠の run までグループに並び、GitHub の仕様（待てるのは1件）で
# 待機中の実枠や週次を後から来た空き枠が取り消していた（月曜の12:00の枠が12:30の空き枠に消された）。
# 枠の判定（select）はグループの外で終え、空き枠はグループに並ばずに終わる

env:
  TZ: Asia/Tokyo

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.sched.outputs.sched_go == 'no' && 'yes' || steps.site.outputs.skip }}
      id: ${{ steps.site.outputs.id }}
      own: ${{ steps.site.outputs.own }}
      first: ${{ steps.site.outputs.first }}
      over: ${{ steps.site.outputs.over }}
      slot_day: ${{ steps.site.outputs.slot_day }}
      # write（新しい記事）か rewrite（運用者の設定で浮いた枠に、主力の記事を1本書き直す）
      mode: ${{ steps.site.outputs.mode }}
    steps:
      # 枠の判定は1日80回近く動き、書くのはそのうち1割。判定に要らない大きな置き場（画像・動画・資料・写真の原本。
      # 334MB のうち 287MB）は取らない。取得に平均12秒かかっていた（2026-10-03〜09 の305回）。
      # 外すのは下の5つだけで、判定が読む scripts/・sites/・data/・articles/・.github/ はそのまま取る
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/site/images/
            !/site/videos/
            !/assets/
            !/reports/
            !/写真素材/

      # 非公開のデータ（お客様の情報・料金・レポート）を private/ に取得し、お客様の守秘の語をログで伏せる
      # （public のリポジトリでは CI のログも誰でも読める。2026-10-10 運用者の指示・門 gates_history_h76）
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}

      # 起動役（Worker）の回と予備の定時の回のうち、同じ枠・同じ予定の日を先に受け持った回だけが書く
      - name: 同じ予定を先に受け持った回があるか
        id: sched
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sched_guard.py

      # お客様の社の量産の兆候（pace_state）は public に置かず置き場にある。戻さないとお客様の1日の本数が既定の2本になる
      - uses: ./.github/actions/client-private
        if: steps.sched.outputs.sched_go != 'no'
        with: {mode: restore}

      - name: 対象サイトの判定
        id: site
        if: steps.sched.outputs.sched_go != 'no'
        env:
          IN_SLOT: ${{ inputs.slot }}
          IN_AT: ${{ inputs.scheduled_for }}
        run: |
          # sites/*.json の並び順で決める。サイトIDを直接書くと、
          # 別の会社へ移したときに存在しないサイトを指したまま毎日空振りする。
          # 並び順は sites/<id>.json の priority（小さいほど先）。同じなら名前順。
          # 名前順だけで並べていたため、「abc-」で始まるクライアントを1社足すだけで
          # いちばん伸ばしたいサイトが後ろの枠へ押し出される状態だった。
          # 枠0（JST 08:00）は最も早く公開できる枠なので、優先度は明示して持つ
          mapfile -t SITES < <(python scripts/site_order.py)
          N=${#SITES[@]}
          # 時刻ごとの枠を0から数える。枠の番号をサイト数で割った余りを使う。
          # 以前は枠に 0/1/2 を直接書いていたため、4社目以降は一度も選ばれず
          # 記事が1本も書かれなかった（サイトを増やしても静かに無視される）。
          # 余りにすると、枠が足りなくても全社に行き渡る（本数は減る）。
          # 3社なら 0,1,2,0,1,2 で今までと同じ割り当てになる。
          # 本数を戻したいときは cron を増やし、下の case に枠番号を足す
          # 枠の番号は、このファイルの cron の並び順から機械で決める。以前は case 文に
          # 20行を手で書いていたため、cron を足しても case を足し忘れると枠0に潰れた。
          # cron を1行足せば枠が1つ増える（上限＝cron の本数÷2 社）
          # 起動役（Worker）の回は枠の番号を入力 slot で受け取る（無ければ今までどおり cron の位置）
          read -r slot SLOTS < <(python - "${{ github.event.schedule }}" "$IN_SLOT" <<'PY'
          import re, sys
          crons = re.findall(r'^\s*- cron:\s*"([^"]+)"', open(".github/workflows/pipeline-multi.yml", encoding="utf-8").read(), re.M)
          s, n = sys.argv[1].strip(), sys.argv[2].strip()
          print(int(n) if n.isdigit() else crons.index(s) if s in crons else 0, len(crons))
          PY
          )
          # この枠が予定されていた日。定時が遅れて日付をまたいでも、書いた記事は予定の日の本数に数える
          # （公開日 date: は公開した日のまま。daily_audit.stamp_makeup が data/makeup.json に記録する）。
          # 起動役の回は予定の時刻（scheduled_for）の日
          echo "slot_day=$(python scripts/daily_audit.py --slot-day "${{ github.event.schedule }}" "$IN_AT")" >> "$GITHUB_OUTPUT"
          s="${{ inputs.site }}"
          if [ -z "$s" ]; then
            if [ "$N" -eq 0 ]; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "sites/*.json がありません。何もしません"
              exit 0
            fi
            # 枠は20（1社2本×10社）。これを超えた分は枠が無く、記事が
            # 書かれないまま静かに放置される。1日1回の実行でも必ず目に入るようにする
            CAP=$(( SLOTS / 2 ))
            if [ "$N" -gt "$CAP" ]; then
              echo "::error::サイトが${N}件あります。枠は${SLOTS}（1社2本で${CAP}社まで）。cron を2本足すと1社増やせます"
              # この job と記事を書く job はランナーが別。findings.txt は write 側で書く
              echo "over=要対応: サイトが${N}件で枠の上限${CAP}社を超えました。pipeline-multi.yml に cron を2本足すか、別リポジトリに分けてください（今の枠では本数が減ります）" >> "$GITHUB_OUTPUT"
            fi
            # 1サイトあたり1日2本まで（CLAUDE.md の上限）。サイト数が少ないと
            # 余りだけでは同じサイトに何度も回り、1社のとき1日6本になってしまう
            if [ "$slot" -ge $(( N * 2 )) ]; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "枠$slot は余りです（サイト数 $N × 2本 = $(( N * 2 )) 枠で足りています）"
              exit 0
            fi
            i=$(( slot % N ))
            echo "枠$slot ÷ サイト数$N → $i 番目（${SITES[$i]}）"
            s="${SITES[$i]}"
            # お客様の社は公開の id（sites/<公開の id>.json）で並ぶ。本数・上限は社の id で数える（非公開の置き場の設定）。
            # ジョブの間で渡すのは公開の id だけ（社の id は CI のログで伏せる語なので、ジョブの出力に入れると落とされる）
            real=$(python3 scripts/private_store.py --resolve "$s" 2>/dev/null || echo "$s")
            # 月の上限（60本）に達したサイトは書かない。publish_flow の上限は書き終えた後に効くため、
            # 書き手が別の道で公開すると抜ける（2026-09 は3サイトとも超えた）
            if python scripts/daily_audit.py --cap-reached "$real" >/dev/null 2>&1; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "$s は今月の上限に達しています。新しい記事は書きません"
              exit 0
            fi
            # 量産と見られている兆候（Google の大量生成の不正使用の定義にもとづく・週次の pace.py）で
            # 1日の本数を 2/1/0 に自動で調整する。運用者が sites/<id>.json の daily_articles で本数を減らした社は、
            # その本数（兆候と小さい方）。その日の何本目の枠か（0始まり）が本数以上なら新しい記事は書かない。
            # 設定で浮いた枠は、spare_slot=rewrite_main の社だけ主力の記事の書き直しに回す（2026-10-09 運用者の決定）。
            # 兆候・手動の対策で止めた枠と、上の月の上限で止めた枠は書き直さない（pace.slot が決める）
            rank=$(( slot / N ))
            out=$(python scripts/pace.py --slot "$real" "$rank" 2>/dev/null) || true
            mode=$(echo "$out" | sed -n 's/^SLOT=//p')
            why=$(echo "$out" | sed -n 's/^SLOT_WHY=//p')
            if [ -z "$mode" ]; then
              echo "::warning::$s の1日の本数を読めませんでした（pace.py --slot）。既定の1日2本で判定します"
              if [ "$rank" -ge 2 ]; then mode=skip; else mode=write; fi
            fi
            if [ "$mode" = "skip" ]; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "$s のこの枠は書きません（$why）"
              exit 0
            fi
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            if [ "$mode" = "rewrite" ]; then
              echo "$s のこの枠は新しい記事を書かず、主力の記事を1本書き直します（$why）"
            fi
          fi
          # 自前でビルドするサイトかどうか。デプロイと配信の分岐に使う
          # 手で動かした回に社の id を入れられても、ジョブの間は公開の id で渡す
          s=$(python3 scripts/private_store.py --public-id "$s" 2>/dev/null || echo "$s")
          own=$(python -c "import json;print(json.load(open('sites/$s.json',encoding='utf-8')).get('type')=='self-static')")
          first="${SITES[0]}"
          echo "id=$s" >> "$GITHUB_OUTPUT"
          echo "own=$own" >> "$GITHUB_OUTPUT"
          echo "first=$first" >> "$GITHUB_OUTPUT"
          echo "対象サイト: $s（自前ビルド: $own / 全$N サイト）"

      # この回に書いた・直したお客様の社の記事・画像・台本・記録を非公開のリポジトリへ残す（公開側の git には入れない。
      # 公開側に commit が無い回も残す。門 gates_history_h77）
      - uses: ./.github/actions/private-data
        if: always()
        with: {mode: save}


  write:
    needs: select
    if: needs.select.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AUDIT_DAY: ${{ needs.select.outputs.slot_day }}
    # 並ぶのは実際に記事を書く枠だけ。週次・救済（pipeline.yml）とも同じグループで直列にする
    concurrency:
      group: article-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # 非公開のデータ（お客様の情報・料金・レポート）を private/ に取得し、お客様の守秘の語をログで伏せる
      # （public のリポジトリでは CI のログも誰でも読める。2026-10-10 運用者の指示・門 gates_history_h76）
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}

      # 以降の工程は steps.site.outputs.* で読む（select の判定をそのまま受け取る）
      - name: 対象サイト（select の判定を受け取る）
        id: site
        run: |
          # お客様の社は、非公開のデータ（会社情報・記事の材料・サイト設定の戦略の部分）が読めなければ書かない。
          # 材料なしで書かせると、書かれていないことを憶測で補った記事が公開される（2026-10-10 運用者の指示）
          chk=$(python3 scripts/private_store.py --check-site "${{ needs.select.outputs.id }}" 2>&1 | tail -1)
          mode="${{ needs.select.outputs.mode || 'write' }}"
          if [ "$chk" = "PRIVATE_OK=no" ]; then
            mode=blocked
            { echo "skip=yes"; echo "blocked=yes"; } >> "$GITHUB_OUTPUT"
            mkdir -p automation/logs
            echo "要対応: ${{ needs.select.outputs.id }} の記事を書きませんでした。非公開のデータ（yoshi4476/ss-aio-private）が読めません。Secret PRIVATE_DATA_TOKEN（無ければ SITE_PUSH_TOKEN）にこのリポジトリの Contents の読み書きを足してください" >> automation/logs/findings.txt
            echo "::error::${{ needs.select.outputs.id }} の記事を書きません。非公開のデータが読めません（鍵の権限を確認）"
          fi
          # select からは公開の id で届く。工程には社の id を渡す（非公開の置き場の設定。CI のログでは伏せる語）。
          # コミットの文・知らせる文には公開の id を使う（公開側の履歴に社名を残さない。2026-10-10）
          pub="${{ needs.select.outputs.id }}"
          real=$(python3 scripts/private_store.py --resolve "$pub" 2>/dev/null || echo "$pub")
          {
            echo "id=$real"
            echo "pub=$pub"
            echo "own=${{ needs.select.outputs.own }}"
            echo "first=${{ needs.select.outputs.first }}"
            # rewrite: 運用者の設定（daily_articles）で浮いた枠。新しい記事は書かず、主力の記事を1本書き直す
            echo "mode=$mode"
            # お客様の社は、執筆の案内・次に書く語をログに出さない（CI のログは public。claude はファイルを読む）
            echo "quiet=$(python3 scripts/private_store.py --is-client "${{ needs.select.outputs.id }}")"
          } >> "$GITHUB_OUTPUT"
          # 配信先のビルドを探す起点。push の後の時刻にすると、先に始まったビルドを見失う
          echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          over="${{ needs.select.outputs.over }}"
          if [ -n "$over" ]; then
            mkdir -p automation/logs
            echo "$over" >> automation/logs/findings.txt
          fi
          echo "対象サイト: ${{ needs.select.outputs.id }}（${{ needs.select.outputs.mode == 'rewrite' && '浮いた枠: 主力の記事の書き直し' || '新しい記事' }}）"

      # Python と依存（requirements.txt）を週ごとの控えから戻す。戻せた回は下の pip install が確かめるだけになる
      # （yt-dlp は控えに入れず、今までどおり毎回その時の版を入れる）
      - uses: ./.github/actions/py-env
        if: steps.site.outputs.skip != 'yes'

      - name: 依存インストール
        if: steps.site.outputs.skip != 'yes'
        run: |
          # 3つは互いに関係ないので同時に入れる（順に入れて約35秒・遅い日は5分）。1つでも失敗したら止める
          pip install -q -r requirements.txt yt-dlp > /tmp/pip.log 2>&1 & p1=$!
          (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk) > /tmp/apt.log 2>&1 & p2=$!
          npm install -g @anthropic-ai/claude-code > /tmp/npm.log 2>&1 & p3=$!
          ok=1
          wait $p1 || { cat /tmp/pip.log; ok=0; }
          wait $p2 || { cat /tmp/apt.log; ok=0; }
          wait $p3 || { cat /tmp/npm.log; ok=0; }
          [ "$ok" = 1 ] || exit 1
          # ネイティブバイナリが落ちてこないことがある（postinstallが走らない／
          # optional依存が省かれる）。実行時まで気づけず、記事生成ごと落ちる。
          # ここで動作を確かめ、駄目ならインストーラを直接叩き直す。
          if ! claude --version >/dev/null 2>&1; then
            echo "claude が動かないため postinstall をやり直します"
            node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs" || true
          fi
          claude --version

      # お客様の社の順位・AIの語（public に置かないため .gitignore）を前の回のキャッシュから戻す。
      # 戻さないと、お客様の社だけ次に書く語の優先（next_kw）・勝ち型・順位が空のまま書く
      - uses: ./.github/actions/client-private
        with: {mode: restore}
      - uses: ./.github/actions/client-private
        with: {mode: restore, family: ai-kw, kinds: ai_kw}

      # 記事のページ・sitemap・feed を Git から外す準備（2026-10-03）。このあとの工程が手元のページを読むので、
      # 先に原稿から作っておく。作れなくても止めない（外す前は、コミット済みのページが残っている）
      - name: 原稿からページを作る
        if: steps.site.outputs.skip != 'yes'
        run: |
          python scripts/build.py > /tmp/prebuild.log 2>&1 && tail -2 /tmp/prebuild.log || {
            tail -20 /tmp/prebuild.log
            echo "::warning::原稿からページを作れませんでした（このあとの工程は古いページを読みます）"
            mkdir -p automation/logs
            echo "要対応: 原稿からページを作れませんでした（$GITHUB_WORKFLOW）" >> automation/logs/findings.txt
          }

      - name: Git識別情報の設定
        if: steps.site.outputs.skip != 'yes'
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"

      # 記事を1本書いてから最後のpushで落ちるのが一番もったいない。
      # トークンが失効していれば、着手前にここで止める。
      - name: 配信トークンの事前確認
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.own != 'True'
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          out=$(python scripts/token_check.py) || true
          echo "$out"
          if echo "$out" | grep -q "TOKEN_OK=yes"; then
            exit 0
          fi
          # 原因を決めつけない。GitHub側の5xxで「再発行してください」と出すと、
          # 無効でないトークンを作り直すことになり、原因が残ったままになる。
          if echo "$out" | grep -q "トークンの問題ではありません"; then
            echo "::error::GitHub側の問題で確認できませんでした。トークンの再発行では直りません。githubstatus.com を確認し、時間をおいて再実行してください"
          elif echo "$out" | grep -q "権限不足"; then
            echo "::error::SITE_PUSH_TOKEN の権限が足りません。github.com/settings/personal-access-tokens で該当トークンを開き、Repository permissions の Contents を Read and write にして Update token。その後 python scripts/set_secrets.py --apply で .env と Secrets を更新してください"
          else
            echo "::error::SITE_PUSH_TOKEN が使えません。再発行して Secrets と .env の両方を更新してください"
          fi
          exit 1

      # 運用者の設定（sites/<id>.json の daily_articles）で浮いた枠は、新しい記事の代わりに主力の記事を1本書き直す
      # （2026-10-09 運用者の決定。spare_slot=rewrite_main の社だけ・どの枠かは select の pace.slot が決める）。
      # 先に、やってはいけない書き換えを当てて検算が止めるかを見る（週次・集中モードと同じ。claude は呼ばない）
      - name: 浮いた枠：検算が効くか確かめる
        id: guard
        if: steps.site.outputs.mode == 'rewrite'
        timeout-minutes: 25
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
            chmod 600 indexing-service-account.json
          fi
          if python scripts/auto_rewrite.py --selftest; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::error::検算が効いていません。浮いた枠の書き直しは行いません"
            mkdir -p automation/logs
            echo "要対応: auto_rewrite の検算が効いていません（${{ steps.site.outputs.id }} の浮いた枠の書き直しを飛ばしました）" >> automation/logs/findings.txt
          fi
          rm -f indexing-service-account.json

      # 主力の語（kw_plan.main_rule）の記事を1本だけ。順は「4〜20位で上位の見出しがある（data/kw_serp）」→
      # 「11〜30位で需要のある語に答えていない」→「競合がAIの出典に出ている」。直近28日に直した記事は外す
      # （effect_ab・rewrite_rollback が前後28日で比べる）。候補が無い日は何もしない（新しい記事にも戻さない）。
      # 台帳（auto_fix.jsonl）には印 spare-slot を付け、週次の直しと分けて効きを測る
      - name: 浮いた枠：主力の記事を1本書き直す
        if: steps.site.outputs.mode == 'rewrite' && steps.guard.outputs.ok == 'yes'
        timeout-minutes: 45
        env:
          # 候補が尽きた日の無料の調べ（cooccur）は、上位・AIの出典を Gemini 検索で集める。鍵が無いと出典が0件になり、
          # 候補が黙って0本になっていた（2026-10-10 の補助金の浮いた枠が何もせずに終わった）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
            chmod 600 indexing-service-account.json
          fi
          # 配信の基点。書き直した記事だけを後の工程で配信先へ届ける
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          out=$(python scripts/auto_rewrite.py --write --kind spare --main-only --sites "${{ steps.site.outputs.id }}" \
            --limit 1 --skip-recent 28 --tag spare-slot 2>&1) || true
          rm -f indexing-service-account.json
          echo "$out"
          r=$(echo "$out" | sed -n 's/^SPARE_SLOT=//p')
          echo "::notice::浮いた枠（${{ steps.site.outputs.pub }}）: ${r:-結果の印がありません（上のログを確認）}"
          echo "浮いた枠（${{ steps.site.outputs.pub }}）: ${r:-結果の印がありません}" >> "$GITHUB_STEP_SUMMARY"

      - name: 執筆ブリーフの表示（KW残数と担当領域をログに残す）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          # 記事を書く claude が同じ出力を読む（同じものを2回作らない。1回約50秒）。
          # お客様の社の案内（記事の材料・狙う語・一次情報・売り物と料金）はログに出さない（CI のログは public）
          mkdir -p automation/logs
          # 次の工程の横断のカニバリ検査は管制塔とファイルを読むだけで、このブリーフと関わらない。どちらも管制塔の
          # 応答待ちが長い（2026-10-03〜09 の39回でブリーフ平均35秒・横断平均39秒を順に待っていた）ので同時に始め、
          # 結果は次の工程で今までと同じ順に brief.txt へ書き足す
          rm -f /tmp/cannibal.txt /tmp/cannibal.rc
          ( python scripts/cannibal_check.py --cross > /tmp/cannibal.txt 2>&1; echo $? > /tmp/cannibal.rc ) < /dev/null > /dev/null 2>&1 &
          if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then
            python scripts/site_brief.py "${{ steps.site.outputs.id }}" > automation/logs/brief.txt
            echo "お客様の社の執筆の案内はログに出しません（$(wc -l < automation/logs/brief.txt) 行。claude は automation/logs/brief.txt を読みます）"
          else
            python scripts/site_brief.py "${{ steps.site.outputs.id }}" | tee automation/logs/brief.txt
          fi

      - name: 全サイト横断のカニバリ・領域チェック
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          echo "■ python scripts/cannibal_check.py --cross の結果" >> automation/logs/brief.txt
          # 前の工程で始めた検査の終わりを待つ。始まっていなければ（工程を手で動かした等）ここで動かす
          for i in $(seq 1 1800); do [ -f /tmp/cannibal.rc ] && break; [ -f /tmp/cannibal.txt ] || break; sleep 1; done
          # お客様の社の回は結果をログに出さず brief.txt にだけ書く（CI のログは public。2026-10-10 守秘義務）
          if [ -f /tmp/cannibal.rc ] && [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then
            cat /tmp/cannibal.txt >> automation/logs/brief.txt || true
            echo "（お客様の社の回は結果をログに出しません。brief.txt にあります）"
          elif [ -f /tmp/cannibal.rc ]; then
            tee -a automation/logs/brief.txt < /tmp/cannibal.txt || true
          elif [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then
            python scripts/cannibal_check.py --cross >> automation/logs/brief.txt 2>&1 || true
            echo "（お客様の社の回は結果をログに出しません。brief.txt にあります）"
          else
            python scripts/cannibal_check.py --cross 2>&1 | tee -a automation/logs/brief.txt || true
          fi

      # 手順書に「必ず実行すること」と書いても、それは関門ではない。
      # 実行を忘れれば素通りする。実際、タイトル類似だけのゲートを通り抜けて
      # 狙う範囲が8記事と重なり、51語・表示484回でクリック0の記事ができた。
      # ここで止めれば、書き始める前に判定が終わる。
      - name: 食い合いゲート（執筆前）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          out=$(python scripts/kw_gate.py --before --site "${{ steps.site.outputs.id }}") || true
          rm -f indexing-service-account.json
          # お客様の社の語（候補・次に書く語）はログに出さない。判定の印だけ（claude は brief.txt を読む）
          if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then echo "$out" | grep -E '^KW_GATE=' || true; else echo "$out"; fi
          { echo "■ 食い合いゲート（kw_gate --before）の結果"; echo "$out"; } >> automation/logs/brief.txt
          if echo "$out" | grep -q "KW_GATE=block"; then
            echo "::error::次のKWが既存ページと食い合います。台帳を直すまで記事を書きません"
            exit 1
          fi

      # 一次情報を先に集めておく。執筆側に任せると取りこぼすため、
      # 次に書くKWで文字起こしを取得し、本文を読める状態にしておく
      - name: 一次情報の収集（YouTube文字起こし）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then
            python scripts/research_next.py "${{ steps.site.outputs.id }}" > /tmp/research_next.log 2>&1 || true
            echo "一次情報の収集: $(wc -l < /tmp/research_next.log) 行（お客様の社の回はログに出しません）"
          else
            python scripts/research_next.py "${{ steps.site.outputs.id }}" || true
          fi

      - name: 記事生成（Phase 1〜7）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        env:
          SITE_ID: ${{ steps.site.outputs.id }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 社数が増えてサブスクの枠に当たったら、API の従量課金に切り替える（鍵を登録するだけ。
          # 記事1本 ¥50〜150 の目安。未登録なら空で、claude はサブスクの鍵を使う）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          # 同意のあるお客様の社は、配信と一緒に Bing の確認ファイルを置く（publish.py → search_connect.place）
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          # 公開直後のSNS投稿（publish_flow → post_social）。未登録の媒体は黙って飛ばす
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          # 社ごとのアカウント（social_connect.py が登録。クライアントの記事はその社にだけ投稿する）
          SOCIAL_TOKENS_JSON: ${{ secrets.SOCIAL_TOKENS_JSON }}
        run: |
          # 未登録の鍵は空文字で渡る。空のまま置くと claude が API の鍵として扱って落ちるので外す
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          # 1回で書けなくても、その日の記事は落とさない。書けたかどうかを
          # 記事ファイルの数で判定し、増えるまで繰り返す。回数を切るのは、
          # 壊れたまま無限に回して実行時間を食い潰さないため。
          # 記事はいちばん強いモデルで書く。ただし版が古いと 400 で落ちるため、
          # 版を見て切り替える（実測: 2.1.218 は claude-opus-5-5 を
          # 「version 2.1.280 or newer is required」で拒否した）
          V=$(claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          MODEL_ARG="--model claude-opus-5"
          if [ "$(printf '%s\n2.1.280\n' "$V" | sort -V | head -1)" = "2.1.280" ]; then
            MODEL_ARG="--model claude-opus-5-5"
          fi
          echo "記事生成のモデル: $MODEL_ARG（claude $V）"
          before=$(ls articles/*.md 2>/dev/null | wc -l)
          for try in 1 2 3; do
            claude -p "$(cat automation/multi_site_prompt.txt)" \
              $MODEL_ARG --dangerously-skip-permissions --max-turns 160 || true
            after=$(ls articles/*.md 2>/dev/null | wc -l)
            if [ "$after" -gt "$before" ]; then
              echo "記事が増えました（$before → $after）。$try 回目で完了"
              break
            fi
            echo "::warning::記事が増えていません。書き直します（$try/3）"
            # 書き直しの回は台帳が変わっている（1回目が語を「執筆中」にした等）。先に作ったブリーフは使わせない
            rm -f automation/logs/brief.txt
            if [ "$try" = "3" ]; then
              echo "::error::3回試しても記事が増えませんでした"
              python scripts/hub_client.py error_log write \
                "${{ steps.site.outputs.id }}: 3回試しても記事を書けませんでした" || true
            fi
          done
          rm -f indexing-service-account.json

      # 書き手が執筆前ゲートと違うKWを選ぶことがある。
      # 実際に書かれた記事の keyword を見て、公開前にもう一度止める。
      - name: 食い合いゲート（執筆後）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          out=$(python scripts/kw_gate.py --after --site "${{ steps.site.outputs.id }}") || true
          rm -f indexing-service-account.json
          if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then
            echo "$out" | grep -E '^KW_GATE=' || true
            echo "隔離 $(echo "$out" | grep -c '隔離:') 本（お客様の社の語はログに出しません）"
          else
            echo "$out"
          fi
          # 隔離は警告どまり。食い合う記事だけが articles/_conflicted/ へ移り、
          # 問題のない記事はそのまま公開される（全体を巻き添えにしない）
          if echo "$out" | grep -q "KW_GATE=quarantined"; then
            echo "::warning::食い合う記事を隔離しました。残りの記事は公開されます"
          elif echo "$out" | grep -q "KW_GATE=block"; then
            echo "::error::食い合いゲートの判定に失敗しました。ログを確認してください"
            exit 1
          fi

      - name: リード導線を新しい記事に入れる
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        run: python scripts/tool_links.py --write || true

      # 新記事は被リンク0で始まる。週次を待つと最大6日そのままで、インデックスと
      # 評価の立ち上がりが遅れる。公開と同時に、話題の近い既存記事から先にリンクを張る
      - name: 公開直後に既存記事から新記事へリンクを張る
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        run: |
          for f in $(git ls-files --others --exclude-standard articles/*.md); do
            slug=$(basename "$f" .md)
            # お客様の社の回は記事の slug・題が並ぶのでログに出さない（件数は週次の集計で見る）
            if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then
              python scripts/link_boost.py "${{ steps.site.outputs.id }}" --rescue --write --only="$slug" > /dev/null 2>&1 || true
            else
              python scripts/link_boost.py "${{ steps.site.outputs.id }}" --rescue --write --only="$slug" 2>&1 | tail -4 || true
            fi
          done

      # 多言語を指示した社だけ、書いた記事の要約をその場で訳す（週次を待たずに公開と同時に多言語化）。
      # 指示が無い社では i18n.py が何もせずに終わる
      - name: 多言語の要約（指示のある社だけ・新しい記事のみ）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          new=$(git ls-files --others --exclude-standard articles/*.md | xargs -r -n1 basename | sed 's/\.md$//' | paste -sd, -)
          [ -n "$new" ] && python scripts/i18n.py --site "${{ steps.site.outputs.id }}" --write --publish --slugs "$new" --budget-min 6 2>&1 | tail -4 || true

      # 書いた直後に、機械で直せる崩れを直す。
      # これらは週次にしか入っておらず、記事は1日6本公開されるため、
      # 最大6日間そのまま公開されていた（実測で直近7日の記事に1本残っていた）。
      # 公開前に直すので、読者が崩れたページを見ることがなくなる。
      # どれも地の文を変えず、検算に外れたら書き込まない作りになっている
      - name: 公開前に、機械で直せる崩れを直す
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        run: |
          python scripts/fix_block_breaks.py --write || true
          python scripts/split_paragraphs.py --all --write || true
          python scripts/split_sentences.py --write || true
          python scripts/anchor_audit.py --fix --write || true
          python scripts/shorten_anchors.py --write || true

      - name: 監修待ちを知らせる
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.mode != 'rewrite'
        run: |
          # 記録の無い記事は公開されない（HELD）。放置すると書いた記事が溜まるだけになるため、毎回知らせる
          mkdir -p automation/logs
          # 公開前の確認を「要」にしたお客様の記事は、社ごとに原稿のURL・題・待っている日数と承認の手順を載せる
          # お客様の社の回は、原稿の題・URL をログに出さず通知（メール）にだけ載せる
          if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then
            python scripts/editorial_review.py --notify --site "${{ steps.site.outputs.id }}" > /tmp/review.txt || true
            echo "監修待ちの知らせ: $(grep -c . /tmp/review.txt || true) 行（お客様の社の回はログに出しません）"
          else
            python scripts/editorial_review.py --notify --site "${{ steps.site.outputs.id }}" | tee /tmp/review.txt || true
          fi
          cat /tmp/review.txt >> automation/logs/findings.txt || true

      - name: 自リポジトリの記事をコミット
        if: steps.site.outputs.skip != 'yes'
        run: |
          python scripts/build.py
          python scripts/local_kpi.py || true
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            if [ "${{ steps.site.outputs.mode }}" = "rewrite" ]; then
              git commit -m "spare-slot(${{ steps.site.outputs.pub }}): 浮いた枠で主力の記事を書き直し $(date '+%Y-%m-%d %H:%M JST')"
            else
              git commit -m "publish(${{ steps.site.outputs.pub }}): $(date '+%Y-%m-%d %H:%M JST')"
            fi
            pushed=0
            for i in 1 2 3; do
              git push && { pushed=1; break; }
              echo "push拒否 → リモートと統合して再試行 ($i/3)"
              if ! git pull --rebase -X ours origin "${GITHUB_REF_NAME}"; then
                git diff --name-only --diff-filter=U | while IFS= read -r f; do
                  if git cat-file -e "origin/${GITHUB_REF_NAME}:$f" 2>/dev/null; then
                    git checkout --ours -- "$f" 2>/dev/null && git add -- "$f" || git rm -f --ignore-unmatch -- "$f"
                  else
                    git rm -f --ignore-unmatch -- "$f"
                  fi
                done
                GIT_EDITOR=true git rebase --continue || git rebase --skip || git rebase --abort
              fi
            done
            # 3回目の統合のあとは push していない。成功で終わるとコミットがランナーごと消えるので、
            # 最後にもう1回だけ押し、それでも届かなければ工程を落とす（自動修復が拾う）
            if [ "$pushed" != 1 ]; then
              git push || { echo "::error::push に失敗しました。記事のコミットがリポジトリに反映されていません"; exit 1; }
            fi
          fi

      # 書き直した記事は配信先へ届けないと本番に反映されない。週次・集中モードと同じ道具（publish_changed）で、
      # この回に書き直した分（BASE_SHA からの差分）だけを送る。自前でビルドする社は下のデプロイが届ける
      - name: 浮いた枠：書き直した記事を配信先へ届ける
        if: steps.site.outputs.mode == 'rewrite' && steps.site.outputs.own != 'True' && env.BASE_SHA != ''
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          mkdir -p automation/logs
          python scripts/publish_changed.py --site "${{ steps.site.outputs.id }}" --since "$BASE_SHA" --push 2>&1 | tee /tmp/publish_changed.txt || true
          grep '^要対応' /tmp/publish_changed.txt >> automation/logs/findings.txt || true
          git add -A
          git diff --cached --quiet || {
            git commit -q -m "spare-slot(${{ steps.site.outputs.pub }}): 配信の記録 $(date '+%Y-%m-%d %H:%M JST')"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ "$pushed" = 1 ] || echo "::warning::配信の記録を正本へ push できませんでした"
          }

      # 自前でビルドするサイトはここでデプロイまで行う
      # （他サイトは publish.py が対象リポジトリへpushし、各サイトのビルドが動く）
      - name: Cloudflare Pagesへデプロイ（自前ビルドのサイトのみ）
        if: steps.site.outputs.skip != 'yes' && steps.site.outputs.own == 'True'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 公開前の門: sitemapの404/noindex・git の衝突マーカーがあれば公開しない（seo_audit --gate）
          python3 scripts/seo_audit.py --gate || { echo "::error::サイト監査の門で止めました（上の ::error:: を直す）"; exit 1; }
          # 配信先のプロジェクト名。直書きだと別のサイトへ配りにいく
          proj=$(python -c "import json,pathlib;p=pathlib.Path('site.config.json');print(json.loads(p.read_text(encoding='utf-8')).get('cf_project','') if p.is_file() else '')")
          [ -z "$proj" ] && proj="${{ steps.site.outputs.id }}"
          # 送る中身の指紋も一緒に置く。この回の push で動く deploy.yml が同じ中身を作ったら、送り出しを省ける
          # （scripts/deploy_marker.py。置けなくても送り出しは続け、次の deploy.yml は省かずに送る）
          python3 scripts/deploy_marker.py --write --salt wrangler@4.121.0 || rm -f site/deploy-hash.txt
          # Cloudflare APIは稀に522（一時的な接続タイムアウト）を返す。瞬断でrunを落とさないため再試行する
          for i in 1 2 3; do
            npx --yes wrangler@4.121.0 pages deploy site --project-name="$proj" --branch="${GITHUB_REF_NAME}" --commit-dirty=true && exit 0
            echo "Cloudflare APIが応答せず（$i/3）。40秒後に再試行"
            sleep 40
          done
          echo "::error::3回ともデプロイ失敗。記事はコミット済みなので次回のデプロイで反映される"
          exit 1

      # ワークフローが成功しても、デプロイだけ落ちていることがある。
      # 実際、wrangler の依存パッケージの公開遅れでデプロイが3回とも失敗し、
      # 記事はコミット済みなのに本番が数日古いままだった。
      # そのために作った道具が、これまで手動でしか動いていなかった。
      - name: 本番に届いたかの確認
        if: steps.site.outputs.skip != 'yes'
        continue-on-error: true      # 反映の遅れで run を落とさない。気づければよい
        run: |
          mkdir -p automation/logs
          # 印を拾い、注釈と通知の両方へ回す。`|| true` だけだと古いまま気づけない
          # Cloudflare の配信が行き渡るまで、5秒おきに最長45秒確かめる（以前は毎回45秒待ってから1回だけ見ていた）
          deadline=$(( $(date +%s) + 45 ))
          while :; do
            out=$(python scripts/deploy_check.py) && break
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep 5
          done
          echo "$out"
          if echo "$out" | grep -q "DEPLOY_OK=no"; then
            echo "::warning::本番が手元より古い状態です。次のデプロイまで反映されません"
            echo "要対応: 本番が手元より古い（次のデプロイまで反映されません）" >> automation/logs/findings.txt
          fi
          # 浮いた枠で書き直す記事が無かった回（原稿が1本も変わっていない）は、配信先へ何も送っていないので
          # 届いたかを確かめる記事が無い。確かめに行くと来ないビルドを最長3分待っていた（2026-10-10 補助金の枠 6）
          if [ "${{ steps.site.outputs.mode }}" = "rewrite" ] && { [ -z "$BASE_SHA" ] || git diff --quiet "$BASE_SHA" HEAD -- articles; }; then
            echo "この回は原稿を変えていない（書き直す記事が無かった）ため、配信先の公開の確認を省きます"
            echo "VERIFY_OK=skip"
            exit 0
          fi
          # 待つのは最長4.5分まで（以前は最長18分。1回の実行の半分がこの待ちだった）。
          # 見えなければ「確認中」で残し、翌日の publish_gap と日次の deploy_check が判定する
          out=$(python scripts/verify_publish.py --site "${{ steps.site.outputs.id }}" --since "$RUN_START" --build-timeout 180 --live-timeout 90) || true
          # お客様の社の回は記事の URL（slug）をログに出さない。判定の印だけ
          if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then echo "$out" | grep -E '^VERIFY_' || true; else echo "$out"; fi
          # **「見えない」と「公開されていない」は違う。**
          # 配信が10分で終わらない日があり、それを「要対応」で出すと狼少年になる。
          # 公開されたかどうかは、翌日の publish_gap（手元と本番の一覧を突き合わせる）
          # が判定する。ここでは「確認中」として残すだけにする。
          if echo "$out" | grep -q "VERIFY_OK=no"; then
            echo "::warning::公開直後の確認では本番に出ていません（配信待ちの可能性）"
            echo "確認中: 公開直後に本番で確認できず（翌日の照合で判定します）" >> automation/logs/findings.txt
          fi

      # 検索エンジンへの通知は、本番に届いたかを確かめた後に送る。以前は publish_flow の中（コミット・
      # デプロイより前）で送っており、まだ配信されていないURLを知らせて404を踏ませていた。
      # デプロイが落ちた回は、この工程も走らない（出ていないURLを知らせない）。
      # お客様の社も同じく送る（2026-10-06）。以前は自前ビルドの枠だけで、お客様の新しい記事は
      # 週次の再送まで知らせていなかった。配信先のビルドは自分で動くので、通知は本番の sitemap に
      # 載ったURLだけを送る（notify_indexing / bing_webmaster が sitemap と突き合わせる）。
      # 鍵ファイル・Bing の確認ファイルは publish.py が配信と一緒に置いている（search_connect.place）
      # Bing への送信記録を前の回から戻す。戻さないと同じ日の2枠目が同じURLをもう一度送り、枠を食う
      - name: Bing への送信記録を戻す
        if: steps.site.outputs.skip != 'yes'
        uses: actions/cache/restore@v4
        with:
          path: data/bing_submit.json
          key: bing-submit-${{ github.run_id }}
          restore-keys: bing-submit-

      - name: 新しいURLを検索エンジンへ通知
        if: steps.site.outputs.skip != 'yes'
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}   # WordPress の社は橋渡しへ鍵・確認コードを渡す
        run: |
          id="${{ steps.site.outputs.id }}"
          mkdir -p automation/logs
          {
            # 自前ビルドの枠は今までどおり全サイトの sitemap を送る。お客様の社はその社の本日の記事だけ
            if [ "${{ steps.site.outputs.own }}" = "True" ]; then
              python scripts/notify_indexnow.py || true
            else
              python scripts/notify_indexnow.py --site "$id" || true
            fi
            python scripts/bing_webmaster.py --site "$id" || true
            if [ -n "$SA_JSON" ]; then
              printf '%s' "$SA_JSON" > indexing-service-account.json
              python scripts/notify_indexing.py --site "$id" || true
              rm -f indexing-service-account.json
            else
              echo "GCP_SERVICE_ACCOUNT_JSON 未設定 — Indexing API はスキップ"
            fi
          } > /tmp/notify.log 2>&1
          cat /tmp/notify.log
          # 先方にお願いすること（Search Console のオーナー・確認ファイルが出ない等）は通知の本文へ
          grep '^要対応' /tmp/notify.log >> automation/logs/findings.txt || true

      - name: Bing への送信記録を残す
        if: always() && steps.site.outputs.skip != 'yes' && hashFiles('data/bing_submit.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/bing_submit.json
          key: bing-submit-${{ github.run_id }}

      # 品質ゲートはすべて原稿とビルド出力を見ている。公開後の実物を見る工程が
      # 無かったため、社内向けTODOコメント・生成時の作業タグ </content>・
      # 失敗すると訪問者を追い出すフォームが、そのまま本番に届いていた。
      - name: 公開ページの検査
        if: steps.site.outputs.skip != 'yes'
        continue-on-error: true      # 検知が目的。反映待ちで run を落とさない
        run: |
          out=$(python scripts/live_check.py --site "${{ steps.site.outputs.id }}") || true
          if [ "${{ steps.site.outputs.quiet }}" = "yes" ]; then echo "$out" | grep -E '^LIVE_CHECK=' || true; else echo "$out"; fi
          if echo "$out" | grep -q "LIVE_CHECK=ng"; then
            echo "::warning::公開ページに問題が見つかりました。ログを確認してください"
            mkdir -p automation/logs
            { echo "要対応: 公開ページの問題";
              echo "$out" | grep "NG " | head -5; } >> automation/logs/findings.txt
          fi

      # 手元にあるのに本番に無い記事を、公開サイトのsitemapと突き合わせて拾う。
      # gitの差分では「配信済み」に見えてしまい、抜けに気づけない。
      - name: 未配信の記事がないかの確認
        continue-on-error: true
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}   # 配信と一緒に Bing の確認ファイルを置く
          HUB_URL: ${{ secrets.HUB_URL }}          # 配信できた記事の公開の後の手順（台帳への記録）に使う
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          # 公開確認の起点。finish が呼ばれた時刻を起点にすると、既に始まった配信先のビルドを見失い1本8分待つ
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          out=$(python scripts/publish_gap.py --publish) || true
          echo "$out"
          n=$(echo "$out" | grep -oE 'PUBLISH_GAP=[0-9]+' | cut -d= -f2)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::warning::未配信が ${n} 本ありました。この実行で配信しています"
          fi
          # ここで配信できた記事は、公開の後の手順（台帳・SNS・既存記事からのリンク）を通っていない
          # ことがある（承認の回に配信できず翌日に回った記事など）。finish は台帳が公開済みなら何もしない
          # 配信できた記事は publish_gap が automation/logs/published_now.txt（社 slug）に書く。ログの「○ slug」の行は
          # 拾わない（お客様の社の記事の slug はログに出さない。2026-10-10）
          touch automation/logs/published_now.txt
          while read -r site slug; do
            [ -n "$slug" ] || continue
            python scripts/publish_flow.py --finish "$site" "$slug" "--since=$since" < /dev/null \
              || echo "::warning::$(python3 scripts/private_store.py --shown "$slug") の公開の後の手順に失敗"
          done < automation/logs/published_now.txt
          # finish が既存記事に足したリンクを残す。コミット工程はこの前に終わっているため、
          # ここで入れないとランナーと一緒に消え、翌日の publish_gap が元の版で配信し直す
          for p in articles data/published.json data/body_hash.json; do if [ -e "$p" ]; then git add "$p"; fi; done
          if ! git diff --cached --quiet; then
            git commit -q -m "公開の後の手順: 既存記事から新記事へのリンク"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # 黙って消えると、翌日に元の版で配信し直されてリンクが消える
            if [ "$pushed" != 1 ]; then
              echo "::warning::既存記事へのリンクを push できませんでした"
              echo "要対応: 公開の後の手順で足したリンクを push できませんでした（次の配信で消えます）" >> automation/logs/findings.txt
            fi
          fi

      # お客様の記事に当てた直しの台帳の行（公開直後のリンク）と学びは public に置かず置き場に書く。残さないと消える
      - uses: ./.github/actions/client-private
        if: always()
        with: {mode: save}

      # 日次KPIは記事の枠から外した（daily-kpi.yml）。枠0が上限・量産の兆候で飛ぶと集計も飛んでいた
      - name: 運用通知
        if: (steps.site.outputs.skip != 'yes' || steps.site.outputs.blocked == 'yes') && always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="✅"; else icon="🚨"; fi
          # うまくいった回は送らない（--routine）。知らせることがある回だけ届く
          found=""
          if [ -f automation/logs/findings.txt ]; then found=$(cat automation/logs/findings.txt); fi
          python scripts/notify_slack.py --routine "$icon 記事パイプライン [${{ steps.site.outputs.id }}]: ${{ job.status }}
          $found
          $(git log -1 --pretty=%s)
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      # この回に書いた・直したお客様の社の記事・画像・台本・記録を非公開のリポジトリへ残す（公開側の git には入れない。
      # 公開側に commit が無い回も残す。門 gates_history_h77）
      - uses: ./.github/actions/private-data
        if: always()
        with: {mode: save}

