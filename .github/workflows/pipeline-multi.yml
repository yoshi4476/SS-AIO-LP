name: Multi-Site Article Pipeline

# 3サイトの記事生成を1本のワークフローに統合したもの。
# cronの時刻でどのサイトを書くかを決める（JST = UTC+9）。
# 各サイト1日2本（計6本/日）。1回の実行が10〜17分かかるため2時間ずつ空け、
# 同時実行によるpush競合とActionsの待ち行列を避けている。
#
# 補助金（subsidy）は 2026-07-30 にこちらへ移管した。
# seven-HPunyou 側の記事生成(auto-publish.yml)は停止済みで、
# 向こうは納品Markdownの受け入れ・HTML化・公開のみを担当する。
on:
  schedule:
    - cron: "0 23 * * *"  # JST 08:00 — AI集客ラボ 1本目
    - cron: "0 1 * * *"   # JST 10:00 — コーポレート 1本目
    - cron: "0 3 * * *"   # JST 12:00 — 補助金サポート 1本目
    - cron: "0 6 * * *"   # JST 15:00 — AI集客ラボ 2本目
    - cron: "0 8 * * *"   # JST 17:00 — コーポレート 2本目
    - cron: "0 10 * * *"  # JST 19:00 — 補助金サポート 2本目
  workflow_dispatch:
    inputs:
      site:
        description: "対象サイト"
        type: choice
        options: [ai-lab, corporate, subsidy]
        default: ai-lab

permissions:
  contents: write

concurrency:
  group: article-pipeline
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 対象サイトの判定
        id: site
        run: |
          case "${{ github.event.schedule }}" in
            "0 1 * * *"|"0 8 * * *")   s=corporate ;;
            "0 3 * * *"|"0 10 * * *")  s=subsidy ;;
            *)                         s=ai-lab ;;
          esac
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && s="${{ inputs.site }}"
          echo "id=$s" >> "$GITHUB_OUTPUT"
          echo "対象サイト: $s"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          npm install -g @anthropic-ai/claude-code

      - name: Git識別情報の設定
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"

      # 記事を1本書いてから最後のpushで落ちるのが一番もったいない。
      # トークンが失効していれば、着手前にここで止める。
      - name: 配信トークンの事前確認
        if: steps.site.outputs.id != 'ai-lab'
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          out=$(python scripts/token_check.py) || true
          echo "$out"
          if ! echo "$out" | grep -q "TOKEN_OK=yes"; then
            echo "::error::SITE_PUSH_TOKEN が使えません。再発行してSecretsを更新してください"
            exit 1
          fi

      - name: 執筆ブリーフの表示（KW残数と担当領域をログに残す）
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: python scripts/site_brief.py "${{ steps.site.outputs.id }}"

      - name: 全サイト横断のカニバリ・領域チェック
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: python scripts/cannibal_check.py --cross || true

      - name: 記事生成（Phase 1〜7）
        env:
          SITE_ID: ${{ steps.site.outputs.id }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          claude -p "$(cat automation/multi_site_prompt.txt)" \
            --dangerously-skip-permissions --max-turns 160
          rm -f indexing-service-account.json

      - name: 自リポジトリの記事をコミット
        run: |
          python scripts/build.py
          python scripts/local_kpi.py || true
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            git commit -m "publish(${{ steps.site.outputs.id }}): $(date '+%Y-%m-%d %H:%M JST')"
            for i in 1 2 3; do
              git push && break
              echo "push拒否 → リモートと統合して再試行 ($i/3)"
              if ! git pull --rebase -X ours origin "${GITHUB_REF_NAME}"; then
                git diff --name-only --diff-filter=U | while IFS= read -r f; do
                  if git cat-file -e "origin/${GITHUB_REF_NAME}:$f" 2>/dev/null; then
                    git checkout --ours -- "$f" 2>/dev/null && git add -- "$f" || git rm -f --ignore-unmatch -- "$f"
                  else
                    git rm -f --ignore-unmatch -- "$f"
                  fi
                done
                GIT_EDITOR=true git rebase --continue || git rebase --skip || git rebase --abort
              fi
            done
          fi

      # AI集客ラボは自リポジトリのサイトなので、ここでデプロイまで行う
      # （他サイトは publish.py が対象リポジトリへpushし、各サイトのビルドが動く）
      - name: Cloudflare Pagesへデプロイ（ai-labのみ）
        if: steps.site.outputs.id == 'ai-lab'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare APIは稀に522（一時的な接続タイムアウト）を返す。瞬断でrunを落とさないため再試行する
          for i in 1 2 3; do
            npx --yes wrangler@4 pages deploy site --project-name=ss-aio-lp --branch=master --commit-dirty=true && exit 0
            echo "Cloudflare APIが応答せず（$i/3）。40秒後に再試行"
            sleep 40
          done
          echo "::error::3回ともデプロイ失敗。記事はコミット済みなので次回のデプロイで反映される"
          exit 1

      # KPIは1日1回だけでよいので、朝の枠（ai-lab）のときにまとめて3サイト分を集計する
      - name: KPI集計 → 管制塔ダッシュボード
        if: steps.site.outputs.id == 'ai-lab' && github.event.schedule == '0 23 * * *'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
            pip install --quiet google-analytics-data google-api-python-client google-auth
            python scripts/daily_kpi.py --send || true
            rm -f indexing-service-account.json
          fi

      - name: 運用通知
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="✅"; else icon="🚨"; fi
          python scripts/notify_slack.py "$icon 記事パイプライン [${{ steps.site.outputs.id }}]: ${{ job.status }}
          $(git log -1 --pretty=%s)
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
