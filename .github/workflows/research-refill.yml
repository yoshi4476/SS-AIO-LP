# 業種調査の ChatGPT の欠けた問いだけを、毎日 CI で聞き足す（ChatGPT のサブスク＝Codex。課金APIは使わない）。
# 2026-10-05 まで手元のパソコンのタスクで回しており、電源が切れると止まった。CI に移す。
# 既にある答え（data/research/*-raw.json）は消さず、欠けた分だけを足す（--refill）。全業種そろえば何も聞かずに終わる。
# Codex のログイン情報は使うと更新されることがあるので、変わっていたら Secrets の CODEX_AUTH_JSON を書き換える
# （書き換えないと、次の回は古いログイン情報で失敗し、手元のログインも切れる）。
name: 業種調査の聞き足し

on:
  schedule:
    - cron: "7 */4 * * *"   # 4時間ごと。ChatGPT の利用上限は数時間で明けるので、待たずに何度か覗く（上限中はすぐ終わる）
  workflow_dispatch:

concurrency:
  group: industry-research   # 3か月ごとの業種調査と同時に動かさない（同じサブスクの枠を食い合う）
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 依存インストール
        run: |
          python -m pip install --quiet -r requirements.txt
          npm i -g @openai/codex @anthropic-ai/claude-code >/dev/null 2>&1

      # 保存は最後の工程で必ず行う（actions/cache の後片付けは成功時しか保存せず、時間切れの日の答えが消えた）
      - name: AIの答えを前回から持ち越す
        uses: actions/cache/restore@v4
        with:
          path: data/ai_cache
          key: ai-cache-${{ github.run_id }}
          restore-keys: ai-cache-

      - name: Codex にログインする
        id: login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then echo "::warning::CODEX_AUTH_JSON 未登録（ChatGPT に聞けません）"; echo "ok=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          sha256sum ~/.codex/auth.json | cut -c1-64 > /tmp/auth.before
          codex login status || echo "::warning::Codex のログインを確かめられません（期限切れなら手元で codex login をやり直し、set_secrets.py で登録）"
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      - name: 欠けた問いだけ聞き足す
        if: steps.login.outputs.ok == 'yes'
        timeout-minutes: 110
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/research_run.py --minutes 100 --no-wait 2>&1 | grep -vE "^\s+[0-9]+/[0-9]+$" | tail -40
          python scripts/question_pages.py --data 2>&1 | tail -3 || true

      - name: 更新されたログイン情報を Secrets に戻す
        if: always() && steps.login.outputs.ok == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_TOKEN }}
        run: |
          [ -f ~/.codex/auth.json ] || exit 0
          now=$(sha256sum ~/.codex/auth.json | cut -c1-64)
          if [ "$now" = "$(cat /tmp/auth.before)" ]; then echo "ログイン情報は変わっていません"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::warning::GH_SECRET_TOKEN が無く、更新されたログイン情報を戻せません（次の回は失敗します）"; exit 0; fi
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < ~/.codex/auth.json && echo "ログイン情報を更新しました"

      - name: 片付け
        if: always()
        run: rm -f ~/.codex/auth.json /tmp/auth.before

      - name: AIの答えを次の回へ残す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/ai_cache
          key: ai-cache-${{ github.run_id }}

      # 聞き足しが途中で止まっても、10問ごとに書き出した分は公開する
      - name: 公開する
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          git add data/research
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -q -m "業種調査の ChatGPT の聞き足し $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; then
              # GITHUB_TOKEN の push では他のワークフローが動かないので、公開を明示的に起動する
              gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" || echo "::warning::公開を起動できませんでした（次の push で反映されます）"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::push できませんでした"; exit 1

      # 聞き足しは、3か月ごとの調査の欠けをそろえるためだけに動く。そろったら自分を止める（運用者の決定 2026-10-05:
      # 調査は3か月に1回）。次の3か月ごとの回（industry-research.yml）で欠けが出たときだけ、有効に戻される
      - name: 全業種そろったら止める
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          left=$(python scripts/research_run.py --left)
          echo "ChatGPT の答えが足りない業種: ${left}"
          if [ "${left}" = "0" ]; then
            gh workflow disable research-refill.yml --repo "$GITHUB_REPOSITORY" && echo "全業種そろったので、毎日の聞き足しを止めました（次は3か月ごとの調査のあと）"
          fi
