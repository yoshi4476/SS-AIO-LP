name: Weekly Optimize

# 毎週月曜 10:23 JST（= UTC 1:23 月曜）に既存記事のリライト・内部リンク・AIO構造を自動最適化
on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "配信し直す起点（既定はこの実行で直した分。取りこぼしを流すときだけ広げる。例: HEAD~10）"
        type: string
        default: "HEAD~1"
      force:
        description: "今週もう済んでいても動かす（同じ週に2回目を手で流すときだけ）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # 同じ週に済んだ run があるかを見る（schedule_guard）

concurrency:
  group: article-pipeline
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  # 同じ週に2回動かさない。GitHub の schedule は数時間遅れることがあり（2026-10-05 は3時間過ぎても始まらず手で起動）、
  # 自動修復の見張り（selfheal.yml）も取りこぼしを起動する。その週（日本時間の月曜から）に成功で終わった run か、
  # 先に始まって動いている run があれば、この回は何もしない。手で2回目を流すときは force
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "force のため、今週の実行の有無を見ません"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          out=$(python3 scripts/schedule_guard.py --already-ran weekly-optimize.yml --week --run-id "${{ github.run_id }}" 2>&1) || true
          echo "$out"
          # 判定が動かなかったときは動かす（止めると、その週の最適化がまるごと抜ける）
          if echo "$out" | grep -q '^ALREADY_RAN=yes'; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  # ── 並行ジョブ（2026-10-04）──────────────────────────────────────────
  # 記事（articles/）を書き換える工程と、コミットする工程は optimize に順番どおり残す。
  # ここに出したのは「記事に触らず、後ろの工程が同じ実行の中で結果を読まない」ものだけ。
  # 書き出すファイルは optimize と重ならない（重なると rebase で衝突する）。
  # 並行ジョブの失敗で週次全体を落とさない（push できなければ注意を出して終える）

  # KWキューの補充（管制塔の台帳・ラッコ・Gemini）。記事は読むだけで書かない。
  # 書き出すのは docs/ai-kw-*.md・data/ai_kw/・data/ai_cache/・KW計画の追記だけで、
  # optimize が読むのは中盤の pull の後（実測・共起語の工程）なので、先に終わっていれば同じ結果になる
  kw-refill:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HUB_URL: ${{ secrets.HUB_URL }}
      HUB_SECRET: ${{ secrets.HUB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: サービスアカウントの鍵を置く
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          mkdir -p automation/logs
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > indexing-service-account.json
            chmod 600 indexing-service-account.json
          else
            echo "::warning::GCP_SERVICE_ACCOUNT_JSON が未設定です（GSC/GA4 を使う工程は空振りします）"
          fi

      # ラッコの利用記録と応答の控えを、実行をまたいで持ち越す（公開リポジトリには置けないためキャッシュで）。
      # 持ち越さないと月の上限（1,000）が1回分しか数えられず、30日キャッシュも効かずに毎回課金される
      - name: ラッコの控えを戻す
        uses: actions/cache/restore@v4
        with:
          path: |
            data/rakko_cache
            data/rakko_volume.json
            data/rakko_spend.jsonl
          key: rakko-${{ github.run_id }}
          restore-keys: rakko-

      # KWキューを実データ（GSC実績+Googleサジェスト）で補充する。
      # 推定KWではなく「実際に検索されている語」を供給し続けるための工程。
      - name: KWキューの実データ補充
        env:
          # 未設定なら無料のサジェストだけで動く（キー待ちで止めない）。
          # ここへ渡し忘れると、手元では効いているのにCIだけ効かない
          RAKKO_API_KEY: ${{ secrets.RAKKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1サイトの失敗で全体を止めたくないが、黙って0件のまま進むと在庫が枯れる。
          # 結果を必ず表示し、追記できなかったサイトは管制塔のエラーログへ残す。
          for s in $(ls sites/*.json | xargs -n1 basename | sed "s/\.json$//" | grep -v "^sample$" | sort); do
            echo "--- $s のKW補充 ---"
            if out=$(python scripts/kw_discover.py --site "$s" --append 2>&1); then
              echo "$out" | tail -3
              echo "$out" | grep -q "件を追記しました"                 || python scripts/hub_client.py error_log kw "$s: 週次補充で新規KWを追記できませんでした（在庫が枯れる前に手当てが必要）" || true
            else
              echo "$out" | tail -5
              python scripts/hub_client.py error_log kw "$s: 週次補充が失敗しました" || true
            fi
            # 拠点の地域×業種の語（無料のサジェストで需要があるものだけ。kw_seeds.regions を書いた社だけ動く）
            python scripts/region_kw.py --site "$s" --append 2>&1 | tail -4 || true
            # クレジット切れは実行ログの奥に埋もれる。補充が細る原因に
            # 気づけないため、注釈と通知に回す（記事作成自体は止まらない）。
            # 通知本文は optimize が組むので、成果物で渡す（下の「要対応を渡す」）
            if echo "$out" | grep -q "RAKKO_CREDIT=out"; then
              echo "::warning::ラッコキーワードのクレジットが尽きました（無料のサジェストだけで継続中）"
              echo "要対応: ラッコキーワードのクレジットが尽きました（候補の質が落ちます）" >> automation/logs/findings.txt
            fi
          done
          # AI検索で答えが出る語（質問形）を、GSCの実績とサジェストから毎週さがして台帳へ積む。
          # 検索つきのAI（Gemini）へは1サイト8語まで聞く。キーが無ければ候補の抽出だけ行う
          python scripts/ai_kw_research.py --all --probe 8 --append 2>&1 | tail -12 || true
          # 業種ごとの「今の時期の特集」の語（data/season_calendar.json・期間中だけ・食い合い審査を通った語）
          python scripts/season_feature.py --kw 2>&1 | tail -6 || true
          python scripts/kw_status.py

      # お客様の社の AI の語（.gitignore）を、次に読む工程（記事の枠の next_kw・optimize の共起語/勝ち型）へ渡す。
      # optimize と並行に動くので別の系統（ai-kw）に残す（同じ系統だと optimize の古い写しで上書きされる）
      - uses: ./.github/actions/client-private
        if: always()
        with: {mode: save, family: ai-kw, kinds: ai_kw}

      - name: ラッコの控えを残す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/rakko_cache
            data/rakko_volume.json
            data/rakko_spend.jsonl
          key: rakko-${{ github.run_id }}-weekly

      # 鍵・ラッコの控えは .gitignore 済みなので git add -A に入らない
      - name: 補充の記録を正本へ保存
        run: |
          rm -f indexing-service-account.json
          git add -A
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -q -m "weekly: KWの補充とAI検索の語の記録 $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true     # 途中の rebase を残すと、次の再試行も必ず失敗する
            sleep 5
          done
          echo "::warning::KW補充の記録を push できませんでした（台帳への追記は済んでいます）"

      - name: 要対応を渡す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kw-findings
          path: automation/logs/findings.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: 鍵の後始末
        if: always()
        run: rm -f indexing-service-account.json

  # 未登録ページの検査（URL検査API・15分）。ここでは通知しない（--dry）。
  # 通知は optimize の最後に、この結果を使って行う（--from-cache）。先に通知すると Indexing API の
  # 1日200件をこの再通知が使い、その日に直した記事の通知（notify_indexing）が落ちる
  index-inspect:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUB_URL: ${{ secrets.HUB_URL }}
      HUB_SECRET: ${{ secrets.HUB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: 登録されていないページを検査する
        timeout-minutes: 20
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "GCP_SERVICE_ACCOUNT_JSON 未設定 — スキップ"; exit 0; fi
          printf '%s' "$SA_JSON" > indexing-service-account.json
          chmod 600 indexing-service-account.json
          python scripts/reindex.py --dry --budget-min 15 || true
          rm -f indexing-service-account.json

      # お客様の社のURLの検査結果は public の記録と成果物に入れず（client_private）、キャッシュで optimize の再通知へ渡す
      - uses: ./.github/actions/client-private
        if: always()
        with: {mode: save, family: index, kinds: "-"}

      - name: 検査の結果を渡す
        uses: actions/upload-artifact@v4
        with:
          name: index-cache
          path: data/index_cache.json
          if-no-files-found: ignore
          retention-days: 3

      # 登録済みと確かめたURLの記録を残す（次の週はそこを検査しない）
      - name: 検査の記録を正本へ保存
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          for p in data/index_cache.json; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -q -m "weekly: インデックス検査の記録 $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::インデックス検査の記録を push できませんでした（通知は optimize が成果物から行います）"

      - name: 鍵の後始末
        if: always()
        run: rm -f indexing-service-account.json

  # 読むだけの検査（結果はログ・注釈・管制塔のエラーログに出るだけで、ファイルを書かない）。
  # どれも live の GSC/GA4/本番サイトか、原稿を読むだけなので、記事の直しを待つ理由が無い
  reports:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_URL: ${{ secrets.HUB_URL }}
      HUB_SECRET: ${{ secrets.HUB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: サービスアカウントの鍵を置く
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > indexing-service-account.json
            chmod 600 indexing-service-account.json
          else
            echo "::warning::GCP_SERVICE_ACCOUNT_JSON が未設定です（GSC/GA4 を使う工程は空振りします）"
          fi

      # 既存記事どうしの検索意図の重複を検出（LLMが対処判断に使う）
      - name: カニバリゼーション検査
        run: python scripts/cannibal_check.py

      # 落ちたときに気づく仕組み。合計だけ見ても何を直せばいいか分からないので、
      # 消えた語と順位が下がった語に分解して出す
      - name: 表示・クリックが落ちていないかの確認
        run: |
          python scripts/growth_guard.py || true

      # 書く前の類似度では見つからない食い合い。似ていない記事どうしでも、
      # 同じ語で自社ページが並べばどれも上がらないため、実績で見る
      - name: 同じ検索語での自社ページの食い合い（GSC実績）
        run: |
          python scripts/cannibal_check.py --serp || true

      # 実行時間の無料枠を使い切ると全自動運転が無言で止まるため事前に警告する
      - name: Actions実行時間の残枠チェック
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: python scripts/actions_budget.py || true

      # 打った手が効いたかを、触っていない記事と比べて判定する。
      # サイト全体が伸びている時期は、何をしても「効いた」に見えるため
      - name: 打った手の効き（対照群と比較）
        run: |
          python scripts/effect_ab.py || true
          # 書き直し・統合の種類ごとの効き（前後28日・対照群比）。結果は data/rewrite_effect.json
          python scripts/effect_ab.py --rewrites || true

      # どの業種×手法が空いているかを盤面で出す。空きマスは、そのまま
      # 次に書くべき記事になる。1本ずつ選んでいると面の欠けに気づけない
      - name: 盤面の空きを出す（業種 × 手法）
        run: |
          # 全社（お客様の社も）。sites/*.json から一覧を作る（3サイトを並べるとお客様に回らない）
          for s in $(python scripts/sites.py --ids); do
            python scripts/coverage.py --site "$s" || true
            python scripts/coverage.py --site "$s" --gaps 8 || true
          done

      - name: CTA文言のA/B結果
        run: python scripts/ab_result.py || true

      - name: リード導線のどこで落ちているか
        run: |
          out=$(python scripts/funnel.py) || true
          echo "$out"
          echo "$out" | grep -q "最も落ちている段階"             && echo "::warning::リード導線に落ち込みがあります。ログを確認してください" || true

      # コーポレートの調査ページと AIO運用代行の業種別の表を、ラボの集計と同じ数字に揃える。
      # 業種調査は ChatGPT の利用上限で数日かけて埋まるので、3か月ごとの回だけでは古い数字が残る（変わらなければ push しない）
      - name: コーポレートの調査データを最新にする
        env:
          PYTHONIOENCODING: utf-8
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: python scripts/research_publish.py --push 2>&1 | tail -3 || echo "::warning::コーポレートの調査データを配信できませんでした"

      # 問い合わせが3サイトから管制塔の台帳まで届くかを、本物と同じ経路で確かめる（テスト専用のアドレスで送り、台帳には入れない）。
      # 2026-09-18 に診断の送信2件が台帳にもメールにも残らず失われ、気づくまで10日かかった
      - name: 問い合わせの疎通確認
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          out=$(python scripts/lead_probe.py) || true
          echo "$out"
          echo "$out" | grep -q "LEAD_PROBE_OK=no" && echo "::warning::問い合わせが台帳まで届いていないサイトがあります（ログの「要対応」）" || true
          # 注釈だけでは誰にも届かない。要対応は optimize の通知本文へ渡す（下の「要対応を渡す」）
          mkdir -p automation/logs
          echo "$out" | grep -o '要対応:.*' >> automation/logs/findings.txt || true

      # AI診断の段階ごとの数（入口→診断→結果→次の一歩→メールから戻った→相談）。どこで落ちているかを毎週見る
      - name: AI診断の段階ごとの数
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          out=$(python scripts/aicheck_funnel.py) || true
          echo "$out"
          echo "$out" | grep -q "AICHECK_FUNNEL_OK=no" && echo "::warning::AI診断で、ページは見られているのに診断を始めた人がいません" || true
          mkdir -p automation/logs
          echo "$out" | grep -o '要対応:.*' >> automation/logs/findings.txt || true

      - name: 生成エンジンから読める状態かの検査（GEO）
        run: |
          out=$(python scripts/geo_check.py) || true
          echo "$out"
          if ! echo "$out" | grep -q "GEO_OK=yes"; then
            echo "::warning::生成エンジン向けの状態に欠けがあります"
            python scripts/hub_client.py error_log geo               "$(echo "$out" | grep -A6 'GEO_OK=no' | head -6)" || true
            mkdir -p automation/logs
            echo "$out" | sed -n 's/^  - /要対応: 生成エンジン向けの欠け — /p' >> automation/logs/findings.txt || true
          fi

      - name: 2ページ目で止まっている記事の洗い出し
        run: |
          if [ -f indexing-service-account.json ]; then
            python scripts/rewrite_list.py --top 12 || true
          fi

      # このジョブは通知しない。問い合わせの疎通・AI診断・生成エンジン向けの要対応は optimize が通知本文へ足す
      # （kw-refill と同じ渡し方）。以前は注釈と管制塔のエラーログだけで、メールに載らなかった（2026-10-07 の点検）
      - name: 要対応を渡す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-findings
          path: automation/logs/findings.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: 鍵の後始末
        if: always()
        run: rm -f indexing-service-account.json

  optimize:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    # 60分では足りず、2026-09-21 は再通知の工程で打ち切られ、コミットも配信も走らなかった。
    # public リポジトリなので実行時間は無料。重い工程はそれぞれ --budget-min で自分を止める
    timeout-minutes: 180
    # 管制塔はジョブ全体で使う。工程ごとに渡していたため、渡し忘れた工程の
    # hub_client error_log が黙って終わり、見つけた異常がどこにも残らなかった
    env:
      HUB_URL: ${{ secrets.HUB_URL }}
      HUB_SECRET: ${{ secrets.HUB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          npm install -g @anthropic-ai/claude-code
          # ネイティブバイナリが落ちてこないことがある（postinstallが走らない／
          # optional依存が省かれる）。実行時まで気づけず、記事生成ごと落ちる。
          # ここで動作を確かめ、駄目ならインストーラを直接叩き直す。
          if ! claude --version >/dev/null 2>&1; then
            echo "claude が動かないため postinstall をやり直します"
            node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs" || true
          fi
          claude --version

      # お客様の社の順位・共起語・引用の記録（.gitignore と置き場）を前の回から戻す（最後に残す）
      - uses: ./.github/actions/client-private
        with: {mode: restore}

      # 記事のページ・sitemap・feed を Git から外す準備（2026-10-03）。このあとの工程が手元のページを読むので、
      # 先に原稿から作っておく。作れなくても止めない（外す前は、コミット済みのページが残っている）
      - name: 原稿からページを作る
        run: |
          # 前回の通知本文を先に空にする（後の工程で空にすると、この工程が書いた要対応まで消えた）
          mkdir -p automation/logs
          rm -f automation/logs/findings.txt
          python scripts/build.py > /tmp/prebuild.log 2>&1 && tail -2 /tmp/prebuild.log || {
            tail -20 /tmp/prebuild.log
            echo "::warning::原稿からページを作れませんでした（このあとの工程は古いページを読みます）"
            mkdir -p automation/logs
            echo "要対応: 原稿からページを作れませんでした（$GITHUB_WORKFLOW）" >> automation/logs/findings.txt
          }

      - name: Git識別情報の設定
        env:
          INPUT_SINCE: ${{ inputs.since }}   # 入力は環境変数で受ける（run に直接埋めるとコマンドとして解釈される）
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          # 通知本文は工程ごとに追記し、最後に findings.py が既存の要対応を残して組み直す。
          # 前回分は「原稿からページを作る」の先頭で空にしている
          mkdir -p automation/logs
          # 配信の基点。途中の工程が何度コミット・rebase しても、最後にこの時点からの
          # 差分をまとめて他サイトへ配信する（途中1回だけだと後段の直しが届かなかった）
          since="$INPUT_SINCE"
          base=$(git rev-parse HEAD)
          if [ -n "$since" ] && [ "$since" != "HEAD~1" ]; then
            # 取りこぼしを流すときだけ履歴を取り寄せる（checkout は直近1コミットしか持たない）
            git fetch -q --unshallow origin || true
            base=$(git rev-parse "$since" 2>/dev/null) || { echo "::warning::起点 $since を解決できません。この実行の分だけ配信します"; base=$(git rev-parse HEAD); }
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "配信の基点: $base"

      # サービスアカウントの鍵はジョブの最初に1回だけ置き、最後の後始末で消す。
      # 工程ごとに書いて消していたため、書き忘れた工程（auto_improve・auto_merge・
      # 週次レポートなど）が鍵なしで動き、GSC/GA4 を読めないまま `|| true` で成功扱いになっていた。
      # .gitignore 済みなので途中の git add -A には入らない
      - name: サービスアカウントの鍵を置く（ジョブで1回）
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > indexing-service-account.json
            chmod 600 indexing-service-account.json
          else
            echo "::warning::GCP_SERVICE_ACCOUNT_JSON が未設定です（GSC/GA4 を使う工程は空振りします）"
          fi

      # 期限のあるトークンを、切れる前に更新する。
      # 切れてから気づくと、その間の配信が丸ごと落ちる。
      - name: SNSトークンの更新
        env:
          GH_SECRET_TOKEN: ${{ secrets.GH_SECRET_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          SOCIAL_TOKENS_JSON: ${{ secrets.SOCIAL_TOKENS_JSON }}
        run: |
          pip install --quiet pynacl
          python scripts/refresh_tokens.py || true
          # 社ごとの Threads の鍵を切れる前に更新する（人の操作なしで60日ずつ延びる）
          mkdir -p automation/logs
          python scripts/social_connect.py --refresh 2>&1 | tee /tmp/social.txt || true
          grep '^要対応' /tmp/social.txt >> automation/logs/findings.txt || true

      # 業種別の調査の数字を note の下書きに（言及の元になる社名とURLつき）。投稿は人が行う。
      # claude も課金APIも呼ばない。ChatGPT の回答がそろった業種だけ・1業種1回
      - name: 調査の数字を note の下書きに積む
        run: python scripts/research_promo.py --note --limit 2 || true

      # GSCが読めているかを毎週確認する。ここが黙って落ちると補充が
      # サジェスト頼りになり、有限の候補を掘り尽くして在庫が枯れる。
      - name: Search Consoleの疎通確認
        run: |
          if [ ! -f indexing-service-account.json ]; then echo "::warning::GCP_SERVICE_ACCOUNT_JSON が未設定です"; exit 0; fi
          pip install --quiet google-api-python-client google-auth
          # 例外で終わっても週次全体を止めない（-e で代入ごと落ち、下の記録も後続も飛んでいた）
          out=$(python scripts/gsc_check.py 2>&1) || true; echo "$out"
          echo "$out" | grep -q "GSC_OK=yes"             || python scripts/hub_client.py error_log gsc "GSCの検索データを取得できないサイトがあります（補充がサジェスト頼りになります）" || true

      # 品質スコアは書いた本人が付けている。別工程で採点し直して差を見る。
      # 毎週4本ずつ。全部を採点し直すと時間がかかりすぎる。
      # 原稿を読むだけ（書くのは data/score_audit.json だけ）なので、このあとの
      # 内部リンク・導線の工程と並べて裏で走らせ、結果を読む「判断が当たっているか」の前で待つ。
      # この間に claude を呼ぶ工程は無い（同時に2つの claude を走らせない）
      - name: 品質スコアを別工程で採点し直す（裏で開始）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/score_audit
          setsid nohup bash -c 'python scripts/score_audit.py --limit 4 > /tmp/score_audit/log.txt 2>&1; echo $? > /tmp/score_audit/done' > /dev/null 2>&1 &
          echo $! > /tmp/score_audit/pid
          echo "採点し直しを裏で始めました（pid $(cat /tmp/score_audit/pid)）"

      - name: 内部リンクの補充（被リンクの少ない記事へ）
        run: |
          for s in $(python scripts/sites.py --ids); do
            python scripts/link_boost.py "$s" --write || true
          done

      # 順位で止まっている記事を優先して補充する。被リンクの少ない順に配ると、
      # 1ページ目の手前にいる記事に届かない。実測で、止まる27本のうち
      # 被リンク5本以下は3本だけだった
      - name: 11〜30位で止まっている記事へ内部リンクを寄せる
        run: |
          # 生の出力は通知本文に入れない（要対応の行だけを拾う）
          mkdir -p automation/logs
          { python scripts/rank_rescue.py --refresh || true
            python scripts/key_queries.py --track || true
            python scripts/brand_search.py || true
            python scripts/mentions.py --check || true; } > automation/logs/rank_rescue.txt 2>&1
          tail -40 automation/logs/rank_rescue.txt
          grep '^要対応' automation/logs/rank_rescue.txt >> automation/logs/findings.txt || true
          # 全社。GSC の権限が無い社は順位が取れず、その社は対象0本で終わる（|| true で他社は続く）
          for s in $(python scripts/sites.py --ids); do
            python scripts/link_boost.py "$s" --rescue --write || true
            # URL検査で未登録のまま公開3週を過ぎた記事へ、検索1ページ目の記事から文中リンク（1回5記事まで）。
            # 再通知（reindex --from-cache）だけでは登録まで届かなかった（コーポレートの 8/30〜9/9 公開分）
            python scripts/link_boost.py "$s" --unindexed --write || true
          done

      - name: 無料診断への導線を新しい記事にも入れる
        run: python scripts/tool_links.py --write || true

      - name: 管制塔スプレッドシートを整える（文字切れの防止）
        run: python scripts/sheet_format.py || true

      - name: 実測データの公開ページを更新
        run: python scripts/data_page.py || true

      # 自社の計測結果そのものを一次データとして公開する。
      # AIが根拠に選ぶのは「そこにしか無い数字」で、手で集計する形にしていた
      # ため1本しか増えていなかった。GSC・GA4から毎週自動で作り直す
      - name: 一次データを計測から作り直す
        run: |
          python scripts/data_auto.py --write || true

      # 計測が2通りで一致しているかを先に確かめる。食い違ったまま先へ進むと、
      # 誤った数字の上に次の判断が乗る（CLAUDE.md 0.1）
      - name: 計測の照合を確かめる
        run: |
          python scripts/measure.py --selftest || true
          python scripts/measure.py --log || true

      # CTAが2箇所に満たない記事を埋める。CLAUDE.md が決めているのに検査が
      # 無く、公開136本のうち59本が足りていなかった
      - name: CTAの本数を揃える
        run: python scripts/cta_fill.py --write || true

      # 裏で始めた採点し直しの終わりを待つ。この後の validate_rules・auto_rewrite が
      # data/score_audit.json を読むため、ここより後へは持ち越さない（20分で打ち切る）
      - name: 品質スコアの採点し直しを待つ
        run: |
          for i in $(seq 1 120); do [ -f /tmp/score_audit/done ] && break; sleep 10; done
          tail -30 /tmp/score_audit/log.txt 2>/dev/null || true
          if [ ! -f /tmp/score_audit/done ]; then
            echo "::warning::採点し直しが20分で終わらないため止めます（今週は前回の採点を使います）"
            pid=$(cat /tmp/score_audit/pid 2>/dev/null)
            [ -n "$pid" ] && kill -- -"$pid" 2>/dev/null || true
          fi

      # 使っている判断（点数・語の性質・内部リンクの下限）が、実際の成果を
      # 言い当てているかを確かめる。当たっていない判断で選び続けると、
      # 努力の向き先がずれる。実測で2件が当たっていなかった
      - name: 判断が当たっているかを確かめる
        run: |
          python scripts/validate_rules.py || true

      # 順位そのものは保証できない。保証できるのは「順位を決める要因のうち
      # こちら側にあるものを毎回100%満たすこと」。その達成率を毎週出す
      - name: こちら側で決まる要因の達成率
        run: |
          python scripts/guarantee.py || true

      # あと少しで1ページ目に届く記事は、放っておいても上がらない。
      # 被リンクが足りないまま何ヶ月も止まるので、毎週そこを埋める
      - name: 1ページ目に近い記事の底上げ（主力の語のみ）
        run: |
          python scripts/priority_boost.py --write || true

      # 順位を上げることだけに絞った工程。11〜20位の層を狙う。
      # データの取り方を1か所に固定し、page次元の数字を正とする。
      # query次元は検索数の少ない語をGSCが返さないため、実測でクリックが
      # 3〜4割少なく出た。その食い違いに気づかず誤った判断をしたことがある。
      # 直した記録を data/rank_up.json に残し、--effect で前後を比べる
      - name: 順位を上げる（1ページ目に最も近い層）
        run: |
          python scripts/rank_up.py --effect || true
          python scripts/rank_up.py --write || true

      # 長い段落は読みにくいだけでなく、AI検索も一文を切り出しにくい。
      # 文の切れ目でだけ分け、地の文が1字でも変わったら書き換えない
      - name: 長すぎる段落を分ける
        run: python scripts/split_paragraphs.py --all --write || true

      # 段落を分ける工程は「。」の位置でしか切れない。1文が100字を超えるものは
      # その中に「。」が無いので手が出せなかった。左がそれだけで文になる形に限れば、
      # 意味を変えずに機械で分けられる
      - name: 長すぎる1文を分ける
        run: python scripts/split_sentences.py --write || true

      - name: 効果の出ていない記事を自動で手当てする
        run: python scripts/auto_improve.py --write || true

      # auto_improve が「人が判断」として回していた分を、ここで直す。
      # 判断は claude がし、通してよいかは機械が決める。検算に1つでも外れたら
      # git checkout で元に戻すので、悪い書き換えは残らない。
      # 1回6本。検算に外れたものは git checkout で戻るため、数を増やしても壊れない。
      # 実測で直すべきページが35件あり、週2本では18週かかっていた
      # 検算が効いていることを先に確かめる。やってはいけない書き換えを
      # こちらで当てて、止まるかを見る（claude は呼ばない）。
      # 止まらなければ次の工程を飛ばす。検算が壊れたままエージェントを
      # 動かすと、悪い書き換えがそのまま公開される
      - name: 検算が効くか確かめる
        id: guard
        run: |
          if python scripts/auto_rewrite.py --selftest; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::error::検算が効いていません。記事の書き換えは行いません"
            python scripts/hub_client.py error_log rewrite \
              "auto_rewrite の検算が効いていません（書き換えは飛ばしました）" || true
          fi

      - name: タイトル・検索意図の直し
        if: steps.guard.outputs.ok == 'yes'
        # claude を呼ぶ工程。鍵を渡し忘れると1本も直せないまま `|| true` で成功扱いになる
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 対象37件に対して週6本では追いつかない（検索での取りこぼしは28日で
        # 約100クリック）。リポジトリはpublicでActionsの時間制限が無いため
        # 本数を上げる。1本最大30分かかるので、時計でも止める（ジョブの上限は60分で、
        # 途中で切られると直した分がcommitされずに捨てられる）
        run: |
          # 本数は社数に比例させる（1社あたり週8本）。上限の時間は budget-min が守る。
          # 2026-09-28 は15本を試して9本直し6本は検算で戻した（15分）。待ちが50件あり、
          # 11〜20位の記事を1ページ目へ上げるのが最大の伸びしろのため本数を上げた（2026-10-02）
          N=$(ls sites/*.json | grep -vc sample); n=$(( N * 8 )); [ "$n" -lt 24 ] && n=24
          python scripts/auto_rewrite.py --write --limit $n --budget-min 40 --parallel 3 || true

      # 同じ語に自社の2本が出ている組は、差別化ではなく統合する（第8.1章）。
      # 負けた側の中身を勝った側へ claude に足させ、検算に通ったものだけ 301 で送る。
      # 検算が効くことを先に確かめる（効かなければ統合しない）
      - name: 食い合う記事の統合（検算つき）
        if: steps.guard.outputs.ok == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if python scripts/auto_merge.py --selftest; then
            # 記事を増やした分が伸びていないサイトがある週は4組（content_yield。本数は減らさず統合で整える）
            n=2; python scripts/content_yield.py --any-flagged >/dev/null 2>&1 && n=4
            # 統合案は2組同時に書かせる（1組は最長40分の応答待ち）。当てて検算するのは1組ずつ
            python scripts/auto_merge.py --write --limit $n --budget-min 30 --parallel 2 || true
          else
            echo "::error::統合の検算が効いていません。統合は行いません"
            python scripts/hub_client.py error_log merge \
              "auto_merge の検算が効いていません（統合は飛ばしました）" || true
          fi

      # 業種を入れ替えただけの同型記事（scaled_guard の組）も、同じ統合処理で週2組ずつ片付ける。
      # 勝ちは28日の実績（クリック→表示）で決め、負けた側にクリックが4回以上ある組は触らない。
      # 同型の組で検算が効くことを先に確かめる（効かなければ統合しない）
      - name: 同型記事の統合（検算つき・週2組）
        if: steps.guard.outputs.ok == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if python scripts/auto_merge.py --scaled --selftest; then
            n=2; python scripts/content_yield.py --any-flagged >/dev/null 2>&1 && n=4
            python scripts/auto_merge.py --scaled --write --limit $n --budget-min 25 --parallel 2 || true
          else
            echo "::error::同型記事の統合の検算が効いていません。統合は行いません"
            python scripts/hub_client.py error_log merge \
              "auto_merge --scaled の検算が効いていません（同型記事の統合は飛ばしました）" || true
          fi

      # 当てた修正の積み上がりを見る。link_boost・tool_links・auto_improve は
      # どれも1本ずつしか見ないため、ここでしか全体の偏りに気づけない。
      # 実測で同じ一文がリンク文の41.5%を占めていた
      - name: 自動修正の見直し（積み上がりと言い回しの偏り）
        run: python scripts/auto_review.py --fix || true

      # リンク文の長さは、ほぼアンカーの長さで決まる。記事タイトルをそのまま
      # 当てると45字まで伸び、前後の文と合わせて1文が100字を超える。
      # リンク先は変えず、表示される文字だけを意味の切れ目で詰める
      # リンクの文言は、そのページの主題を検索エンジンへ伝える。
      # 「こちら」や記事タイトルの丸写しばかりだと、狙う語との結びつきが作られない。
      # 実測で38本が「狙う語を含むアンカー0本」だった。
      # 先に狙う語を入れ、そのあとで長さを詰める（順序を逆にすると語が落ちる）
      - name: リンクの文言に狙う語を入れる
        run: python scripts/anchor_audit.py --fix --write || true

      - name: 長すぎるアンカーテキストを詰める
        run: python scripts/shorten_anchors.py --write || true

      # 段落の切れ目の崩れは点数に出ないが、画面では表がパイプ記号のまま出る。
      # リンク挿入と段落分割がそれぞれ別の壊し方をしていた
      - name: 段落の切れ目の崩れを直す
        run: python scripts/fix_block_breaks.py --write || true

      - name: 直した記事が基準を割っていないか
        run: |
          # 機械の直しでも品質は落とさない。割っていれば週次を落とす
          python scripts/build.py

      # ここまでの直しを正本へ保存しておく。後ろの工程（claude・書き換え）が落ちたり
      # 時間切れになったりしても、ここまでの分は捨てられない。
      # 他サイトへの配信は、後段の直しも含めて最終コミットの後に1回だけ行う
      # （ここで配信すると、後段の直しが corporate/subsidy に届かなかった）
      - name: 途中までの直しを正本へ保存
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "weekly: 内部リンクと導線の補充"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push || echo "::warning::正本への push に失敗（最後のコミット工程で再度 push します）"

      # 並行の KW 補充が残したお客様の社の AI の語を受け取る（自社の分は上の pull で受け取る。後ろの共起語・勝ち型が読む）
      - uses: ./.github/actions/client-private
        with: {mode: restore, family: ai-kw, kinds: ai_kw}

      - name: 週次最適化の実行
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 利用枠切れ・最大ターン到達で落ちても、後ろの実測・コミット・配信は続ける
          claude -p "$(cat automation/weekly_optimize_prompt.txt)" \
            --dangerously-skip-permissions --max-turns 120 || echo "::warning::週次の claude 工程が失敗（後続は続行）"

      # 速度・インデックス・表記ゆれ・AI引用の週次実測。見つけたものは要対応として通知に載る。
      # Actions の残枠が 75% を超えていたら、後段の重い工程（動画・書き換え）の本数を半分にする
      - name: 実測（速度・インデックス・表記ゆれ・AI引用）と残枠
        id: measure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ai_cite_check は鍵のあるAIだけに聞く。ここに無いと週次では Gemini しか測れない（2026-10-03）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CLAUDE_CITE_API_KEY: ${{ secrets.CLAUDE_CITE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}   # 無ければ YOUTUBE_API_KEY で CrUX を聞く
          GBP_CLIENT_JSON: ${{ secrets.GBP_CLIENT_JSON }}
          GBP_TOKENS_JSON: ${{ secrets.GBP_TOKENS_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          mkdir -p automation/logs
          # GSC を使う実測（型・共起語・リッチ・並び替え・国別・季節）はサービスアカウントの鍵が要る
          # （鍵はジョブの最初に置いてある）
          # Googleビジネスプロフィールの鍵（クライアントごと）。無ければ gbp / review_reply は何もしない
          [ -n "$GBP_CLIENT_JSON" ] && printf '%s' "$GBP_CLIENT_JSON" > gbp-client.json
          if [ -n "$GBP_TOKENS_JSON" ]; then
            python -c "import json,os;[open(f'gbp-token-{k}.json','w').write(json.dumps(v) if not isinstance(v,str) else v) for k,v in json.loads(os.environ['GBP_TOKENS_JSON']).items()]" || true
          fi
          python scripts/cwv_check.py 2>&1 | tee -a /tmp/measure.txt | tail -8 || true
          python scripts/brand_spelling.py --fix 2>&1 | tee -a /tmp/measure.txt | tail -4 || true
          # 未登録ページの検査は最後の「再通知」工程（reindex）が行う。ここで index_status を
          # 回すと同じURL検査を2回することになり、週次が上限に当たる原因になっていた
          python scripts/ai_cite_check.py --limit 5 2>&1 | tee -a /tmp/measure.txt | tail -4 || true
          # 公開28〜40日の新記事の狙う語を、同じAI・同じキャッシュで1回だけ確かめる（引用0は情報。全件失敗だけ要対応）
          python scripts/ai_followup.py --limit 8 2>&1 | tail -6 || true
          # 引用が取れた記事の型を、次の記事を書く指示へ渡す（引用実績が無ければ空のまま）
          python scripts/win_patterns.py 2>&1 | tail -4 || true
          # 著者の実在（sameAs・実績）を台帳から束ね、記事の Person と著者ページへ流す
          python scripts/author_profile.py --write 2>&1 | tail -3 || true
          # 上位表示のための実測: 台帳の並び替え（開かないと済まない語を先に）・タイトルの型・
          # 共起語の欠け・リッチリザルトの取りこぼし
          python scripts/kw_reorder.py --write 2>&1 | tail -6 || true
          python scripts/title_patterns.py 2>&1 | tail -3 || true
          python scripts/cooccur.py --limit 6 2>&1 | tail -6 || true
          python scripts/rich_check.py 2>&1 | tee -a /tmp/measure.txt | tail -6 || true
          # 訪日客向け: 国別の表示・季節の山（6〜10週後）に当たる語を前へ・地図（GBP）の整備・
          # 口コミの返信案（投稿は人が承認）・多言語メニュー。鍵や設定が無い社は何もしない
          python scripts/country_rank.py 2>&1 | tail -4 || true
          python scripts/season.py --write 2>&1 | tail -4 || true
          for s in $(ls sites/*.json | xargs -n1 basename | sed "s/\.json$//" | grep -v "^sample$"); do
            if [ -f "gbp-token-$s.json" ]; then
              python scripts/gbp.py --sync --site "$s" 2>&1 | tail -2 || true
              python scripts/review_reply.py --site "$s" --check 2>&1 | tee -a /tmp/measure.txt | tail -3 || true
            fi
          done
          python scripts/menu_page.py --build --all --push 2>&1 | tail -4 || true
          grep '^要対応' /tmp/measure.txt >> automation/logs/findings.txt || true
          # 測れなかった（*_OK=unknown）も知らせる。黙って飛ばすと、鍵やAPIの有効化が
          # 切れたまま「異常なし」に見える。理由の1行は各検査がログに出している
          grep -o '[A-Z_]*_OK=unknown' /tmp/measure.txt | sort -u | sed 's/=unknown$//' \
            | while read -r m; do echo "要対応: $m（測れませんでした）"; done >> automation/logs/findings.txt || true
          rm -f gbp-client.json gbp-token-*.json
          out=$(python scripts/actions_budget.py 2>&1) || true; echo "$out" | tail -2
          if echo "$out" | grep -q "ACTIONS_BUDGET=warn"; then echo "scale=half" >> "$GITHUB_OUTPUT"; else echo "scale=full" >> "$GITHUB_OUTPUT"; fi

      # 実利用者の表示速度（cwv_check の CrUX）。お客様の分は .gitignore なので、月次レポートへキャッシュで渡す
      - name: 実利用者の表示速度（お客様の分）を残す
        if: always() && hashFiles('data/cwv_crux/*.json', '!data/cwv_crux/ai-lab.json', '!data/cwv_crux/corporate.json', '!data/cwv_crux/subsidy.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/cwv_crux/*
            !data/cwv_crux/ai-lab.json
            !data/cwv_crux/corporate.json
            !data/cwv_crux/subsidy.json
          key: cwv-crux-${{ github.run_id }}

      # お客様の競合比較（gaps.json）は public に置かないため、月次が残したキャッシュから戻す。
      # 自社だけ: 自社3サイトの分はコミット済みなのでキャッシュの対象から外す
      - name: 競合比較の控えを戻す
        uses: actions/cache/restore@v4
        with:
          path: |
            data/compete/*
            !data/compete/ai-lab
            !data/compete/corporate
            !data/compete/subsidy
            !data/compete/_usage.json
          key: compete-${{ github.run_id }}
          restore-keys: compete-

      # 見出しに質問形が無い記事へ、2〜3本だけ質問形の見出しを入れる（本数・順番は変えない）
      - name: 見出しを質問形へ（週2本）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          n=2; [ "${{ steps.measure.outputs.scale }}" = "half" ] && n=1
          python scripts/auto_rewrite.py --write --kind question --limit $n --budget-min 12 2>&1 | tail -6 || true
          # 公開2〜5週目に15位以内へ入った細い語を題・H2・FAQへ（山から落ちる前に。6週以降も残る記事の目印）
          python scripts/auto_rewrite.py --write --kind early --limit $n --budget-min 12 2>&1 | tail -6 || true
          # AIに聞いた調査で答えが割れた問いを、記事の冒頭に調査の文のまま入れ、記事の出典だけで答える
          python scripts/auto_rewrite.py --write --kind aisplit --limit $n --budget-min 12 2>&1 | tail -6 || true
          # 流入語が説明文の先頭に無い記事の説明文だけを直す（本文が1文字でも変われば戻す）
          python scripts/auto_rewrite.py --write --kind desc --limit $n --budget-min 8 2>&1 | tail -6 || true
          # 同じ語で自社の2本が競り合うが主題は別（統合しない）組を、題の付け分けで直す。
          # 公開・改題から28日たっていない記事は順位が落ち着くまで待つ
          python scripts/auto_rewrite.py --write --kind split --limit $n --budget-min 10 2>&1 | tail -6 || true
          # 競合がAIの出典に出て自社が出ない語の差（compete --gaps が月初に出す）を埋める。週2本まで。
          # 一次データが無いと勝てない語は書き直さず、findings（compete --check）が要対応で知らせる
          python scripts/auto_rewrite.py --write --kind compete --limit $n --budget-min 15 2>&1 | tail -6 || true

      # 多言語の要約ページ（英語・中国語・韓国語）。**sites/<id>.json に languages を書いた社だけ**作る
      # （指示が無ければ何もしない）。AIが切り出す単位だけを訳し、数字が1つでも変われば捨てる
      - name: 多言語の要約を訳す（指示のある社だけ・週10記事）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --publish は配信先リポジトリへ push する。無いと訳しても届かない
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          n=10; [ "${{ steps.measure.outputs.scale }}" = "half" ] && n=5
          python scripts/i18n.py --all --write --publish --limit $n --budget-min 25 2>&1 | tail -8 || true

      # 効かなかった直しは戻す（28日・対照群比）。表示ゼロの記事は近い記事へ統合する。
      # 6か月更新の無い記事は時点表記と dateModified を更新する（数字は年月以外増やさない）
      - name: 効かなかった直しを戻す・表示ゼロを整理・鮮度を更新
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          # compete の本文の直しも28日・対照群比で判定し、効かなければ直す前の原稿へ戻す（後から別の直しが入った記事は要対応）
          mkdir -p automation/logs
          out=$(python scripts/rewrite_rollback.py --write 2>&1) || true
          echo "$out" | tail -8
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          python scripts/retire_stale.py --write --limit 2 --budget-min 15 2>&1 | tail -8 || true
          # 書き直しを2回しても一次性が80点に届かない記事を、同じ手法・業種の近い記事へ（表示・クリックが少ないものだけ）
          python scripts/retire_stale.py --quality --write --limit 1 --budget-min 15 2>&1 | tail -8 || true
          python scripts/auto_rewrite.py --write --kind fresh --limit 2 --budget-min 12 2>&1 | tail -6 || true
          # 一次情報の1文を関係する記事へ（週3本）／離脱が最大の区画の手前に導線（固定ページ）
          python scripts/fact_cite.py --write --limit 3 2>&1 | tail -5 || true
          python scripts/exit_fix.py --write 2>&1 | tail -5 || true

      # 記事動画は daily-video.yml が毎日1本ずつ上げる（週にまとめて上げると量産に見えるため移した）

      # 記事サムネイルの写真の棚に足りない写真を足すのは photo-shelf.yml（月曜 11:17）。ここでは行わない

      - name: 最終ビルドとコミット
        run: |
          python scripts/build.py
          git add -A
          # 介入の台帳。effect_ab・rewrite_rollback が前後を比べる元なので、CI で毎回空に
          # ならないよう追跡する（automation/logs/ は .gitignore 対象のため -f で足す）
          [ -f automation/logs/auto_fix.jsonl ] && git add -f automation/logs/auto_fix.jsonl
          if git diff --cached --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            git commit -m "weekly-optimize: auto $(date '+%Y-%m-%d')" || true
            # 並行ジョブ（kw-refill・index-inspect）も正本へ push するため、pull と push の間に
            # 割り込まれても落ちないよう再試行する（触るファイルは重ならない）
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true     # 途中の rebase を残すと、次の再試行も必ず失敗する
              sleep 5
            done
            [ "$pushed" = 1 ] || { echo "::error::週次の直しを push できませんでした"; exit 1; }
          fi

      # 直した記事は他サイトへ配信しないと本番に反映されない。週次の最初に記録した
      # 基点からの差分をまとめて送るので、claude 週次・表記ゆれ・質問形/説明文/鮮度の
      # 書き換え・統合・一次情報・戻し・動画埋め込み・著者 Person まで1回で届く
      - name: 直した記事を他サイトへ配信
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          # 落ちた記事は --since のため次の回も送られない。要対応の行を通知本文へ足す（2026-10-07 の点検）
          python scripts/publish_changed.py --all --since "$BASE_SHA" --push 2>&1 | tee /tmp/publish_changed.txt || true
          grep '^要対応' /tmp/publish_changed.txt >> automation/logs/findings.txt || true
          # 統合で消した記事は配信先にも残っている。外して 301 で送らないと2本が出続ける
          python scripts/retract.py --pending --push || true
          # 取り下げ済みの印（data/retractions.jsonl）を正本に残す。残さないと翌週また取り下げ直す
          git add -A
          git diff --cached --quiet || {
            git commit -q -m "weekly: 配信・取り下げの記録 $(date '+%Y-%m-%d')"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push -q || echo "::warning::配信の記録を正本へ push できませんでした"
          }

      # 原稿が変わらない限り、雛形・CTA・会社の表記を変えても既存の記事は古い描き方のまま残る。
      # 描き方の材料の指紋が変わった社だけ全部描き直す（初めて見る社は記録だけ）。
      # 先方のサイトに日本語の Web フォント・先に読む計測タグが戻っていれば外す（CLAUDE.md 8.4。WordPress は FTP の鍵がある社のテーマだけ）
      - name: 雛形・設定が変わった社の描き直しと表示速度の直し
        timeout-minutes: 60
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          out=$( { python scripts/rerender_watch.py --push || true; python scripts/speed_fix.py --auto --apply || true; } 2>&1 )
          echo "$out" | tail -40
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          # 描き直した社の指紋（data/rerender_state.json）を正本に残す。残さないと翌週また描き直す
          git add data/rerender_state.json 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -q -m "weekly: 描き直しの指紋 $(date '+%Y-%m-%d')"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push -q || echo "::warning::描き直しの指紋を正本へ push できませんでした"
          }

      - name: Cloudflare Pagesへデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 公開前の門: sitemapの404/noindex・git の衝突マーカーがあれば公開しない（seo_audit --gate）
          python3 scripts/seo_audit.py --gate || { echo "::error::サイト監査の門で止めました（上の ::error:: を直す）"; exit 1; }
          for i in 1 2 3; do
            npx --yes wrangler@4.121.0 pages deploy site --project-name=ss-aio-lp --branch=master --commit-dirty=true && exit 0
            echo "Cloudflare APIが応答せず（$i/3）。40秒後に再試行"
            sleep 40
          done
          echo "::error::3回ともデプロイ失敗。次回のデプロイで反映される"
          exit 1

      - name: 生成エンジン向けの点数
        run: python scripts/aio_score.py || true

      # 検査は全部 `|| true` で呼んでいるため、何を見つけても終了コードは
      # 捨てられ、実行ログの奥に埋もれて誰にも届いていなかった。
      # ここでまとめて回し、見つかったものを注釈とSlack本文に載せる。
      # 中身: AIO基盤（robots・llms.txt・構造化データ）/ 会社表記のゆれ /
      #       内部リンクの積み上がり / 数字の信頼性（二重計上・無効流入・指名検索）
      # 学びは貯めるだけだと読まれなくなる。多すぎ・古すぎを毎週知らせて減らす
      - name: 学びの棚卸し
        run: |
          out=$(python scripts/lessons.py --review); echo "$out"
          if echo "$out" | grep -q "LESSONS_OK=no"; then
            mkdir -p automation/logs
            echo "要対応: 判断が要る学びが多すぎます（機械検査に変えるか退役させてください）" >> automation/logs/findings.txt
          fi

      # 検査の検査: 既知の壊れ方を1つずつ入れ、門が止めるかを確かめる（入れた変更は必ず戻す）。
      # 門が黙って壊れていると、通っていない品質を「通った」と読み違える（2026-10-03 に pytest で起きた）
      - name: 門が止めるかの点検
        run: |
          mkdir -p automation/logs
          out=$(python scripts/gate_selftest.py 2>&1) || true
          echo "$out" | tail -10
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true

      # findings.py はラッコの消費（rakko.py --check）も見る。KWの補充は並行ジョブ（kw-refill）が
      # 済ませて控えを残しているので、ここで最新の控えを戻す（前方一致で一番新しいものが戻る）
      - name: ラッコの控えを戻す
        uses: actions/cache/restore@v4
        with:
          path: |
            data/rakko_cache
            data/rakko_volume.json
            data/rakko_spend.jsonl
          key: rakko-${{ github.run_id }}-weekly
          restore-keys: rakko-

      # 並行ジョブ（kw-refill）が見つけた要対応（ラッコのクレジット切れ）を通知本文へ足す
      - name: KW補充の要対応を受け取る
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kw-findings
          path: /tmp/kw-findings

      # 並行ジョブ（reports）が見つけた要対応（問い合わせの疎通・AI診断・生成エンジン向け）も同じく足す
      - name: 読むだけの検査の要対応を受け取る
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: reports-findings
          path: /tmp/reports-findings

      - name: KW補充の要対応を通知本文へ足す
        run: |
          mkdir -p automation/logs
          if [ -f /tmp/kw-findings/findings.txt ]; then
            cat /tmp/kw-findings/findings.txt >> automation/logs/findings.txt
          fi
          if [ -f /tmp/reports-findings/findings.txt ]; then
            cat /tmp/reports-findings/findings.txt >> automation/logs/findings.txt
          fi

      # Bing Webmaster へ sitemap と直近7日の更新URLを送る（3サイト＋お客様）。
      # findings.py より前に置くのは、未登録・鍵の誤りの「要対応」を通知本文へ持ち越させるため
      - name: Bing への送信記録を戻す
        uses: actions/cache/restore@v4
        with:
          path: data/bing_submit.json
          key: bing-submit-${{ github.run_id }}
          restore-keys: bing-submit-

      # Bing の検索の成績（bing_webmaster.py --stats）。お客様の分は public に置かない（.gitignore）ので、キャッシュで週をまたぐ
      - name: Bing の検索の成績（お客様の分）を戻す
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bing_stats/*
            !data/bing_stats/ai-lab.json
            !data/bing_stats/corporate.json
            !data/bing_stats/subsidy.json
          key: bing-stats-${{ github.run_id }}
          restore-keys: bing-stats-

      - name: Bing Webmaster へ sitemap と更新URLを送る
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          mkdir -p automation/logs
          out=$(python scripts/bing_webmaster.py --weekly 2>&1) || true
          echo "$out" | tail -15
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          # 検索の成績（日別の表示・クリック、週ごとの語・ページ）を積む。月次レポートが Google と並べる
          python scripts/bing_webmaster.py --stats 2>&1 | tail -6 || true

      - name: Bing の検索の成績（お客様の分）を残す
        if: always() && hashFiles('data/bing_stats/*.json', '!data/bing_stats/ai-lab.json', '!data/bing_stats/corporate.json', '!data/bing_stats/subsidy.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/bing_stats/*
            !data/bing_stats/ai-lab.json
            !data/bing_stats/corporate.json
            !data/bing_stats/subsidy.json
          key: bing-stats-${{ github.run_id }}-weekly

      - name: 見つかったものを集めて知らせる
        env:
          SOCIAL_TOKENS_JSON: ${{ secrets.SOCIAL_TOKENS_JSON }}   # SNS の鍵の期限を見る
          HUB_URL: ${{ secrets.HUB_URL }}                         # 管制塔の「KW重複の確認」を読む（無いと unset で素通りする）
          # 準備状況（intake_readiness）・WordPress の橋渡しは配信の鍵が登録されているかを見る。渡さないと、
          # 登録済みのお客様の社まで毎週「配信用トークンの登録（当社）」と誤って知らせる（2026-10-07 の点検）
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
        run: |
          python scripts/findings.py || true
          # 公開した後の結果（題の型のCTR・別工程の採点・本数の効き・戻された直し）から学び、
          # 書く工程が読む台帳へ書き戻す。学びごとに1行で、毎週最新の数字に書き換え、根拠が消えたら退役
          python scripts/learn.py --write 2>&1 | tail -8 || true
          # 量産と見られている兆候（Google の大量生成の不正使用の定義にもとづく）から、来週の1日の本数を決める
          python scripts/pace.py --write 2>&1 | tail -12 || true
          # content_yield の判定（統合を増やすサイト）と学びの台帳を残す。日次の執筆がこれを読む
          # Bing の検索の成績は自社3サイトの分だけ（お客様の分は .gitignore で外れる）
          # findings_seen は前の週に出たもの（来週の要対応と情報の振り分けが読む）。pull は未コミットの変更があっても通す
          for p in data/yield_state.json data/lessons.jsonl data/pace_state.json data/pace_manual.json data/bing_stats data/findings_seen.json; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --cached --quiet || {
            git commit -q -m "weekly: 記事本数の判定と結果からの学び $(date '+%Y-%m-%d')"
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
            git push -q || true
          }

      # 検査（findings）の後に作る。要対応の一覧を「次にやること」に載せるため。
      # 前はここより前にあり、検査結果が出る前にレポートが確定していた
      - name: 週次レポートの作成
        run: python scripts/weekly_report.py || true

      - name: 更新URLをIndexNow通知
        run: python scripts/notify_indexnow.py || true

      - name: Google Indexing API即時登録（本日更新分）
        run: |
          if [ -f indexing-service-account.json ]; then
            python scripts/notify_indexing.py || true
          else
            echo "GCP_SERVICE_ACCOUNT_JSON 未設定 — スキップ"
          fi

      # 当日更新分を通知するだけでは、過去に登録されなかったページが
      # 放置され続ける。実測で、公開30日以上たっても28日間まったく表示されない
      # ページが19件あった（コーポレートは sitemap の40%が表示ゼロ）。
      # 登録状況を1URLずつ確認し、落ちているものだけを再通知する。
      # 1URLずつの検査（15分）は並行ジョブ index-inspect が先に済ませている。ここでは
      # その結果から通知だけを行い、本日更新分の通知（上）より後という順番は変えない。
      # 結果が受け取れなかったときだけ、従来どおりここで検査から行う（15分の上限つき）
      - name: 並行で済ませた検査の結果を受け取る
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: index-cache
          path: /tmp/index-cache

      # お客様の社のURLの検査結果（成果物には入れていない）をキャッシュから受け取る
      - uses: ./.github/actions/client-private
        with: {mode: restore, family: index, kinds: "-"}

      - name: 登録されていないページを拾って再通知
        timeout-minutes: 20
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}   # 再送のURLを Bing Webmaster にも送る
        run: |
          if [ -f indexing-service-account.json ]; then
            if [ -f /tmp/index-cache/index_cache.json ]; then
              cp /tmp/index-cache/index_cache.json data/index_cache.json
              python scripts/reindex.py --from-cache || true
            else
              echo "::warning::並行の検査結果を受け取れなかったため、ここで検査から行います"
              python scripts/reindex.py --budget-min 15 || true
            fi
            # 登録済みと確かめたURLの記録を残す（次の週はそこを検査しない。
            # 並行ジョブが同じ内容を push 済みなら、rebase で同じ変更として落ちる）
            # 送った日（index_resend.json）も残す。残さないと14日の間隔が効かず、毎週同じURLを送る
            for p in data/index_cache.json data/index_resend.json; do if [ -e "$p" ]; then git add "$p"; fi; done
            git diff --cached --quiet || {
              git commit -q -m "weekly: インデックス検査の記録 $(date '+%Y-%m-%d')"
              git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
              git push -q || true
            }
          else
            echo "GCP_SERVICE_ACCOUNT_JSON 未設定 — スキップ"
          fi

      # お客様の社の分（勝ち型・並び替え・国別・季節・順位を上げた記録・共起語・引用の実測・URL検査）を次の回へ残す
      - uses: ./.github/actions/client-private
        if: always()
        with: {mode: save}

      - name: Bing への送信記録を残す
        if: always() && hashFiles('data/bing_submit.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/bing_submit.json
          key: bing-submit-${{ github.run_id }}-weekly

      - name: 運用通知（Slack→メール自動フォールバック）
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="🔧"; else icon="🚨"; fi
          # 検査が見つけたものを本文に載せる。リンクだけの通知は開かれない
          found="（検査の結果を取得できませんでした）"
          if [ -f automation/logs/findings.txt ]; then
            found=$(cat automation/logs/findings.txt)
          fi
          python scripts/notify_slack.py --routine "$icon 週次最適化: ${{ job.status }}
          $found
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      # 鍵の後始末。途中の工程が落ちても必ず消す
      - name: 鍵の後始末
        if: always()
        run: rm -f indexing-service-account.json gbp-client.json gbp-token-*.json youtube-client.json youtube-token.json
