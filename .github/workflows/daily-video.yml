# 記事動画を毎日1本だけ YouTube へ上げる（3サイトを順番に）
#
# AI検索での可視性と最も強く相関するのは YouTube での言及（0.71・被リンクの3倍）。
# ただし同じ型の動画を1日に何本も上げると、YouTube が量産コンテンツとして扱い、
# チャンネルごと表示を抑えられる。本数ではなく毎日続くことを取る。
# リライトで読み上げ部分の数字が変わった記事は、古い動画を限定公開に下げて作り直す（同じ1本の枠）。
name: 記事動画（毎日1本）

on:
  schedule:
    - cron: "30 1 * * *"   # JST 10:30（記事の枠と時刻をずらす）
  workflow_dispatch:

permissions:
  contents: write
  actions: write           # 動画を記事に埋めたあと、デプロイを起動する（GITHUB_TOKEN の push では動かない）

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 100  # 掛け合い動画（台本づくり・24fpsの描画）と読みの聞き直しの分
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 読みの聞き直しに使う音声認識のモデル（約1.5GB）を毎回落とさない
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      - name: 準備
        run: |
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null 2>&1 || true
          command -v ffmpeg > /dev/null || echo "::warning::ffmpeg が入らず、記事動画を作れません"
          pip install --quiet -r requirements.txt edge-tts
          # 作った声を聞き直して読み違いを直す（入らなくても動画づくりは止めない）
          pip install --quiet -r requirements-video.txt || echo "::warning::読みの聞き直しが入らず、読み違いを検査できません"
          python scripts/yomi_guard.py --selftest || echo "::warning::読みの検査が壊れています（読み違いを見逃します）"
          # 掛け合いの台本を書かせる（動かなければスライド形式に落ちる）
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1 || true
          if ! claude --version >/dev/null 2>&1; then
            node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs" > /dev/null 2>&1 || true
          fi
          claude --version || echo "::warning::claude が入らず、掛け合いの台本を作れません（スライド形式で出します）"
          python scripts/duo_video.py --selftest || echo "::warning::掛け合い台本の検査が壊れています"
          python scripts/duo_short.py --selftest || echo "::warning::ショート台本の検査が壊れています"
      # 記事のページ・sitemap・feed を Git から外す準備（2026-10-03）。このあとの工程が手元のページを読むので、
      # 先に原稿から作っておく。作れなくても止めない（外す前は、コミット済みのページが残っている）
      - name: 原稿からページを作る
        run: |
          python scripts/build.py > /tmp/prebuild.log 2>&1 && tail -2 /tmp/prebuild.log || {
            tail -20 /tmp/prebuild.log
            echo "::warning::原稿からページを作れませんでした（このあとの工程は古いページを読みます）"
            mkdir -p automation/logs
            echo "要対応: 原稿からページを作れませんでした（$GITHUB_WORKFLOW）" >> automation/logs/findings.txt
          }

      - name: 動画を作って上げる
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          # クライアントのチャンネルの鍵 {"<site_id>": {...}, ...}。無い社の記事は動画を作らない
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$YOUTUBE_CLIENT_JSON" ] && printf '%s' "$YOUTUBE_CLIENT_JSON" > youtube-client.json
          [ -n "$YOUTUBE_TOKEN_JSON" ]  && printf '%s' "$YOUTUBE_TOKEN_JSON"  > youtube-token.json
          [ -n "$YOUTUBE_TOKENS_JSON" ] && python -c 'import json,os;[open(f"youtube-token-{k}.json","w",encoding="utf-8").write(json.dumps(v)) for k,v in json.loads(os.environ["YOUTUBE_TOKENS_JSON"]).items()]'
          python scripts/article_videos.py --write --limit 1 --days 7 --shorts 1 --research 1 2>&1 | tail -10 || true
          rm -f youtube-client.json youtube-token.json youtube-token-*.json
      # TikTok は審査前だと自動投稿が非公開になるため、縦型の mp4 を成果物に残して手で上げる（30日保存）
      - name: 縦型ショートを成果物に残す（TikTok 用）
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: automation/video/*.short.mp4
          if-no-files-found: ignore
          retention-days: 30
      - name: 記事に埋めてコミット
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build.py > /dev/null 2>&1 || echo "::warning::ビルドに失敗（動画の埋め込みは次のビルドで入ります）"
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          for p in data/videos.json data/research_promo.json data/youtube_playlists.json site data/published.json data/body_hash.json data/yomi_dict.json data/yomi_issues.jsonl data/duo_scripts data/duo_shorts; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -q -m "記事動画: $(date '+%Y-%m-%d')"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::動画の台帳を push できませんでした"; exit 1; }
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" || echo "::warning::デプロイを起動できませんでした（次の push で反映されます）"
