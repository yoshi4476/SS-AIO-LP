name: 自動修復

# パイプラインが落ちたら、その原因を自動で直す。
# 人が朝まで気づかないと1日分の記事が失われるため、落ちた直後に動かす。
on:
  workflow_run:
    # 名前は各ワークフローの name: と1文字も違ってはいけない。
    # 違うと待ち受けが成立せず、落ちても何も起きない
    # 月次レポート・週報・デプロイも見張る。以前はここに無く、月次レポートが
    # 落ちても誰にも知らされず、翌月まで気づかなかった
    # 下の6本は直して書き直す（heal）。残りは一時的な失敗なら1回だけ再実行する（rerun）。
    # どちらの一覧に入れるかは各ジョブの if: の fromJSON に書く（scripts/ci_rerun.py も同じ所を読む）
    workflows: ["Multi-Site Article Pipeline", "Article Pipeline (Rescue)", "Weekly Optimize",
                "Monthly Consulting Report", "Weekly Newsletter Digest", "Deploy to Cloudflare Pages",
                "記事動画（毎日1本）", "業種調査", "業種調査の聞き足し", "Research Refresh", "Photo Shelf", "監修の記録", "Focus Mode",
                "Daily KPI", "AIの作業場の確かめ"]
    types: [completed]
  schedule:
    - cron: "0 15 * * *"   # JST 00:00 — 1日の最後に検査だけはかける（取りこぼしの見張りの最後の砦も兼ねる）
    # 下の3本は取りこぼしの見張り（schedule-guard）だけを動かす。heal は 0 15 の回だけ
    - cron: "53 7 * * 1"   # JST 月 16:53 — Weekly Optimize（月 10:23）から6.5時間
    - cron: "53 6 1,15 * *"  # JST 1日・15日 15:53 — 月次レポート（9:00）から7時間
    - cron: "23 20 * * 1,4"  # JST 火・金 05:23 — 集中モード（04:13）から1時間（記事の枠 08:07 までに終わる時間）
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # 定時のワークフローが始まらなかった回を起動する。GitHub の schedule は遅れ・取りこぼしがあり
  # （2026-10-05 の Weekly Optimize は3時間過ぎても始まらず手で起動・前の週も5.5時間遅れ）、
  # 落ちた run は heal が拾うが、始まらなかった run は誰も拾わなかった。
  # 起動された側は最初のジョブで「その区切りに済んだ run があるか」を見るので、遅れて来た予定の run と重ならない。
  # 月次は日付で中身が変わる（1日=確定版・15日=途中経過）ので、その日のうちしか起動しない（--max-hours 14）。
  # 集中モードは記事の枠（08:07〜）と同じグループに並ぶので、枠の前に終わる時間しか起動しない（--max-hours 2）
  schedule-guard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 始まらなかった定時の回を起動する
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          out=""
          W="weekly-optimize.yml --after-hours 6 --max-hours 48 --period week --avoid-busy"
          M="monthly-report.yml --after-hours 6 --max-hours 14 --period day"
          F="focus-mode.yml --after-hours 1 --max-hours 2 --period day --avoid-busy"
          for a in "$W" "$M" "$F"; do
            o=$(python3 scripts/schedule_guard.py --missed $a --dispatch 2>&1) || o="$o
          要対応: 取りこぼしの見張りが動きませんでした（${a%% *}）"
            out="$out
          $o"
          done
          echo "$out"
          if echo "$out" | grep -q '^要対応'; then
            python3 scripts/notify_slack.py "🚨 $(echo "$out" | grep '^要対応' | head -3)" || true
          fi

  heal:
    # 直列にするのは heal だけ。ワークフロー全体にかけると、heal の45分の間に待った再実行の判定が、
    # 後から来た待ちに取り消される（同じグループの待ちは1つしか残らない）
    concurrency:
      group: selfheal
      cancel-in-progress: false
    # 定期実行のときは常に。ワークフロー起因のときは、失敗か取り消しのときだけ動かす。
    # 取り消し（cancelled）も拾う。同じ concurrency グループで待機中の run は後から来た run に
    # 取り消されるが、failure だけを見ていたため、その日の記事が消えても誰にも知らされなかった。
    # ただしデプロイは cancel-in-progress で新しい push が古い run を取り消すのが正常の動き。
    # これを拾うと push が続くたびに修復・書き直し・「cancelled で終わりました」の通知が走る
    # 記事動画・調査などは書き直しの手順（retry_prompt）が合わないので、ここでは扱わない（rerun が受け持つ）
    # 定期実行は 0 15 の回だけ（ほかの cron は取りこぼしの見張りのため。heal を1日に何度も動かさない）
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') ||
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["Multi-Site Article Pipeline", "Article Pipeline (Rescue)", "Weekly Optimize", "Monthly Consulting Report", "Weekly Newsletter Digest", "Deploy to Cloudflare Pages"]'), github.event.workflow_run.name) &&
       (github.event.workflow_run.conclusion == 'failure' ||
        (github.event.workflow_run.conclusion == 'cancelled' &&
         github.event.workflow_run.name != 'Deploy to Cloudflare Pages')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      broken: ${{ steps.diag.outputs.broken }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 非公開のデータ（お客様の情報・料金・レポート）を private/ に取得し、お客様の守秘の語をログで伏せる
      # （public のリポジトリでは CI のログも誰でも読める。2026-10-10 運用者の指示・門 gates_history_h76）
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt || true
          npm install -g @anthropic-ai/claude-code
          # 図解の検査（image_check）が日本語フォントを使う。無いと門が途中で止まる（2026-10-05 に自動修復が提案）
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null 2>&1 || true

      # 記事のページ・sitemap・feed を Git から外す準備（2026-10-03）。このあとの工程が手元のページを読むので、
      # 先に原稿から作っておく。作れなくても止めない（外す前は、コミット済みのページが残っている）
      - name: 原稿からページを作る
        run: |
          python scripts/build.py > /tmp/prebuild.log 2>&1 && tail -2 /tmp/prebuild.log || {
            tail -20 /tmp/prebuild.log
            echo "::warning::原稿からページを作れませんでした（このあとの工程は古いページを読みます）"
            mkdir -p automation/logs
            echo "要対応: 原稿からページを作れませんでした（$GITHUB_WORKFLOW）" >> automation/logs/findings.txt
          }

      - name: Git識別情報の設定
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"

      # Cloudflare は 2026-09-15 から AI のクローラーを既定でブロックする方針に変えた。
      # 塞がると記事の中身に関係なくAI検索から消えるため、毎日いちばん先に見る。
      # robots.txt を読んでも分からない（WAFはその手前で落とす）ので、実際のUAで叩く。
      - name: AIクローラーが本番に入れるか
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_TO_EMAIL: ${{ secrets.LEAD_TO_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/ai_crawler_check.py --alert || true

      # 証明書の期限・sitemap の 404・配信用トークンの生存も、毎日同じ枠で見る。
      # どれも「何も起きない」形で現れ、気づくのは最後の push が落ちたとき
      - name: 生存監視（証明書・404・トークン）
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
          SCHED_GH_TOKEN: ${{ github.token }}   # 定時の起動役の起動の記録を読む（sched_guard --watch だけが使う）
        run: |
          mkdir -p automation/logs
          out=$( (python scripts/cert_check.py; python scripts/token_check.py) 2>&1 ) || true
          echo "$out" | tail -12
          # 定時の起動役（Cloudflare Worker）からの起動の途絶え・起動しそびれ・鍵の期限
          w=$(python scripts/sched_guard.py --watch 2>&1) || true; echo "$w"; out="$out"$'\n'"$w"
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          if echo "$out" | grep -q '^要対応'; then
            python scripts/notify_slack.py "🚨 生存監視で要対応があります
          $(echo "$out" | grep '^要対応' | head -5)" || true
          fi

      # Bing への送り切り。鍵が無かった 2026-10-05 より前の記事は Bing にほぼ送られておらず、
      # ChatGPT の検索は Bing の索引を使う。本番 sitemap の未送信URLを毎日枠いっぱい送る（各サイト10件は
      # その日の新しい記事のために残す）。送り切りの記録は二度送らないためコミットする（キャッシュは消えうる）
      - name: Bing への送信記録を戻す
        if: github.event_name != 'workflow_run'
        uses: actions/cache/restore@v4
        with:
          path: data/bing_submit.json
          key: bing-submit-${{ github.run_id }}
          restore-keys: bing-submit-

      - name: Bing へ未送信のURLを送り切る
        if: github.event_name != 'workflow_run'
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          mkdir -p automation/logs
          out=$(python scripts/bing_webmaster.py --backfill 2>&1) || true
          echo "$out" | tail -10
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          if [ -n "$(git status --porcelain -- data/bing_backfill.json)" ]; then
            git add data/bing_backfill.json
            git commit -q -m "Bing へ未送信のURLを送った記録 $(date '+%Y-%m-%d')"
            git push -q || { git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q; } || true
          fi

      - name: Bing への送信記録を残す
        if: always() && github.event_name != 'workflow_run' && hashFiles('data/bing_submit.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/bing_submit.json
          key: bing-submit-${{ github.run_id }}-backfill

      # 結果の見張り: 「動いたか」ではなく「出来たか」。2026-09-28〜10-03 は記事の枠が毎回「成功」なのに
      # 3サイトとも1本も書かれず、誰も気づかなかった。前日の記事の本数・公開・動画・ニュースレター・問い合わせを数える
      - name: 結果の見張り（記事・公開・動画・ニュースレター・問い合わせ）
        if: github.event_name != 'workflow_run'
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          mkdir -p automation/logs
          [ -n "$SA_JSON" ] && printf '%s' "$SA_JSON" > indexing-service-account.json
          # 見張り自体が途中で落ちたら、それも知らせる（何も出ないと「問題なし」に見える。Codex の点検で指摘）
          out=$(python scripts/outcome_watch.py 2>&1) || out="$out
          要対応: 結果の見張りが途中で止まりました（$(echo "$out" | tail -1 | cut -c1-120)）"
          echo "$out" | grep -q 'WATCH_OK=' || out="$out
          要対応: 結果の見張りが最後まで動いていません"
          echo "$out" | tail -20
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          if echo "$out" | grep -q '^要対応'; then
            python scripts/notify_slack.py "🚨 結果の見張りで要対応があります（実行は成功でも、出来ていないもの）
          $(echo "$out" | grep '^要対応' | head -8)" || true
          fi
          rm -f indexing-service-account.json

      # 何が壊れているかを先に確定させる。ここで問題が無ければ何もしない。
      - name: いま壊れているものの確認
        id: diag
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          bad=0
          # 記事のページは Git に置かない（公開の前に作る）。検査は作った後に走らせる
          python scripts/build.py    || bad=1
          python tests/test_gates.py || bad=1
          echo "broken=$bad" >> "$GITHUB_OUTPUT"
          if [ "$bad" = "0" ]; then
            echo "検査はすべて通っています。修復は不要です"
          fi

      # 不具合を直す AI は、このジョブでは動かさない（下の repair・repair-branch。2026-10-11 の点検）。
      # このジョブは鍵を持つため、AI の書いたコード（python で何でも動かせる）が裏に残って鍵を戻した後に読む・
      # sudo でジョブのメモリから全部の鍵を読む・鍵を戻した後の検証で動く・本体へ push されて以後の全工程が鍵つきで動かす、の道があった

      # 記事が落ちた日は、書き直す。1日分を失わない。
      # コードが壊れていない回（claude の一時失敗・取り消し）がいちばん多い落ち方なので、壊れていない回だけ動かす
      # （壊れていた回は修復の案を人が取り込んでから。次の記事の枠・救済が書く）
      - name: 書き直しの前にAIの作業場から鍵を外す
        id: rewrite
        if: >-
          github.event_name == 'workflow_run' &&
          steps.diag.outputs.broken == '0'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "go=yes" >> "$GITHUB_OUTPUT"
          python scripts/agent_guard.py --lock
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" | env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
              nohup python scripts/agent_guard.py --refresh > "$RUNNER_TEMP/agent_guard_refresh.log" 2>&1 &
          fi

      - name: 修復後に記事を書き直す（AI）
        if: steps.rewrite.outputs.go == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}
          # AI 用の合言葉。狙う語の台帳とエラーの記録だけが通る（問い合わせ・管理には使えない）
          HUB_SECRET: ${{ secrets.HUB_AGENT_SECRET }}
        run: |
          python scripts/agent_guard.py --verify || exit 1
          claude -p "$(cat automation/retry_prompt.txt)" \
            --permission-mode dontAsk --allowedTools "Glob,Grep" --settings automation/agent_settings_article.json --max-turns 160 || true

      - name: 書き直しのAIが触ってはいけない場所を戻す
        if: always() && steps.rewrite.outputs.go == 'yes'
        run: python scripts/agent_guard.py --protect

      - name: 書き直しの後にAIの作業場へ鍵を戻す
        if: always() && steps.rewrite.outputs.go == 'yes'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python scripts/agent_guard.py --unlock

      - name: 修復後に記事を書き直す（配信とコミット）
        if: steps.rewrite.outputs.go == 'yes'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          # 配信・管制塔への記録は鍵を持つこの手順で行う（AI は publish_flow --check まで）
          python scripts/agent_guard.py --publish || true
          rm -f indexing-service-account.json
          python scripts/build.py || true
          # ワークフローの変更は CI の鍵（GITHUB_TOKEN）では push できず、修復の全体が拒否されて捨てられた
          # （2026-10-05・50ファイル）。ワークフローの分だけ外して残りを反映し、変更案は成果物と要対応で知らせる
          if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
            git diff -- .github/workflows > /tmp/workflow-change.patch || true
            git checkout -- .github/workflows 2>/dev/null || true
            git clean -fdq -- .github/workflows || true
            echo "::warning::自動修復がワークフローの変更を提案しました（CI の鍵では反映できないため外しました。成果物 workflow-change を確認）"
            mkdir -p automation/logs
            echo "要対応: 自動修復がワークフローの変更を提案しました（反映は手で。run の成果物 workflow-change）" >> automation/logs/findings.txt
          fi
          git add -A
          git diff --cached --quiet || {
            git commit -m "selfheal: 落ちた回の記事を書き直し $(date '+%Y-%m-%d')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          }

      # 月次レポートが落ちた回は、直したあとで発行し直す。翌月まで届かないのを防ぐ。
      # 照合（report_audit）が通らなければ送らないのは通常発行と同じ
      - name: 落ちたのが月次レポートなら発行し直す
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Monthly Consulting Report' &&
          steps.diag.outputs.broken == '0'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GA4_ID: ${{ secrets.GA4_PROPERTY_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ] || [ -z "$GA4_ID" ]; then echo "実データ未設定のため発行しない"; exit 0; fi
          # 落ちた run でも、各社のまとめは always() で送り終えていることがある（グループ版だけ落ちた回など）。
          # そのまま各社分を作り直して送ると、同じまとめが2通届く。送り終えていたら各社分は飛ばす
          sent=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[].steps[]? | select((.name == "各社のレポートを1通にまとめて送る" or .name == "月次レポート生成・メール送付（サイト単体の詳細版）") and .conclusion == "success")] | length' \
            2>/dev/null || echo 0)
          # まとめの工程は always() で、各社分が作られていなくても success になる。両方の成功を見る
          [ "${sent:-0}" -ge 2 ] && sent=1 || sent=0
          pip install --quiet playwright google-analytics-data google-api-python-client google-auth pymupdf
          python -m playwright install --with-deps chromium
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          { echo "GA4_PROPERTY_ID=$GA4_ID"; echo "GSC_SITE_URL=https://ai.7senses.co.jp/"
            echo "SPREADSHEET_ID=$SPREADSHEET_ID"
            echo "RESEND_API_KEY=$RESEND_API_KEY"; echo "LEAD_FROM_EMAIL=$LEAD_FROM_EMAIL"
            echo "LEAD_TO_EMAIL=info.ai@7senses.co.jp"; } > .env
          # 落ちたのが15日の回（当月の途中経過版）なら、同じく途中経過として出し直す。
          # 付けないと先月の確定版を二重に送り、当月の途中経過は届かない
          through=""
          if [ -n "$RUN_STARTED" ] && [ "$(TZ=Asia/Tokyo date -d "$RUN_STARTED" +%d)" = "15" ]; then
            through="--through $(TZ=Asia/Tokyo date -d "$RUN_STARTED" +%F)"
          fi
          # 社ごとに送らず列に積み、最後に1通にまとめる（通常の発行と同じ形）
          mkdir -p automation/logs
          if [ "${sent:-0}" -gt 0 ] 2>/dev/null; then
            echo "各社のまとめは元の run で送り終えています。各社分の再発行は飛ばします"
          else
            for s in $(ls sites/*.json | xargs -n1 basename | sed "s/\.json$//" | grep -v "^sample$" | sort); do
              python scripts/monthly_report.py --site "$s" --queue $through || echo "  $s は生成できませんでした"
            done
            python scripts/report_digest.py --email || true
          fi
          # グループ版も同じ。元の run で送り終えていれば出し直さない（10-01 に再送でグループ版を二重に送った）。
          # 照合で止めた回も success になるが、その回は「要対応」で人に届いている
          gsent=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[].steps[]? | select(.name == "グループ月次レポート生成・メール送付" and .conclusion == "success")] | length' \
            2>/dev/null || echo 0)
          if [ "${gsent:-0}" -gt 0 ] 2>/dev/null; then
            echo "グループ版は元の run で送り終えています。再発行は飛ばします"
          else
            python scripts/group_report.py --email $through || true
          fi
          rm -f indexing-service-account.json .env

      - name: ワークフローの変更案を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-change
          path: /tmp/workflow-change.patch
          if-no-files-found: ignore
          retention-days: 14

      - name: 結果の通知
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          # 異常が無かった回は黙る。直した回は「何が起きたか」を知らせる。
          # ただし元の実行が落ちた・取り消された回は、コードが無事でも黙らない（書き直し・再発行をした）
          routine=""
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ steps.diag.outputs.broken }}" = "0" ]; then
            msg="🔧 自動修復: ${{ github.event.workflow_run.name }} が ${{ github.event.workflow_run.conclusion }} で終わりました。コードに異常は無いため、書き直し／再発行を実行しました（結果は実行ログ）"
          elif [ "${{ steps.diag.outputs.broken }}" = "0" ]; then
            msg="✅ 自動修復: 異常なし"
            routine="--routine"
          elif [ "${{ steps.diag.outputs.broken }}" = "1" ]; then
            # 不具合のある回は、修復の案を作る工程（repair-branch）が結果をまとめて知らせる（二重に送らない）
            echo "不具合あり。知らせは修復の案の工程が送ります"
            exit 0
          else
            msg="🚨 自動修復: いま壊れているものの確認が最後まで動きませんでした。手当てが必要です"
          fi
          # ワークフローの変更案は CI では反映できない。黙らずに知らせる
          if [ -s /tmp/workflow-change.patch ]; then
            routine=""
            msg="$msg
          ⚠️ ワークフローの変更案があります（CI の鍵では反映できないため外しました。成果物 workflow-change を確認して手で反映）"
          fi
          python scripts/notify_slack.py $routine "$msg
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

  # 一時的な失敗（ネットワーク・429・タイムアウト）なら、落ちた run を1回だけ再実行する。
  # 中身の誤り（門・404になる・鍵・例外）と理由の読めない失敗は再実行せず知らせる（heal の見張り分は heal が知らせる）。
  # 同じ run は1回まで: ci_rerun.py が run_attempt 2 以上を再実行しない。デプロイは後の run があれば再実行しない
  # （古い中身で新しい公開を上書きする）。記事・週次・月次・ニュースレターは再実行すると二重に書く・送るので入れない。
  # 集中モード（Focus Mode）は再実行の回（run_attempt 2以上）で書き直しを飛ばすので、二重には直さない
  # 日次KPI（Daily KPI）は送った日を記録してから残すので、再実行しても同じ日を二重に送らない

      # この回に書いた・直したお客様の社の記事・画像・台本・記録を非公開のリポジトリへ残す（公開側の git には入れない。
      # 公開側に commit が無い回も残す。門 gates_history_h77）
      - uses: ./.github/actions/private-data
        if: always()
        with: {mode: save}

  # 不具合を直す AI は、鍵を1つも持たない別のランナーの、さらにコンテナの中だけで動かす（2026-10-11 の点検）。
  # 同じジョブで鍵と並べると、AI の書いたコード（python で何でも動かせる）が裏に残って鍵を戻した後に読む・sudo で
  # ジョブのメモリから鍵を読む・鍵を戻した後の検証で動く、の道があった。別のランナーでも、ランナーの上で動かすと
  # 後の手順（キャッシュの保存など）の権限を横取りできるので、AI と検証はコンテナ（ランナーのプロセス・ファイル・
  # docker に届かない）で動かし、ランナーへは作業場の写し（データ）だけを戻す。渡す鍵は claude の利用の鍵だけで、
  # 非公開のデータも取らない。直した内容は本体（master）へ入れず、差分をキャッシュで次のジョブへ渡す
  repair:
    needs: heal
    if: needs.heal.outputs.broken == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: AI の作業場（コンテナ）を作る
        run: |
          mkdir -p /tmp/img && cp requirements.txt /tmp/img/ && cp automation/ai_container.Dockerfile /tmp/img/Dockerfile
          docker build -q -t selfheal-ai /tmp/img
          # 作業場の写し。.git も写す（AI が履歴を読む）が、ランナー側の .git には届かない
          rm -rf /tmp/ws && cp -a . /tmp/ws

      - name: 不具合の自動修復（鍵の無いコンテナ）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 権限を全部外し、昇格もさせない。ランナーの /proc・docker・ファイルには届かない。終われば中の処理はすべて消える
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 1024 \
            -e CLAUDE_CODE_OAUTH_TOKEN -e HOME=/tmp/home -v /tmp/ws:/ws -w /ws selfheal-ai bash -c '
              mkdir -p "$HOME" && git config --global --add safe.directory /ws
              python scripts/build.py > /tmp/prebuild.log 2>&1 || true
              # コードは直せるが、外へ送るコマンドと鍵の外し方そのもの（agent_guard・許可の一覧）には触れない
              claude -p "$(cat automation/selfheal_prompt.txt)" \
                --permission-mode dontAsk --allowedTools "Glob,Grep" --settings automation/agent_settings_maint.json --max-turns 120 || true' || true

      - name: 直った状態の検証と差分
        id: verify
        if: always()
        run: |
          # 検証は AI が書き換えたコードを動かすので、これもコンテナの中（鍵は渡さない。結果は参考）
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 1024 \
            -e HOME=/tmp/home -v /tmp/ws:/ws -w /ws selfheal-ai bash -c '
              ok=1; python scripts/build.py || ok=0; python tests/test_gates.py || ok=0
              echo "SELFHEAL_VERIFY=$ok"' | tee /tmp/verify.log || true
          ok=$(grep -o 'SELFHEAL_VERIFY=[01]' /tmp/verify.log | tail -1 | cut -d= -f2)
          echo "ok=${ok:-0}" >> "$GITHUB_OUTPUT"
          # 写しの中身（データ）だけをランナーの作業場へ戻して差分を取る。ランナー側の .git（設定・hooks）は使わせない
          rsync -a --delete --exclude .git --exclude selfheal-out /tmp/ws/ ./
          rm -rf selfheal-out && mkdir -p selfheal-out
          # ワークフローの変更は CI の鍵（GITHUB_TOKEN）では push できない。案は成果物で残す
          if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
            git diff -- .github/workflows > selfheal-out/workflow-change.patch || true
            git checkout -- .github/workflows 2>/dev/null || true
            git clean -fdq -- .github/workflows || true
          fi
          git add -A -- . ':!selfheal-out'
          git diff --cached --binary > selfheal-out/selfheal.patch || true
          echo "差分: $(git diff --cached --name-only | wc -l) ファイル（検証 ok=${ok:-0}）"

      - name: 修復の差分を次のジョブへ渡す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: selfheal-out
          key: selfheal-patch-${{ github.run_id }}

      - name: ワークフローの変更案を残す（修復）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-change-repair
          path: selfheal-out/workflow-change.patch
          if-no-files-found: ignore
          retention-days: 14

  # 修復の案を、本体とは別の枝（selfheal/fix-<run>）に置いて知らせる。人が確かめてから master へ取り込む。
  # ここでは案のコードを1行も動かさない（通知は案を当てる前の master の notify_slack.py で送る）。
  # 鍵の外し方・許可の一覧・ワークフローに触れた案は置かない
  repair-branch:
    needs: [heal, repair]
    if: always() && needs.heal.outputs.broken == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: selfheal-out
          key: selfheal-patch-${{ github.run_id }}

      - name: 修復の案を枝に置いて知らせる
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          repo="https://github.com/${{ github.repository }}"
          b="selfheal/fix-${{ github.run_id }}"
          p=selfheal-out/selfheal.patch
          checked="$([ "${{ needs.repair.outputs.ok }}" = "1" ] && echo 通った || echo 通らない)"
          if [ ! -s "$p" ]; then
            msg="🚨 自動修復: 不具合がありますが、修復の案を作れませんでした。手当てが必要です"
          else
            git switch -q -c "$b"
            if ! git apply --index "$p"; then
              git reset -q --hard; git switch -q -
              msg="🚨 自動修復: 修復の案を当てられませんでした（差分の形が壊れています）。手当てが必要です"
            else
              bad=$(git diff --cached --name-only --no-renames | grep -E '^(\.github/|\.claude/|automation/agent_settings_|automation/ai_container\.Dockerfile|scripts/agent_guard\.py|scripts/gcreds\.py|tests/gates_history_h91_agent_jail\.py|\.env)' || true)
              if [ -n "$bad" ]; then
                git reset -q --hard; git switch -q -
                msg="🚨 自動修復: 修復の案が触ってはいけない場所（鍵の外し方・許可の一覧・ワークフロー）に触れていたため置いていません。手当てが必要です"
              else
                n=$(git diff --cached --name-only | wc -l)
                git commit -q -m "selfheal: 修復の案（鍵の無い作業場で AI が作成。人が確かめてから master へ取り込む）"
                if git push -q origin "$b"; then
                  msg="🔧 自動修復: 修復の案を枝に置きました（${n}ファイル・鍵の無い作業場での検証: ${checked}）。差分を確かめてから master へ取り込んでください
          $repo/compare/master...$b"
                else
                  msg="🚨 自動修復: 修復の案を枝へ push できませんでした。手当てが必要です"
                fi
                git switch -q -
              fi
            fi
          fi
          if [ -s selfheal-out/workflow-change.patch ]; then
            msg="$msg
          ⚠️ ワークフローの変更案があります（CI の鍵では反映できないため外しました。成果物 workflow-change-repair を確認して手で反映）"
          fi
          # ここは master のコードのまま（案は上で枝に置いて戻した）
          python scripts/notify_slack.py "$msg
          $repo/actions/runs/${{ github.run_id }}" || true

  rerun:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      contains(fromJSON('["記事動画（毎日1本）", "業種調査", "業種調査の聞き足し", "Research Refresh", "Photo Shelf", "監修の記録", "Deploy to Cloudflare Pages", "Focus Mode", "Daily KPI", "AIの作業場の確かめ"]'), github.event.workflow_run.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 一時的な失敗なら1回だけ再実行
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          # ランナーの python3 は外から pip で入れられないことがある（PEP 668）。入っていれば入れない
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --user pyyaml || pip install --quiet --break-system-packages pyyaml || true
          out=$(python3 scripts/ci_rerun.py --run "$RUN_ID" 2>&1) || out="$out
          要対応: 再実行の判定が動きませんでした（${{ github.event.workflow_run.name }}）"
          echo "$out"
          if echo "$out" | grep -q '^要対応'; then
            python3 scripts/notify_slack.py "🚨 $(echo "$out" | grep '^要対応' | head -3)" || true
          fi
