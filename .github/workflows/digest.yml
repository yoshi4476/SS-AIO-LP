name: Weekly Newsletter Digest

# 毎週月曜 9:00 JST（= UTC 0:00 月曜）に週刊ダイジェストを配信
# 注: GitHub側にワークフロー未登録だったため再push（2026-07-28）
on:
  schedule:
    - cron: "0 0 * * 1"
    # 毎日 8:30 JST: Google の検索の更新（検索ステータスの発表）を見て、コアアップデートなら購読者へ知らせる
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "demo=送信せずプレビュー生成のみ"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Google の検索の更新を知らせる（毎日）
        if: github.event.schedule == '30 23 * * *'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: python scripts/season_feature.py --events --send || echo "::warning::検索の更新を確かめられませんでした（次の日にもう一度見ます）"

      - name: ダイジェスト配信
        if: github.event.schedule != '30 23 * * *'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            python scripts/send_digest.py --demo
          else
            python scripts/send_digest.py
          fi

      - name: 運用通知（Slack→メール自動フォールバック）
        if: always() && github.event.schedule != '30 23 * * *'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="📮"; else icon="🚨"; fi
          python scripts/notify_slack.py --routine "$icon 週刊ニュースレター配信: ${{ job.status }}" || true
