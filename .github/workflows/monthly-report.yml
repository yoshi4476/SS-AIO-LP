name: Monthly Consulting Report
run-name: ${{ inputs.scheduled_for && format('月次 {0}', inputs.scheduled_for) || github.event.schedule && format('月次（予備の定時） {0}', github.event.schedule) || github.workflow }}

# 毎月1日 9:00 JST（= UTC 0:00）に月次レポートPDFを生成し info.ai@7senses.co.jp へメール送付
# 実データ取得には GCP_SERVICE_ACCOUNT_JSON / GA4_PROPERTY_ID シークレットが必要。
# 未設定の間は静かにスキップする（デモデータの誤送信を防ぐため）。
on:
  schedule:
    - cron: "0 0 1 * *"     # 1日: 先月分の確定版＋改善の実行（在庫の組みは毎日の kw-stock）
    - cron: "0 0 15 * *"    # 15日: 当月の途中経過版だけ（遅れに2週間早く気づく）
  workflow_dispatch:
    inputs:
      resend_sites:
        description: "各社のレポートだけ作り直して送る（グループ版・在庫・引用の実測・改善の実行はしない）"
        type: boolean
        default: false
      force:
        description: "その日にもう済んでいても動かす（同じ日に2回目を手で流すときだけ）"
        type: boolean
        default: false
      # 定時の起動役（Cloudflare Worker）が入れる。手で動かすときは空のまま
      scheduled_for:
        description: "予定の時刻（起動役が入れる）"
        type: string
        default: ""
      token_expiry:
        description: "起動役の鍵の期限（起動役が入れる）"
        type: string
        default: ""

permissions:
  # 書き込みの権限は正本へ push するジョブにだけ付ける（ジョブごとの permissions。zizmor excessive-permissions・2026-10-20）
  contents: read
  actions: read    # 同じ日に済んだ run があるかを見る（schedule_guard）

env:
  TZ: Asia/Tokyo

jobs:
  # 同じ日に2回送らない。schedule は遅れ・取りこぼしがあり、自動修復の見張り（selfheal.yml）が取りこぼしを起動する。
  # 遅れて来た予定の run と重なると、同じレポートが2通届く。各社の作り直し（resend_sites）と force は見ない
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # push しないジョブは資格を残さない（2026-10-20）
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.resend_sites }}" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 起動役（Cloudflare Worker）の回と予備の定時の回は、同じ予定を先に受け持った回だけが動く（sched_guard）
          s=$(python3 scripts/sched_guard.py 2>&1) || true; echo "$s"
          if echo "$s" | grep -q '^SCHED_GO=no'; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          out=$(python3 scripts/schedule_guard.py --already-ran monthly-report.yml --day --run-id "${{ github.run_id }}" 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q '^ALREADY_RAN=yes'; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  report:
    permissions:
      contents: write
      actions: read
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 20社までのレポート・競合比較・改善の実行に余裕を持つ（在庫の組みは毎日の kw-stock へ移した）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # zizmor: ignore[artipacked] このジョブは正本へ push する（checkout の資格を使う）。AI の手順の前は agent_guard --lock が資格を外す

      # 非公開のデータ（お客様の情報・料金・レポート）を private/ に取得し、お客様の守秘の語をログで伏せる
      # （public のリポジトリでは CI のログも誰でも読める。2026-10-10 運用者の指示・門 gates_history_h76）
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}

      - name: 実データ設定の有無を確認
        id: gate
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GA4_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          if [ -z "$SA_JSON" ] || [ -z "$GA4_ID" ]; then
            echo "GCP_SERVICE_ACCOUNT_JSON / GA4_PROPERTY_ID が未設定のためスキップ（実データなしのレポートは送らない）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 15日の回は「当月の途中経過」だけを出す。在庫の組み直し・改善の実行・
      # 3倍計画の照合は月初だけ（途中の数字で判断すると必ず低く出る）
      - name: 月初か月中か
        id: day
        run: |
          if [ "$(date +%d)" = "15" ]; then
            echo "mid=true" >> "$GITHUB_OUTPUT"; echo "through=--through" >> "$GITHUB_OUTPUT"
          else
            echo "mid=false" >> "$GITHUB_OUTPUT"; echo "through=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール（Playwright含む）
        if: steps.gate.outputs.ready == 'true'
        run: |
          pip install -r requirements.txt
          pip install playwright google-analytics-data google-api-python-client google-auth
          python -m playwright install --with-deps chromium

      # 記事のページ・sitemap・feed を Git から外す準備（2026-10-03）。このあとの工程が手元のページを読むので、
      # 先に原稿から作っておく。作れなくても止めない（外す前は、コミット済みのページが残っている）
      - name: 原稿からページを作る
        run: |
          python scripts/build.py > /tmp/prebuild.log 2>&1 && tail -2 /tmp/prebuild.log || {
            tail -20 /tmp/prebuild.log
            echo "::warning::原稿からページを作れませんでした（このあとの工程は古いページを読みます）"
            mkdir -p automation/logs
            echo "要対応: 原稿からページを作れませんでした（$GITHUB_WORKFLOW）" >> automation/logs/findings.txt
          }

      - name: 認証情報の配置
        if: steps.gate.outputs.ready == 'true'
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GA4_ID: ${{ secrets.GA4_PROPERTY_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          # 無ければ空。空のときレポートは公開本数を「取得できず」と書く（0本とは書かない）
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          printf '%s' "$SA_JSON" > indexing-service-account.json
          {
            echo "GA4_PROPERTY_ID=$GA4_ID"
            echo "SPREADSHEET_ID=$SPREADSHEET_ID"
            echo "GSC_SITE_URL=https://ai.7senses.co.jp/"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "LEAD_FROM_EMAIL=$LEAD_FROM_EMAIL"
            echo "LEAD_TO_EMAIL=info.ai@7senses.co.jp"
          } > .env

      # お客様の社の順位・AIの語・引用の記録・前月の目標（.gitignore と置き場）を前の回から戻す。
      # 戻さないと、お客様の社だけ引用の実測が「順位の記録が無い」で飛び、競合比較の自社順位と目標の突合が空になる
      - uses: ./.github/actions/client-private
        if: steps.gate.outputs.ready == 'true'
        with: {mode: restore}
      - uses: ./.github/actions/client-private
        if: steps.gate.outputs.ready == 'true'
        with: {mode: restore, family: ai-kw, kinds: ai_kw}

      # 競合比較（compete.py）。お客様の分は public リポジトリに置かない（.gitignore）ので、キャッシュで月をまたぐ。
      # 自社だけ: 自社3サイトと月の回数はコミット済みなので、キャッシュで上書きしない
      - name: 競合比較の控えを戻す
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/compete/*
            !data/compete/ai-lab
            !data/compete/corporate
            !data/compete/subsidy
            !data/compete/_usage.json
          key: compete-${{ github.run_id }}
          restore-keys: compete-

      # Bing の検索の成績（週次の bing_webmaster.py --stats が積む）。お客様の分だけキャッシュから戻す（自社3サイトはコミット済み）
      - name: Bing の検索の成績（お客様の分）を戻す
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/bing_stats/*
            !data/bing_stats/ai-lab.json
            !data/bing_stats/corporate.json
            !data/bing_stats/subsidy.json
          key: bing-stats-${{ github.run_id }}
          restore-keys: bing-stats-

      # 実利用者の表示速度（週次の cwv_check の CrUX）。お客様の分だけキャッシュから戻す
      - name: 実利用者の表示速度（お客様の分）を戻す
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/cwv_crux/*
            !data/cwv_crux/ai-lab.json
            !data/cwv_crux/corporate.json
            !data/cwv_crux/subsidy.json
          key: cwv-crux-${{ github.run_id }}
          restore-keys: cwv-crux-

      # レポートより先に測る（レポートの「競合と比べた現在地」がこの結果を読む）。月初だけ。
      # 新しく聞く回数をサイトごとの月の上限（既定60・sites/<id>.json の compete.ai_cap）で止め、超えたらキャッシュだけで出して知らせる
      - name: 競合比較の実測と負けている理由（月初）
        if: steps.gate.outputs.ready == 'true' && steps.day.outputs.mid == 'false' && !inputs.resend_sites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CLAUDE_CITE_API_KEY: ${{ secrets.CLAUDE_CITE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          mkdir -p automation/logs
          npm install -g @anthropic-ai/claude-code@2.1.302 || true
          # 課金の前に、何回聞くことになるかを必ず記録する
          python scripts/compete.py --measure --dry-run 2>&1 | tail -25 || true
          out=$(python scripts/compete.py --measure 2>&1) || true
          echo "$out" | tail -25
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          python scripts/compete.py --gaps 2>&1 | tail -25 || true

      # 自社だけ: 自社3サイトの分はコミットするので、キャッシュに残すのはお客様の分だけ
      - name: 競合比較の控えを残す
        if: always() && steps.gate.outputs.ready == 'true' && steps.day.outputs.mid == 'false' && !inputs.resend_sites
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/compete/*
            !data/compete/ai-lab
            !data/compete/corporate
            !data/compete/subsidy
            !data/compete/_usage.json
          key: compete-${{ github.run_id }}-monthly

      # 管制塔が持つ3サイトそれぞれで発行する。以前はAI集客ラボの分しか
      # 出ておらず、コーポレートと補助金サイトの月次報告が存在しなかった。
      - name: 月次レポート生成・メール送付（サイト単体の詳細版）
        if: steps.gate.outputs.ready == 'true'
        run: |
          # 生成が異常終了した社も列に1行積む。積まないと、その社が来なかったことに誰も気づかない
          mkdir -p automation/logs
          if [ "${{ steps.day.outputs.mid }}" = "true" ]; then
            ym=$(date +%Y-%m); thr="\"$(date +%F)\""
          else
            ym=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m); thr=null
          fi
          for s in $(ls sites/*.json | xargs -n1 basename | sed "s/\.json$//" | grep -v "^sample$" | sort); do
            echo "── $s"
            # 社ごとには送らず、照合を通したものを列に積む（最後に report_digest が1通にまとめて送る）
            python scripts/monthly_report.py --site "$s" --queue ${{ steps.day.outputs.through }} || {
              echo "  $s は生成できませんでした"
              printf '{"site": "%s", "name": "%s", "ym": "%s", "pdf": "", "ok": false, "why": ["monthly_report.py が異常終了しました（実行ログ参照）"], "through": %s}\n' \
                "$s" "$s" "$ym" "$thr" >> automation/logs/report_queue.jsonl
            }
          done

      # 3サイトを1枚で見渡す経営向けのレポート。単体版とは役割が違うため別送する
      - name: グループ月次レポート生成・メール送付
        if: steps.gate.outputs.ready == 'true' && !inputs.resend_sites
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        # 照合の食い違いで止めるのは想定内（送らずに知らせる）。ここでジョブを failure にすると
        # 自動修復が再発行し、各社のまとめが2通届く。本当に落ちたときだけ failure にする
        run: |
          mkdir -p automation/logs
          rc=0
          out=$(python scripts/group_report.py --email ${{ steps.day.outputs.through }} 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            # 照合そのものが動かなかった（一時的な取得エラー等）ときは failure にして自動修復に出し直させる
            if echo "$out" | grep -q "取り直した値と食い違います" && ! echo "$out" | grep -q "照合が動きませんでした"; then
              echo "::warning::グループレポートは照合で止めました（送っていません）"
              echo "要対応: グループ月次レポートが照合で止まり、送っていません（実行ログ参照）" >> automation/logs/findings.txt
            else
              exit "$rc"
            fi
          fi

      # 対策キーワードの在庫は、ここ（毎月1日）では組まない。2026-10-09 から毎日の在庫の見張り
      # （daily-kpi.yml の kw-stock）が、未着手が1か月分を切った社だけを、月の途中でもその日に積み足す（1社1か月1回）。
      # 1日に両方で組むと同じ社を2回組むので、この工程は消した

      # AI検索に本当に引用されているかを実測する（キーがあるエンジンだけ。無ければ飛ばす）。
      # 1サイト20語・月1回。試行錯誤で本番を叩かない
      - name: AI引用の実測
        if: steps.gate.outputs.ready == 'true' && steps.day.outputs.mid == 'false' && !inputs.resend_sites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CLAUDE_CITE_API_KEY: ${{ secrets.CLAUDE_CITE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Claude は鍵が無ければサブスク（Claude Code）で聞く
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Gemini の月の検索回数は管制塔の台帳で数える（ai_cite_check.gemini_budget_ok）。渡していなかったため
          # 残りを読めず「予算なし」として Gemini を黙って飛ばしていた（2026-10-20）
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302 || true
          out=$(python scripts/ai_cite_check.py); echo "$out"
          if echo "$out" | grep -q "AI_CITED="; then
            mkdir -p automation/logs
            echo "AI引用の実測: $(echo "$out" | grep 'AI_CITED=' | sed 's/AI_CITED=//')語で引用（data/ai_citations 参照）" >> automation/logs/findings.txt
          fi

      # レポートに書いた改善点を、その場で機械が当てる。当てたら見直し（最大3回）、
      # 検算（build + ゲート）に通らなければその回の変更を捨てる。
      # 人にしかできない項目（計測の権限・LPの文言）だけをメールで知らせる
      # 3倍計画の道筋と先月の実績を突き合わせる。遅れは「要対応」として通知に載る
      - name: 3倍計画の進み
        if: steps.gate.outputs.ready == 'true' && steps.day.outputs.mid == 'false' && !inputs.resend_sites
        run: |
          mkdir -p automation/logs
          out=$(python scripts/growth_plan.py --check 2>&1) || true
          echo "$out" | tail -6
          echo "$out" | grep '^要対応' >> automation/logs/findings.txt || true
          echo "$out" | grep -q '^要対応' && echo "::warning::3倍計画から遅れています（通知に載せます）" || true

      # 改善の実行は道具の中から AI（auto_rewrite・auto_merge の claude）を呼び、AI は記事と検索上位の文章を読む。
      # ほかの AI の工程と同じく、作業場から鍵を外してから動かす（2026-10-20 の点検。Google の鍵・push の資格が
      # 作業場に置かれたままだった）。Google は読むだけ・1時間で切れる許可証にし、鍵を環境変数に持たない別の
      # プロセスが40分ごとに作り直す（見直し3回と検算で1時間を超えることがある）。配信の鍵はこの後の機械の手順だけが持つ
      - name: 改善の実行の前に作業場から鍵を外す
        id: lock
        if: steps.gate.outputs.ready == 'true' && steps.day.outputs.mid == 'false' && !inputs.resend_sites
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          HUB_AGENT_SECRET: ${{ secrets.HUB_AGENT_SECRET }}
        run: |
          # .env（メールの鍵）も作業場所の外へよける（--unlock で戻す。2026-10-20 の点検）
          python scripts/agent_guard.py --lock
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" | env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
              nohup python scripts/agent_guard.py --refresh > "$RUNNER_TEMP/agent_guard_refresh.log" 2>&1 &
          fi
          # 管制塔へは全権の合言葉ではなく、台帳とエラーの記録にだけ効く通行証で入る（改善の実行は全社を1回で回す）
          mkdir -p "$RUNNER_TEMP/hub_tokens"
          python scripts/agent_guard.py --tools-token "$RUNNER_TEMP/hub_tokens/tools" || true

      - name: レポートの改善点を実行し、残りを人へ知らせる
        id: actions
        if: steps.gate.outputs.ready == 'true' && steps.day.outputs.mid == 'false' && !inputs.resend_sites
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 台帳への積み足し（kw_discover）は通行証で入る。全権の合言葉はこの手順に置かない（道具の中の AI が親の環境を
          # 読めた。2026-10-20 の点検）。人へ知らせる文は鍵を戻した後に送る（メールの鍵は .env にあり、ここではよけている）
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ""
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302 || true
          if ! python scripts/agent_guard.py --verify; then
            echo "::warning::改善の実行の作業場に鍵が残っていたため、AI を動かしませんでした"
            mkdir -p automation/logs
            echo "要対応: 月次の改善の実行の作業場に鍵が残っていたため、AI を動かしませんでした（実行ログの AGENT_JAIL）" >> automation/logs/findings.txt
            exit 0
          fi
          export HUB_AGENT_TOKEN="$(cat "$RUNNER_TEMP/hub_tokens/tools" 2>/dev/null || true)"
          # 検算が壊れたまま当てると、悪い直しがそのまま配信される。壊れていたら当てずに終える
          python scripts/report_actions.py --selftest || { echo "::warning::report_actions の selftest NG — 改善の自動実行を飛ばします"; exit 0; }
          out=$(python scripts/report_actions.py --apply --rounds 3 --budget-min 60 2>&1) || true
          echo "$out" | tail -60
          echo "$out" | grep -q "ACTIONS_OK=yes" || echo "::warning::改善の自動実行で検算に落ちた回があります（実行ログ参照）"
          # 人へ知らせる文（report_actions.body）を鍵を戻した後の手順へ渡す（ここではメールの鍵が無く送れない）
          printf '%s\n' "$out" | sed -n '/^月次レポートの改善項目を機械で実行しました/,/^台帳: automation\/logs\/report_actions.jsonl/p' \
            > "$RUNNER_TEMP/report_actions_notice.txt" || true

      # AI が触ってはいけない場所（コード・ワークフロー・門・指示書）の変更は戻す。この後のコミットに入れない
      - name: 改善の実行で触ってはいけない場所を戻す
        if: always() && steps.lock.outcome != 'skipped'
        run: python scripts/agent_guard.py --protect

      - name: 改善の実行の後に作業場へ鍵を戻す
        if: always() && steps.lock.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN || secrets.SITE_PUSH_TOKEN }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          rm -f "$RUNNER_TEMP/hub_tokens/tools"
          python scripts/agent_guard.py --unlock

      # 直した記事は配信先にも届ける（届かなければ直した意味が無い）。鍵を持つ機械の手順
      - name: 改善の実行で直した記事をコミットし配信先へ届ける
        if: steps.actions.outcome == 'success'
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          FTP_CREDENTIALS_JSON: ${{ secrets.FTP_CREDENTIALS_JSON }}
          WP_CREDENTIALS_JSON: ${{ secrets.WP_CREDENTIALS_JSON }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          # 改善の実行が残した「人の手が要るもの」を、メールの鍵（.env）を戻した後のここで送る（2026-10-20）
          f="$RUNNER_TEMP/report_actions_notice.txt"
          if [ -s "$f" ] && grep -qE '^(■ 人の手が要るもの|🚨)' "$f"; then
            python scripts/notify_slack.py "$(cat "$f")" || true
          fi
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          # 範囲を決めて足す。レポート（reports/）は .gitignore で外れ、非公開のリポジトリへ残す（2026-10-10 守秘義務）。
          # 1つずつ足すのは、無いパスが1つあると git add 全体が何も足さずに落ちるため
          for p in articles site data docs; do
            git add -A -- "$p" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "monthly: レポートの改善点を自動実行 $(date '+%Y-%m-%d')"
          # 落ちた記事は --since のため次の回も送られない。要対応の行を通知本文へ足す（2026-10-07 の点検）
          python scripts/publish_changed.py --all --since HEAD~1 --push 2>&1 | tee /tmp/publish_changed.txt || true
          mkdir -p automation/logs
          grep '^要対応' /tmp/publish_changed.txt >> automation/logs/findings.txt || true

      # 各社のレポートを1通にまとめて送る（要対応がある社を先頭に。照合に落ちた社は理由だけ）
      - name: 各社のレポートを1通にまとめて送る
        if: always() && steps.gate.outputs.ready == 'true'
        run: python scripts/report_digest.py --email || true

      - name: 目標値の保存をコミット
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          # 1つずつ足す（まとめて渡すと、無いパスが1つあるだけで何も足されない）
          # data/compete（お客様の分は .gitignore で外れる）と data/ai_cache（課金して聞いた答え。残さないと翌週また払う）
          for p in docs/kw-plan-*.md data/ai_citations/*.json docs/ai-kw-*.md data/ai_kw data/compete data/ai_cache; do
            git add -- "$p" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "chore(report): 来月のKPI目標を保存"
          # 月初は改善の実行（上の工程）が add -A で目標値ごと先にコミットしているため、
          # ここで staged が空でも未 push のコミットが残っている。以前は「変更なし」で終わり、
          # 記事の直し・目標値・在庫計画がランナーごと消えていた。push の要否は未 push のコミットで決める
          ahead=$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline 2>/dev/null || echo "不明")
          if [ -n "$ahead" ]; then
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "保存すべき変更なし"
          fi

      # レポート（PDF・HTML）・来月の目標値・3倍計画は非公開のリポジトリの reports/ に書いた（private_store）。
      # public のリポジトリには置かない（自社3サイトの実数・問い合わせの数を含む。2026-10-10 運用者の指示）
      - name: レポートと目標値を非公開のリポジトリへ残す
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          python3 scripts/private_store.py --push "月次: レポートと目標値 $(date '+%Y-%m-%d')" \
            || echo "::warning::レポートと目標値を非公開のリポジトリへ残せませんでした（鍵 PRIVATE_DATA_TOKEN／SITE_PUSH_TOKEN の権限を確認）"

      # お客様の社の来月の目標・在庫計画・引用の実測（コミットしない分）を次の回へ残す
      - uses: ./.github/actions/client-private
        if: always() && steps.gate.outputs.ready == 'true'
        with: {mode: save}

      - name: 運用通知（Slack→メール自動フォールバック）
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="📊"; else icon="🚨"; fi
          # レポート本体は monthly_report --email が送る。ここは失敗したときと、
          # 工程が findings.txt に積んだ要対応（3倍計画の遅れ・ラッコの予算超過）があるときだけ届く
          found=""
          if [ -f automation/logs/findings.txt ]; then found=$(cat automation/logs/findings.txt); fi
          python scripts/notify_slack.py --routine "$icon 月次レポート: ${{ job.status }}（info.ai@7senses.co.jp へ送付）
          $found" || true

      # 「認証情報の配置」が書いた Google の鍵と .env（メールの鍵）を消す。消していなかった（2026-10-20 の点検）。
      # ほかのワークフローと同じく、ジョブの終わりに必ず消す
      - name: 鍵の後始末
        if: always()
        run: rm -f indexing-service-account.json .env

      # この回に書いた・直したお客様の社の記事・画像・台本・記録を非公開のリポジトリへ残す（公開側の git には入れない。
      # 公開側に commit が無い回も残す。門 gates_history_h77）
      - uses: ./.github/actions/private-data
        if: always()
        with: {mode: save}

