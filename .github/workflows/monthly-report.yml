name: Monthly Consulting Report

# 毎月1日 9:00 JST（= UTC 0:00）に月次レポートPDFを生成し info.ai@7senses.co.jp へメール送付
# 実データ取得には GCP_SERVICE_ACCOUNT_JSON / GA4_PROPERTY_ID シークレットが必要。
# 未設定の間は静かにスキップする（デモデータの誤送信を防ぐため）。
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write  # 目標値（reports/targets.json）を保存するため

env:
  TZ: Asia/Tokyo

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 在庫の組み直し（kw_plan）が1サイト10分前後かかる
    steps:
      - uses: actions/checkout@v4

      - name: 実データ設定の有無を確認
        id: gate
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GA4_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          if [ -z "$SA_JSON" ] || [ -z "$GA4_ID" ]; then
            echo "GCP_SERVICE_ACCOUNT_JSON / GA4_PROPERTY_ID が未設定のためスキップ（実データなしのレポートは送らない）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール（Playwright含む）
        if: steps.gate.outputs.ready == 'true'
        run: |
          pip install -r requirements.txt
          pip install playwright google-analytics-data google-api-python-client google-auth
          python -m playwright install --with-deps chromium

      - name: 認証情報の配置
        if: steps.gate.outputs.ready == 'true'
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GA4_ID: ${{ secrets.GA4_PROPERTY_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
        run: |
          printf '%s' "$SA_JSON" > indexing-service-account.json
          {
            echo "GA4_PROPERTY_ID=$GA4_ID"
            echo "GSC_SITE_URL=https://ai.7senses.co.jp/"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "LEAD_FROM_EMAIL=$LEAD_FROM_EMAIL"
            echo "LEAD_TO_EMAIL=info.ai@7senses.co.jp"
          } > .env

      # 管制塔が持つ3サイトそれぞれで発行する。以前はAI集客ラボの分しか
      # 出ておらず、コーポレートと補助金サイトの月次報告が存在しなかった。
      - name: 月次レポート生成・メール送付（サイト単体の詳細版）
        if: steps.gate.outputs.ready == 'true'
        run: |
          for s in $(ls sites/*.json | xargs -n1 basename | sed "s/\.json$//" | grep -v "^sample$" | sort); do
            echo "── $s"
            python scripts/monthly_report.py --site "$s" --email || echo "  $s は生成できませんでした"
          done

      # 3サイトを1枚で見渡す経営向けのレポート。単体版とは役割が違うため別送する
      - name: グループ月次レポート生成・メール送付
        if: steps.gate.outputs.ready == 'true'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: python scripts/group_report.py --email

      # 目標値は翌月号の達成率突合に使うためリポジトリへ残す
      # 対策キーワードの在庫を、月1回・必要なサイトだけ組み直す。
      # 毎週やると課金が伸びる。未着手が40本以上あるサイトは飛ばし、
      # 応答は30日キャッシュされるため、同じ起点への問い合わせは月1回しか課金されない。
      # RAKKO_API_KEY が無ければ何もしない（無料のサジェストだけの補充は週次が担う）
      - name: 対策キーワードの在庫を組み直す（必要なサイトだけ）
        if: steps.gate.outputs.ready == 'true'
        env:
          RAKKO_API_KEY: ${{ secrets.RAKKO_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          if [ -z "$RAKKO_API_KEY" ]; then echo "RAKKO_API_KEY 未設定 — 組み直しはスキップ"; exit 0; fi
          # 課金の前に、必ず構成と見積もりを記録する（ルール: 設計を固めてからラッコは1回だけ）
          python scripts/kw_plan.py --all --if-needed --dry-run 2>&1 | grep -E "^■|RAKKO_EST|dry-run|見積もり" || true
          # 本番。スクリプト側が見積もりと月の目安を見て、超えていれば取得しない
          out=$(python scripts/kw_plan.py --all --if-needed --replace 2>&1) || true
          echo "$out" | tail -40
          if echo "$out" | grep -q "RAKKO_GUARD=over"; then
            echo "::warning::ラッコの予算を超えるため、在庫の組み直しを取得せずに終えたサイトがあります"
            mkdir -p automation/logs
            echo "要対応: ラッコの月の目安を超えるため在庫の組み直しを見送りました（目安の見直しか来月）" >> automation/logs/findings.txt
          fi
          if echo "$out" | grep -q "クレジットが尽きました"; then
            echo "::warning::ラッコキーワードのクレジットが尽きました（在庫の組み直しは途中まで）"
            mkdir -p automation/logs
            echo "要対応: ラッコキーワードのクレジットが尽きました（在庫の組み直しが途中）" >> automation/logs/findings.txt
          fi

      - name: 目標値の保存をコミット
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"
          git add reports/targets.json reports/targets-*.json docs/kw-plan-*.md || true
          if git diff --cached --quiet; then
            echo "保存すべき目標値の変更なし"
          else
            git commit -m "chore(report): 来月のKPI目標を保存"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: 運用通知（Slack→メール自動フォールバック）
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="📊"; else icon="🚨"; fi
          # レポート本体は monthly_report --email が送る。ここは失敗したときだけ
          python scripts/notify_slack.py --routine "$icon 月次レポート: ${{ job.status }}（info.ai@7senses.co.jp へ送付）" || true
