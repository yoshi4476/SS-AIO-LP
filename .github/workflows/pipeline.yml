name: Article Pipeline (Rescue)

# 通常の記事作成は pipeline-multi.yml（3サイト統合版）が担当する。
# こちらは「その日の記事が公開できていない場合の救済」専用として残している。
# 二重に記事を作らないよう、朝夜の枠は統合版へ移設済み。
# JST = UTC+9。cronはUTC表記（Actionsの仕様）
on:
  schedule:
    - cron: "30 12 * * *"  # JST 21:30 — 同日救済（未公開があれば再挑戦）
  workflow_dispatch:
    inputs:
      mode:
        description: "main=記事作成 / rescue=救済チェックのみ"
        type: choice
        options: [main, rescue]
        default: main

permissions:
  contents: write

concurrency:
  group: article-pipeline
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 救済モードは最大6本（3サイト×2本）の書き直し・追加公開まで行うため長めに取る
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 実行モード判定（21:30の枠だけ救済モード）
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 12 * * *" ]; then
            echo "mode=rescue" >> "$GITHUB_OUTPUT"
          else
            echo "mode=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール（Python・日本語フォント・Claude Code）
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          npm install -g @anthropic-ai/claude-code

      - name: Git識別情報の設定
        run: |
          git config user.name "AIO Pipeline Bot"
          git config user.email "noreply@7senses.co.jp"

      # KWキューの残数をログに残す（枯渇の予兆を実行ログから追えるようにする）
      - name: KWキュー残数の確認
        run: python scripts/kw_status.py

      - name: 記事パイプライン実行（Phase 1〜7）
        if: steps.mode.outputs.mode == 'main'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          claude -p "$(cat automation/pipeline_prompt.txt)" \
            --dangerously-skip-permissions --max-turns 160

      - name: 公開失敗の即時リトライ（最大2回）
        if: steps.mode.outputs.mode == 'main'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for i in 1 2; do
            out=$(python scripts/build.py); echo "$out"
            echo "$out" | grep -q "BLOCKED" || break
            echo "::warning::BLOCKED記事あり — リトライ $i/2"
            claude -p "$(cat automation/retry_prompt.txt)" \
              --dangerously-skip-permissions --max-turns 160
          done

      # 3サイト分の当日ノルマ（各2本）・品質・担当領域・KW供給を機械監査し、
      # 不足があればその日のうちに書き直し・追加公開まで行う
      - name: 同日救済（3サイトの監査 → 不足分の作成・修正）
        if: steps.mode.outputs.mode == 'rescue'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > indexing-service-account.json
          fi
          out=$(python scripts/daily_audit.py --fix-kw); echo "$out"
          if echo "$out" | grep -q "AUDIT_OK=yes"; then
            echo "救済不要（3サイトとも当日ノルマ達成・BLOCKEDなし・領域違反なし）"
            rm -f indexing-service-account.json
            exit 0
          fi
          claude -p "$(cat automation/retry_prompt.txt)" \
            --dangerously-skip-permissions --max-turns 300
          rm -f indexing-service-account.json

      - name: 救済後の再監査（残った問題をログとエラーログに残す）
        if: steps.mode.outputs.mode == 'rescue'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
        run: |
          out=$(python scripts/daily_audit.py --fix-kw); echo "$out"
          if echo "$out" | grep -q "AUDIT_OK=no"; then
            echo "$out" | grep "^TODO:" | while IFS= read -r t; do
              echo "::warning::救済後も未解決: $t"
              python scripts/hub_client.py error_log rescue "$t" || true
            done
          fi

      # 順位を測らないとリライト対象が勘になる。GSCの実データを日次で残す
      - name: 順位の記録とAI引用の推定
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > indexing-service-account.json
            pip install --quiet google-api-python-client google-auth
            python scripts/rank_track.py || true
            python scripts/ai_citation_check.py || true
            rm -f indexing-service-account.json
          else
            echo "::warning::GCP_SERVICE_ACCOUNT_JSON が未設定のため順位を記録できません"
          fi

      - name: 最終ビルドとコミット
        run: |
          python scripts/build.py
          # ローカルKPI集計（kpi_feedback.md を更新し翌回の学習に使う）
          python scripts/local_kpi.py
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            git commit -m "publish: auto pipeline $(date '+%Y-%m-%d %H:%M JST')"
            # 他の実行（ローカル/手動）が先にpushしていても生成記事を失わない。
            # rebase衝突時は自動解決: リモート削除は尊重 / 共有ファイルはリモート優先 / 新規生成物は保全
            for i in 1 2 3; do
              git push && break
              echo "push拒否 → リモートと統合して再試行 ($i/3)"
              if ! git pull --rebase -X ours origin "${GITHUB_REF_NAME}"; then
                git diff --name-only --diff-filter=U | while IFS= read -r f; do
                  if git cat-file -e "origin/${GITHUB_REF_NAME}:$f" 2>/dev/null; then
                    git checkout --ours -- "$f" 2>/dev/null && git add -- "$f" || git rm -f --ignore-unmatch -- "$f"
                  else
                    git rm -f --ignore-unmatch -- "$f"
                  fi
                done
                GIT_EDITOR=true git rebase --continue || git rebase --skip || git rebase --abort
              fi
            done
          fi

      # GITHUB_TOKENによるpushはdeploy.ymlを起動しない（GitHubの再帰防止仕様）ため、ここで直接デプロイする
      - name: Cloudflare Pagesへデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for i in 1 2 3; do
            npx --yes wrangler@4 pages deploy site --project-name=ss-aio-lp --branch=master --commit-dirty=true && exit 0
            echo "Cloudflare APIが応答せず（$i/3）。40秒後に再試行"
            sleep 40
          done
          echo "::error::3回ともデプロイ失敗。記事はコミット済みなので次回のデプロイで反映される"
          exit 1

      - name: 新規URLをIndexNow通知
        run: python scripts/notify_indexnow.py || true

      - name: Google Indexing API即時登録（本日公開分）
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > indexing-service-account.json
            python scripts/notify_indexing.py || true
            rm -f indexing-service-account.json
          else
            echo "GCP_SERVICE_ACCOUNT_JSON 未設定 — スキップ"
          fi

      - name: 運用通知（Slack→メール自動フォールバック）
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
          NOTIFY_TO_EMAIL: info.ai@7senses.co.jp
        run: |
          if [ "${{ job.status }}" = "success" ]; then icon="✅"; else icon="🚨"; fi
          latest=$(git log -1 --pretty=%s)
          python scripts/notify_slack.py "$icon 記事パイプライン（${{ steps.mode.outputs.mode }}モード）: ${{ job.status }}
          最新コミット: $latest
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
