name: お客様の非公開データの持ち越し
description: >-
  お客様の社の検索語・順位・AIの出典を、public のリポジトリにも成果物（artifact）にも置かずに、
  CI のキャッシュで書いた工程から読む工程へ渡す。置き場は data/clients/<id>/private/（.gitignore）。
  何を写し、全社で1ファイルの記録のどこを分けるかは scripts/client_private.py が決める。
  .gitignore で外しただけだと CI の実行ごとに消え、順位の推移・AIの語の優先・引用の実測・
  競合比較の自社順位がお客様の社だけ空になっていた（2026-10-08 の点検）。

inputs:
  mode:
    description: restore（読む工程の始め）か save（書いた工程の終わり）
    required: true
  family:
    description: >-
      キャッシュの系統。private（記事の枠・救済・週次・月次が書く全部）／ai-kw（週次の KW 補充が書く AI の語）／
      index（週次の URL 検査が書く記録）。並行ジョブが書いた分を、別のジョブの古い写しで上書きしないために分ける
    default: private
  kinds:
    description: 写す・戻すサイトごとの記録の種類（client_private.PER_SITE の名前。空なら全部、- なら写さない）
    default: ""

runs:
  using: composite
  steps:
    # 戻す前と後の中身を覚える。残すときに「このジョブで変えたファイル」だけを最新の写しに重ねるため
    - if: inputs.mode == 'restore'
      shell: bash
      run: python3 scripts/client_private.py --mark-before || true

    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: data/clients/*/private
        key: client-${{ inputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: client-${{ inputs.family }}-

    - if: inputs.mode == 'restore'
      shell: bash
      run: |
        python3 scripts/client_private.py --mark-after || true
        python3 scripts/client_private.py --unpack ${{ inputs.kinds != '' && format('--kinds {0}', inputs.kinds) || '' }} || true

    # 戻した記録（お客様の検索語・順位・キーワード計画）の語もログで伏せる。CI のログは public（守秘義務。2026-10-10）。
    # 非公開のリポジトリの取得と最初の伏せは .github/actions/private-data（checkout の直後）が行う
    - if: inputs.mode == 'restore'
      shell: bash
      run: python3 scripts/ci_mask.py || true

    - if: inputs.mode == 'save'
      id: pack
      shell: bash
      run: |
        python3 scripts/client_private.py --pack ${{ inputs.kinds != '' && format('--kinds {0}', inputs.kinds) || '' }} || true
        n=$(python3 scripts/client_private.py --stash 2>/dev/null | sed -n 's/^CLIENT_PRIVATE_STASHED=//p')
        echo "このジョブで書いた・変えたお客様のファイル: ${n:-数えられません}"
        if ! compgen -G "data/clients/*/private" > /dev/null; then exit 0; fi
        case "$n" in
          0) ;;                                                     # 何も変えていない（戻した写しのまま。残さない）
          ''|*[!0-9]*) echo "any=yes" >> "$GITHUB_OUTPUT" ;;         # 数えられない回は重ねずにそのまま残す
          *) echo "any=yes" >> "$GITHUB_OUTPUT"; echo "merge=yes" >> "$GITHUB_OUTPUT" ;;
        esac

    # private の系統は記事の枠・救済・週次・月次が書く。月次は記事の枠と同じ直列のグループに入れられない
    # （待っている run は後から来た枠に取り消される）ので、重なっても失わないよう、残す直前に一番新しい写しを
    # 重ね直し、このジョブで変えたファイルだけを戻してから残す（後から残した方が先の方の更新を消していた）
    - if: inputs.mode == 'save' && inputs.family == 'private' && steps.pack.outputs.merge == 'yes'
      uses: actions/cache/restore@v4
      with:
        path: data/clients/*/private
        key: client-${{ inputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}-latest
        restore-keys: client-${{ inputs.family }}-

    - if: inputs.mode == 'save' && inputs.family == 'private' && steps.pack.outputs.merge == 'yes'
      shell: bash
      run: python3 scripts/client_private.py --unstash || true

    - if: inputs.mode == 'save' && steps.pack.outputs.any == 'yes'
      uses: actions/cache/save@v4
      with:
        path: data/clients/*/private
        key: client-${{ inputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}

    # 非公開のリポジトリ（private/。キーワード計画・レポート）にこの回で書いた分を残す。キャッシュは7日で消えるので、
    # 元の情報は非公開のリポジトリに置く（private_store）。private/ が無い回は何もしない
    - if: inputs.mode == 'save'
      shell: bash
      run: |
        python3 scripts/private_store.py --push "CI: ${{ github.workflow }} / ${{ github.job }}（run ${{ github.run_id }}）" || true
